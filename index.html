const Q=[{"id":"g1","bank":"general","type":"서술형","area":"01 시스템 보안","topic":"전체 개요","q":"개인정보처리시스템에서 접근권한·접근통제·접속기록 관리가 필요한 이유를 설명하고 인터넷망 접근 제한 시 확인할 사항을 두 가지 쓰시오.","a":"접근권한을 최소 권한으로 부여·변경·말소하고, 비인가 접근을 차단하며 접속기록을 보관·점검한다. 인터넷망 접근 제한은 처리 규모·업무 역할 등 현행 고시의 적용 대상과 허용 예외를 확인해야 한다.","e":"노트의 “100만 명” 조건만을 절대적 기준으로 암기하지 않는다. 2026.7.1. 시행 개인정보의 안전성 확보조치 기준의 적용 조건 및 예외를 확인한다.","source":1,"corrected":true,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g2","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"(대분류 제목)","q":"운영체제의 계정, 권한, 파일 시스템, 프로세스, 감사로그 등을 보호하는 보안 분야를 쓰시오.","a":"시스템 보안","e":"서버·클라이언트 운영체제와 로컬 시스템 자산의 보안 설정을 다루는 분야이다.","source":2,"corrected":false,"legal":false},{"id":"g3","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"기억장치","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n보조기억장치(hdd)의 섹터1에(가)(Master Boot Record, (나)) 존재 : Boot Loader의 주소 있음. 섹터1 지우면 부팅이 안됨","a":"(가) MBR / (나) 512byte","e":"보조기억장치(hdd)의 섹터1에 MBR(Master Boot Record, 512byte) 존재 : Boot Loader의 주소 있음. 섹터1 지우면 부팅이 안됨","source":3,"corrected":false,"legal":false,"sourceNote":"보조기억장치(hdd)의 섹터1에 MBR (Master Boot Record, 512byte ) 존재 : Boot Loader의 주소 있음. 섹터1 지우면 부팅이 안됨","sourceTopic":"기억장치","verifiedNote":"MBR 구조는 레거시 BIOS/MBR 파티션 방식의 설명이며, UEFI/GPT 부팅에는 그대로 적용되지 않습니다. MBR의 전통적 섹터 크기는 512바이트입니다."},{"id":"g4","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"기억장치","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nReplacement : FIFO, LFU(빈도 적은것), (가)(최근에 안쓴 것. 많이 사용됨), NUR(참조 비트·수정 비트 이용, 최근 참조되지 않은 페이지 우선), SCR(참조비트. 1번 기회 더줌), Optimal","a":"(가) LRU","e":"Replacement : FIFO, LFU(빈도 적은것), LRU(최근에 안쓴 것. 많이 사용됨), NUR(참조 비트·수정 비트 이용, 최근 참조되지 않은 페이지 우선), SCR(참조비트. 1번 기회 더줌), Optimal","source":4,"corrected":false,"legal":false,"sourceNote":"Placement : First fit, Best fit(느림), Worst fit, Next fit(직전 검색 위치 다음 first)\n\nReplacement : FIFO, LFU(빈도 적은것), LRU (최근에 안쓴 것. 많이 사용됨), NUR(참조비트. 최근 수정되지 않은것), SCR(참조비트. 1번 기회 더줌), Optimal","sourceTopic":"기억장치","verifiedNote":"NUR/NRU는 참조(R)·수정(M) 비트를 이용해 교체 우선순위를 결정합니다. 단순히 최근에 수정되지 않은 페이지를 교체한다는 정의는 부정확합니다."},{"id":"g5","bank":"general","type":"서술형","area":"01 시스템 보안","topic":"기억장치","q":"가상기억장치에서 주소 변환이 필요한 이유를 쓰고 Windows에서 페이지 파일을 확인할 때 사용할 수 있는 이름을 쓰시오.","a":"가상주소를 MMU와 페이지 테이블 등을 이용하여 물리주소로 매핑한다. Windows의 페이지 파일 이름은 pagefile.sys이다.","e":"가상기억장치는 “매핑 없이” 구현되지 않는다. 가상주소-물리주소 변환은 핵심 원리이다.","source":5,"corrected":true,"legal":false,"verifiedNote":"가상주소→물리주소 변환은 페이지 테이블·MMU 등을 이용합니다. 가상기억장치가 매핑을 생략하는 것은 아닙니다.","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g6","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"프로세스","q":"실행 파일을 삭제한 뒤에도 실행 중인 리눅스 PID가 5900이다. (1) /proc의 성격, (2) 실행 파일 연결 경로, (3) 파일 확보 명령을 작성하시오.","a":"(1) /proc는 커널·프로세스 정보를 보여 주는 가상 파일 시스템, (2) /proc/5900/exe, (3) cp /proc/5900/exe /tmp/recovered-exe","e":"리눅스가 프로그램 복사본을 /proc에 저장하여 실행하는 것은 아니다. 실행 중인 파일에 연결된 /proc/PID/exe를 이용해 복구할 수 있는 사례가 있다.","source":6,"corrected":true,"legal":false,"verifiedNote":"/proc은 실행 파일 복사 저장소가 아니라 가상 파일 시스템입니다. /proc/PID/exe는 해당 프로세스가 실행 중인 파일을 가리키는 심볼릭 링크입니다.","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g7","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"프로세스","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n윈도우 보안 : Library Call(UserMode에서만 호출), (가)(UserMode에서 KernalMode 호출. 사용자 모드에서 운영체제 커널 기능을 요청하는 인터페이스)","a":"(가) System Call","e":"윈도우 보안 : Library Call(UserMode에서만 호출), System Call(UserMode에서 KernalMode 호출. 사용자 모드에서 운영체제 커널 기능을 요청하는 인터페이스)","source":7,"corrected":false,"legal":false,"sourceNote":"윈도우 보안 : Library Call(UserMode에서만 호출), System Call (UserMode에서 KernalMode 호출. UserMode와 KernalMode로 나눠서 동작하는 시스템=마이크로 컴퓨터)","sourceTopic":"프로세스"},{"id":"g8","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"프로세스","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n프로세스 상태 전이 : 준비→실행((가)), 실행→준비((나)), 실행→대기(block)","a":"(가) Dispatch / (나) Timer runout","e":"프로세스 상태 전이 : 준비→실행(Dispatch), 실행→준비(Timer runout), 실행→대기(block)","source":8,"corrected":false,"legal":false,"sourceNote":"프로세스 상태 전이 : 준비→실행( Dispatch ), 실행→준비( Timer runout ), 실행→대기(block)\n\n프로세스 스케줄링 : 비선점(FCFS, SJF), 선점(라운드로빈, SRT), 멀티레벨큐(우선순위+RR), 멀티레벨피드백큐(멀티레벨큐+시간종료시 다음 우선순위로 이동)","sourceTopic":"프로세스"},{"id":"g9","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"프로세스","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n교착상태 해결 방안 : 예방(4가지 조건 중 1개 안만듦), 회피((가)자원 할당 전 교착상태 발생 안할 안전한 경우에만 할당), 탐지((나)), 복구(희생자 선택)","a":"(가) 은행원 알고리즘 / (나) 자원할당그래프","e":"교착상태 해결 방안 : 예방(4가지 조건 중 1개 안만듦), 회피(은행원 알고리즘, 자원 할당 전 교착상태 발생 안할 안전한 경우에만 할당), 탐지(자원할당그래프), 복구(희생자 선택)","source":9,"corrected":false,"legal":false,"sourceNote":"교착상태 해결 방안 : 예방(4가지 조건 중 1개 안만듦), 회피( 은행원 알고리즘, 자원 할당 전 교착상태 발생 안할 안전한 경우에만 할당), 탐지( 자원할당그래프 ), 복구(희생자 선택)","sourceTopic":"프로세스"},{"id":"g10","bank":"general","type":"서술형","area":"01 시스템 보안","topic":"프로세스","q":"SCAN, C-SCAN, C-LOOK 디스크 스케줄링의 이동 방식 차이를 각각 서술하시오.","a":"SCAN은 한 방향으로 이동하며 요청을 처리하다 방향을 바꾼다. C-SCAN은 한 방향으로만 처리하고 끝에서 반대편으로 이동한다. C-LOOK은 물리적 디스크 끝이 아니라 요청이 있는 마지막 실린더까지만 이동한 뒤 반대쪽 요청 끝으로 돌아가 같은 방향으로 처리한다.","e":"C-LOOK을 단순히 “반대로 가는 SCAN”으로 정리하면 C-SCAN 계열과의 차이를 놓친다.","source":10,"corrected":true,"legal":false,"verifiedNote":"SCAN은 끝 방향으로 처리 후 역방향 처리, C-SCAN은 끝으로 간 후 처음 위치로 점프하여 같은 방향 처리, C-LOOK은 실제 요청 범위 끝까지만 이동하고 반대쪽 요청 위치로 점프합니다.","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g11","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"파일 시스템(=탐색기)","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : 파일 단위 암호화(키 OS 저장, 암호화 파일을 다른 곳 복사 시 암호화 풀림) 지원","a":"(가) EFS 암호화","e":"EFS 암호화 : 파일 단위 암호화(키 OS 저장, 암호화 파일을 다른 곳 복사 시 암호화 풀림) 지원","source":11,"corrected":false,"legal":false,"sourceNote":"NTFS : Windows에서 사용하는 파일 시스템으로, 파일 암호화(EFS), 저널링, 접근 권한 관리 등의 기능을 지원\n\nEFS 암호화 : 파일 단위 암호화(키 OS 저장, 암호화 파일을 다른 곳 복사 시 암호화 풀림) 지원","sourceTopic":"파일 시스템(=탐색기)","verifiedNote":"EFS는 NTFS 파일·폴더 단위 암호화입니다. 복사 시 암호화 유지 여부는 대상 파일시스템·복사 방식·권한에 따라 달라져 항상 복호화된다고 단정할 수 없습니다."},{"id":"g12","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"파일 시스템(=탐색기)","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\ncf. (가): 드라이브 단위 암호화(TPM이라는 HW에 키 저장)","a":"(가) BitLocker","e":"cf. BitLocker: 드라이브 단위 암호화(TPM이라는 HW에 키 저장)","source":12,"corrected":false,"legal":false,"sourceNote":"cf. BitLocker : 드라이브 단위 암호화(TPM이라는 HW에 키 저장)","sourceTopic":"파일 시스템(=탐색기)"},{"id":"g13","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"리눅스 쉘 환경변수","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가): 실행할 명령어 찾을 경로. 보안상 ‘(나)넣지 않음. → 백도어로 들어와 ls 등의 이름으로 파일 심어놓고 간 경우, .이 있으면 실행이 됨. → echo $PATH로 패스 등록된 명령어 확인","a":"(가) PATH / (나) .(현재디렉터리)’","e":"PATH : 실행할 명령어 찾을 경로. 보안상 ‘.(현재디렉터리)’ 넣지 않음. → 백도어로 들어와 ls 등의 이름으로 파일 심어놓고 간 경우, .이 있으면 실행이 됨. → echo $PATH로 패스 등록된 명령어 확인","source":13,"corrected":false,"legal":false,"sourceNote":"PATH : 실행할 명령어 찾을 경로. 보안상 ‘ .(현재디렉터리)’ 넣지 않음. → 백도어로 들어와 ls 등의 이름으로 파일 심어놓고 간 경우, .이 있으면 실행이 됨. → echo $PATH로 패스 등록된 명령어 확인","sourceTopic":"리눅스 쉘 환경변수"},{"id":"g14","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"리눅스 배너 설정파일의 종류","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가): 로컬 연결 시 로그인 전 메시지 /etc/issue","a":"(가) issue","e":"issue : 로컬 연결 시 로그인 전 메시지 /etc/issue","source":14,"corrected":false,"legal":false,"sourceNote":"issue : 로컬 연결 시 로그인 전 메시지 /etc/issue\n\nissue.net : 텔넷 접속 시 로그인 전 메시지 /etc/issue.net","sourceTopic":"리눅스 배너 설정파일의 종류"},{"id":"g15","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 배너 설정파일의 종류","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n(가): 텔넷 접속 시 로그인 전 메시지 /etc/issue.net","a":"(가) issue.net","e":"issue.net : 텔넷 접속 시 로그인 전 메시지 /etc/issue.net","source":15,"corrected":false,"legal":false,"sourceNote":"issue : 로컬 연결 시 로그인 전 메시지 /etc/issue\n\nissue.net : 텔넷 접속 시 로그인 전 메시지 /etc/issue.net\n\nmotd : 텔넷, ssh 로그인 성공 시 메시지 /etc/motd","sourceTopic":"리눅스 배너 설정파일의 종류","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g16","bank":"gener hell code) 삽입. 단, 메모리 실행권한 확보해야 함(=DEP Data Execution Prevention 를 풀어줘야 의미 있음).","source":127,"corrected":false,"legal":false,"sourceNote":"Heap Spray : 동적 메모리 공간(Heap)에 악성코드(Shell code) 삽입. 단, 메모리 실행권한 확보해야 함(=DEP Data Execution Prevention 를 풀어줘야 의미 있음).","sourceTopic":"기타 보안"},{"id":"g128","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"기타 보안","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n(가)(Address Space Layout Randomization, (나)) : (다). <예> sysctl -w kernel.(라)(스택, 힙 모두 적용) cf. 다른 해결법 : (마)(None excute bit, True로 설정하여(바)), (사)(함수의 진입과 종료 코드 검사), (아)(함수의 복귀주소 방어)","a":"(가) ASLR / (나) 랜덤스택, 주소공간배치 난수화 / (다) 메모리 주소 동적 할당으로 메모리에서의 실행 방지 / (라) randomize_va_space=2 / (마) Nx bit / (바) 스택과 힙의 영역의 실행권한 제거 / (사) 스택가드 / (아) 스택쉴드","e":"ASLR(Address Space Layout Randomization, 랜덤스택, 주소공간배치 난수화) : 메모리 주소 동적 할당으로 메모리에서의 실행 방지. <예> sysctl -w kernel.randomize_va_space=2(스택, 힙 모두 적용) cf. 다른 해결법 : Nx bit(None excute bit, True로 설정하여 스택과 힙의 영역의 실행권한 제거), 스택가드(함수의 진입과 종료 코드 검사), 스택쉴드(함수의 복귀주소 방어)","source":128,"corrected":false,"legal":false,"sourceNote":"ASLR (Address Space Layout Randomization, 랜덤스택, 주소공간배치 난수화 ) : 메모리 주소 동적 할당으로 메모리에서의 실행 방지 . <예> sysctl -w kernel. randomize_va_space=2 (스택, 힙 모두 적용) cf. 다른 해결법 : Nx bit (None excute bit, True로 설정하여 스택과 힙의 영역의 실행권한 제거 ), 스택가드 (함수의 진입과 종료 코드 검사), 스택쉴드 (함수의 복귀주소 방어)","sourceTopic":"기타 보안","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g129","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"기타 보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n유닉스(solaris) NX 비트 활성화 방법 : set (가) = (나), set noexex_user_stack_log =(다)","a":"(가) noexec_user_statk / (나) 1 / (다) 1","e":"유닉스(solaris) NX 비트 활성화 방법 : set noexec_user_statk = 1, set noexex_user_stack_log = 1","source":129,"corrected":false,"legal":false,"sourceNote":"유닉스(solaris) NX 비트 활성화 방법 : set noexec_user_statk = 1 , set noexex_user_stack_log = 1","sourceTopic":"기타 보안"},{"id":"g130","bank":"general","type":"단답형","area" rected":false,"legal":false,"sourceNote":"TCP의 ESTABLISHED : 3way 핸드쉐이킹 이후 연결확립 = 세션이 공유된 상태 (연결 된 것으로 인식) → netstat -p tcp로 확인(윈도 명령어)","sourceTopic":"전송 계층 보안( 연결 지향 서비스 - TCP)","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g179","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"연결(+1) 및 전송(+byte수), 연결끊기(4-way) 과정에서 sequence number","q":"TCP 연결 수립 시 SYN이 Sequence Number를 몇 증가시키는지, 데이터 N바이트 전송 시 몇 증가하는지 쓰시오.","a":"SYN은 1 증가, 데이터 N바이트는 N 증가","e":"FIN 역시 시퀀스 공간 1을 소비한다.","source":179,"corrected":false,"legal":false,"lessonIds":["tcp-ip"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g180","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"전송 계층 보안( 연결 지향 서비스 - TCP)","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nTCP Flag : SYN(연결 동기화 요구), ACK(응답 확인), PSH(수신자에게 신속 전송 요구), URG(긴급 포인터), FIN(정상 접속 종료), (가)(비정상 종료/연결 거부 reset, (나)에 악용됨)","a":"(가) RST / (나) 세션 하이재킹","e":"TCP Flag : SYN(연결 동기화 요구), ACK(응답 확인), PSH(수신자에게 신속 전송 요구), URG(긴급 포인터), FIN(정상 접속 종료), RST(비정상 종료/연결 거부 reset, 세션 하이재킹에 악용됨)","source":180,"corrected":false,"legal":false,"sourceNote":"TCP Flag : SYN(연결 동기화 요구), ACK(응답 확인), PSH(수신자에게 신속 전송 요구), URG(긴급 포인터), FIN(정상 접속 종료), RST (비정상 종료/연결 거부 reset, 세션 하이재킹 에 악용됨)","sourceTopic":"전송 계층 보안( 연결 지향 서비스 - TCP)","lessonIds":["tcp-ip"]},{"id":"g181","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"에러 제어","q":"오류 검출과 오류 정정의 차이를 쓰고, CRC와 해밍 코드의 대표 용도를 구분하시오.","a":"CRC는 전송 데이터의 오류 검출에 널리 쓰인다. 해밍 코드는 여분 비트를 이용해 조건에 따라 오류 검출 및 정정이 가능하다.","e":"FEC(전방 오류 정정) 예시로 CRC만 제시하면 잘못된 설명이 된다.","source":181,"corrected":true,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g182","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"에러 제어","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\n(가)(Backward Error Correnction, 후진 오류 정정) : 에러 발생 데이터 다시 전송하는 방식. (나)(Auto Repeat reQuest) 자동 재전송 요구 기법 3가지 → Stop-and-Wait(하나씩 확인. 재전송), Go-Back-N(N번 부터 재전송), Selective Repeat(잘못된 것만 선택 재전송)","a":"(가) BEC / (나) ARQ","e":"BEC(Backward Error Correnction, 후진 오류 정정) : 에러 발생 데이터 다시 전송하는 방식. ARQ(Auto Repeat reQuest) 자동 재전송 요구 기법 3가지 → Stop-and-Wait(하나씩 확인. 재전송), Go-Back-N(N번 부터 재전송), Selective Repeat(잘못된 것만 선택 재전송)","source":182,"corrected":false,"legal":false,"sourceNote":"FEC (Forward Error Correction) : 데이터 전송과정에서 발생한 오류 검출( CRC ), 재전송 요구 없이 수정 → 데이터에 오류 정정용 중복 정보를 추가하여 수신 측에서 재전송 요청 없이 오류를 검출하고 정정. <예> 해밍 코드, 리드 솔로몬 코드\n\nBEC (Backward Error Correnction, 후진 오류 정정) : 에러 발생 데이터 다시 전송하는 방식. ARQ (Auto Repeat reQuest) 자동 재전송 요구 기법 3가지 → Stop-and-Wait(하나씩 확인. 재전송), Go-Back-N(N번 부터 재전송), Selective Repeat(잘못된 것만 선택 재전송)","sourceTopic":"에러 제어","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g183","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"UDP","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n헤더 구조 : src port#, dest port#, length, (가), data만 존재","a":"(가) checksum(UDP도 무결성 검사 함","e":"헤더 구조 : src port#, dest port#, length, checksum(UDP도 무결성 검사 함), data만 존재","source":183,"corrected":false,"legal":false,"sourceNote":"헤더 구조 : src port#, dest port#, length, checksum(UDP도 무결성 검사 함) , data만 존재\n\nUDP Voip : RTP(Real Time Protocol, 음성전송), RTCP(Real Time Control Protocol, 오류처리)","sourceTopic":"UDP"},{"id":"g184","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"인터넷 계층","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)홉 카운터가 적은 쪽으로 경로 결정 <예> RIP - 리눅스에서 프로그램으로 구현되어 있음","a":"(가) 거리 백터","e":"거리 백터 : 홉 카운터가 적은 쪽으로 경로 결정 <예> RIP - 리눅스에서 프로그램으로 구현되어 있음","source":184,"corrected":false,"legal":false,"sourceNote":"거리 백터 : 홉 카운터가 적은 쪽으로 경로 결정 <예> RIP - 리눅스에서 프로그램으로 구현되어 있음","sourceTopic":"인터넷 계층"},{"id":"g185","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"인터넷 계층","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)대역폭, 지연정보 등의 Cost가 적은 경로 결정. <예> (나) cf. BGP : 서로 다른 AS(Autonomous System) 간 라우팅 프로토콜","a":"(가) 링크 스테이트 / (나) OSPF","e":"링크 스 기술·수치 또는 명령어를 쓰시오.\n(가): (나)으로 범람 시킴(자원 고갈). 반사공격 동반 <예> TCP SYN Flooding, UDP Flooding, ICMP Flooding.","a":"(가) Flood / (나) 지속적 전송","e":"Flood : 지속적 전송으로 범람 시킴(자원 고갈). 반사공격 동반 <예> TCP SYN Flooding, UDP Flooding, ICMP Flooding.","source":199,"corrected":false,"legal":false,"sourceNote":"Flood : 지속적 전송 으로 범람 시킴(자원 고갈). 반사공격 동반 <예> TCP SYN Flooding, UDP Flooding, ICMP Flooding.","sourceTopic":"DDos : flood, spoofing, 증폭, 반사","lessonIds":["tcp-ip","ddos"]},{"id":"g200","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가): IP·MAC 주소, DNS 응답 등 신원이나 출처 정보를 위조하는 공격((나) 데이터 변조)","a":"(가) Spoofing / (나) 결과","e":"Spoofing : IP·MAC 주소, DNS 응답 등 신원이나 출처 정보를 위조하는 공격(결과 데이터 변조)","source":200,"corrected":false,"legal":false,"sourceNote":"Spoofing : IP·MAC 주소, DNS 응답 등 신원이나 출처 정보를 위조하는 공격( 결과 데이터 변조)\n\nDNS Spoofing: DNS 응답을 위조하여 잘못된 IP 주소로 연결되게 함.","sourceTopic":"DDos : flood, spoofing, 증폭, 반사"},{"id":"g201","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가): 요청 패킷의 출발지 IP를 피해자 IP로 위조하여 제3자 서버의 응답이 피해자에게 전달되도록 하는 공격. 발신자 IP를 피해자 (나) <예> DrDos(TCP SYN-ACK 반사공격, DNS·NTP 반사공격)","a":"(가) 반사공격 / (나) IP로 변조","e":"반사공격 : 요청 패킷의 출발지 IP를 피해자 IP로 위조하여 제3자 서버의 응답이 피해자에게 전달되도록 하는 공격. 발신자 IP를 피해자 IP로 변조 <예> DrDos(TCP SYN-ACK 반사공격, DNS·NTP 반사공격)","source":201,"corrected":false,"legal":false,"sourceNote":"반사공격 : 요청 패킷의 출발지 IP를 피해자 IP로 위조하여 제3자 서버의 응답이 피해자에게 전달되도록 하는 공격. 발신자 IP를 피해자 IP로 변조 <예> DrDos(TCP SYN-ACK 반사공격, DNS·NTP 반사공격)\n\nDRDoS(Distributed Reflection DoS): 다수의 제3자 서버를 이용해 응답 트래픽을 피해자에게 집중시키는 분산 반사 공격.","sourceTopic":"DDos : flood, spoofing, 증폭, 반사","lessonIds":["tcp-ip"]},{"id":"g202","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)(공격자IP 그대로 두면 TCP SYN 플러딩, 피해자IP로 주면 DrDos)","a":"(가) hping3 127.0.0.1(피해자IP) -S --flood -a 9.9.9.9","e":"hping3 127.0.0.1(피해자IP) -S --flood -a 9.9.9.9(공격자IP 그대로 두면 TCP SYN 플러딩, 피해자IP로 주면 DrDos)","source":202,"corrected":false,"legal":false,"sourceNote":"hping3 127.0.0.1(피해자IP) -S --flood -a 9.9.9.9 (공격자IP 그대로 두면 TCP SYN 플러딩, 피해자IP로 주면 DrDos)","sourceTopic":"DDos : flood, spoofing, 증폭, 반사","lessonIds":["tcp-ip"]},{"id":"g203","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nSmurfing Attack : ICMP Echo Request(ping)를 브로스캐스트로 보냄(예 : 10.10.10.255) → 피해자 PC로 Reply 가도록 함 cf. (가)= IP 스푸핑 + 브로드캐스트 + 증폭, (나)대량의 ICMP 패킷으로 자원 고갈)","a":"(가) Smurf / (나) ICMP Flooding","e":"Smurfing Attack : ICMP Echo Request(ping)를 브로스캐스트로 보냄(예 : 10.10.10.255) → 피해자 PC로 Reply 가도록 함 cf. Smurf = IP 스푸핑 + 브로드캐스트 + 증폭, ICMP Flooding(대량의 ICMP 패킷으로 자원 고갈)","source":203,"corrected":false,"legal":false,"sourceNote":"Smurfing Attack : ICMP Echo Request(ping)를 브로스캐스트로 보냄(예 : 10.10.10.255) → 피해자 PC로 Reply 가도록 함 cf. Smurf = IP 스푸핑 + 브로드캐스트 + 증폭, ICMP Flooding( 대량의 ICMP 패킷으로 자원 고갈)","sourceTopic":"DDos : flood, spoofing, 증폭, 반사","lessonIds":["tcp-ip","ddos"]},{"id":"g204","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가): 작은 요청으로 상대적으로 큰 응답 트래픽을 발생시키는 공격. 1개 전송(나). (다)","a":"(가) 증폭공격 / (나) N개 응답 / (다) 반사공격 동반","e":"증폭공격 : 작은 요청으로 상대적으로 큰 응답 트래픽을 발생시키는 공격. 1개 전송 N개 응답. 반사공격 동반","source":204,"corrected":false,"legal":false,"sourceNote":"증폭공격 : 작은 요청으로 상대적으로 큰 응답 트래픽을 발생시키는 공격. 1개 전송 N개 응답 . 반사공격 동반","sourceTopic":"DDos : flood, spoofing, 증폭, 반사"},{"id":"g205","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nNTP(시간동기화서버, UDP 123) 증폭 공격((가)명령 사용하여 여러 응답 요청, NTP 등록 서버목록 보는 명령)","a":"(가) monlist","e":"NTP(시간동기화서버, UDP 123) 증폭 공격(monlist 명령 사용하여 여러 응답 요청, NTP 등록 서버목록 보는 명령)","source":205,"corrected":false,"legal":false,"sourceNote":"NTP(시간동기화서버, UDP 123) 증폭 공격( monlist 명령 사용하여 여러 응답 요청, NTP 등록 서버목록 보는 명령)\n\nDNS 증폭( ANY 옵션 사용하여 여러 응답 요청. 작은 DNS 질의에 비해 큰 DNS 응답을 유도)","sourceTopic":"DDos : flood, spoofing, 증폭, 반사","lessonIds":["tcp-ip"]},{"id":"g206","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nDNS 증폭((가)옵션 사용하여 여러 응답 요청. 작은 DNS 질의에 비해 큰 DNS 응답을 유도)","a":"(가) ANY","e":"DNS 증폭(ANY 옵션 사용하여 여러 응답 요청. 작은 DNS 질의에 비해 큰 DNS 응답을 유도)","source":206,"corrected":false,"legal":false,"sourceNote":"NTP(시간동기화서버, UDP 123) 증폭 공격( monlist 명령 사용하여 여러 응답 요청, NTP 등록 서버목록 보는 명령)\n\nDNS 증폭( ANY 옵션 사용하여 여러 응답 요청. 작은 DNS 질의에 비해 큰 DNS 응답을 유도)","sourceTopic":"DDos : flood, spoofing, 증폭, 반사"},{"id":"g207","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"DoS와 DDoS의 차이를 설명하고 DDoS 탐지·대응의 대표적인 방법 두 가지를 쓰시오.","a":"DoS는 단일 또는 소수 근원 공격, DDoS는 다수 분산 근원에서 공격한다. 트래픽 이상 징후 모니터링, 레이트 리미팅·스크러빙·우회 등의 대응이 있다.","e":"가용성 침해를 목적으로 서비스의 자원이나 네트워크 대역폭을 고갈시킨다.","source":207,"corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g208","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) - (나)(backlog 증가)","a":"(가) TCP SYN Flooding 대응 / (나) 임시로 서버의 queue 증가","e":"TCP SYN Flooding 대응 - 임시로 서버의 queue 증가(backlog 증가)","source":208,"corrected":false,"legal":false,"sourceNote":"TCP SYN Flooding 대응 - 임시로 서버의 queue 증가 (backlog 증가)","sourceTopic":"DDos 공격과 대응","lessonIds":["tcp-ip","ddos"]},{"id":"g209","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n<대응 예> sysctl -w net.ipv4.(가) = 1024 → SYN Backlog 증가((나)): 서버의 미완료 TCP 연결 요청을 저장하는 큐 크기 증가(임시 대응)","a":"(가) tcp_max_syn_backlog / (나) SYN 대기 큐 크기 증가","e":"<대응 예> sysctl -w net.ipv4.tcp_max_syn_backlog = 1024 → SYN Backlog 증가(SYN 대기 큐 크기 증가): 서버의 미완료 TCP 연결 요청을 저장하는 큐 크기 증가(임시 대응)","source":209,"corrected":false,"legal":false,"sourceNote":"<대응 예> sysctl -w net.ipv4. tcp_max_syn_backlog = 1024 → SYN Backlog 증가( SYN 대기 큐 크기 증가 ): 서버의 미완료 TCP 연결 요청을 저장하는 큐 크기 증가(임시 대응)\n\n<대응 예2> sysctl -w net.ipv4. tcp_syncookies = 1 (버퍼 사용하지 않고 연결 허용, SYN 큐 고갈 완화 ) → SYN Cookies 활성화: SYN 큐가 가득 찼을 때 연결 정보를 큐에 저장하지 않고 쿠키를 이용하여 정상 연결 확인","sourceTopic":"DDos 공격과 대응","lessonIds":["tcp-ip"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g210","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n<대응 예2> sysctl -w net.ipv4.(가)(버퍼 사용하지 않고 연결 허용, (나)) → SYN Cookies 활성화: SYN 큐가 가득 찼을 때 연결 정보를 큐에 저장하지 않고 쿠키를 이용하여 정상 연결 확인","a":"(가) tcp_syncookies = 1 / (나) SYN 큐 고갈 완화","e":"<대응 예2> sysctl -w net.ipv4.tcp_syncookies = 1 (버퍼 사용하지 않고 연결 허용, SYN 큐 고갈 완화) → SYN Cookies 활성화: SYN 큐가 가득 찼을 때 연결 정보를 큐에 저장하지 않고 쿠키를 이용하여 정상 연결 확인","source":210,"corrected":false,"legal":false,"sourceNote":"<대응 예> sysctl -w net.ipv4. tcp_max_syn_backlog = 1024 → SYN Backlog 증가( SYN 대기 큐 크기 증가 ): 서버의 미완료 TCP 연결 요청을 저장하는 큐 크기 증가(임시 대응)\n\n<대응 예2> sysctl -w net.ipv4. tcp_syncookies = 1 (버퍼 사용하지 않고 연결 허용, SYN 큐 고갈 완화 ) → SYN Cookies 활성화: SYN 큐가 가득 찼을 때 연결 정보를 큐에 저장하지 않고 쿠키를 이용하여 정상 연결 확인","sourceTopic":"DDos 공격과 대응","lessonIds":["tcp-ip"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g211","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n<대응 예2> sysctl -w net.ipv4.(가)=1 → 모든 icmp echo request 차단 → ICMP Broadcast 응답 차단: 서버가 브로드캐스트 주소로 수신한 ICMP Echo Request에 응답하지 않도록 설정","a":"(가) icmp_echo_ignore_all","e":"<대응 예2> sysctl -w net.ipv4.icmp_echo_ignore_all=1 → 모든 icmp echo request 차단 → ICMP Broadcast 응답 차단: 서버가 브로드캐스트 주소로 수신한 ICMP Echo Request에 응답하지 않도록 설정","source":211,"corrected":false,"legal":false,"sourceNote":"<대응 예> icmp_echo_ignore_broadcasts=1 → Directed Broadcast 차단: 라우터에서 다른 네트워크로 전달되는 브로드캐스트 패킷 차단\n\n<대응 예2> sysctl -w net.ipv4. icmp_echo_ignore_all =1 → 모든 icmp echo request 차단 → ICMP Broadcast 응답 차단: 서버가 브로드캐스트 주소로 수신한 ICMP Echo Request에 응답하지 않도록 설정\n\n라우터 TCP Intercept 모드로 대응","sourceTopic":"DDos 공격과 대응","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g212","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nWatch Mode(일정 시간 연결 안되면 (가)하는 모드) → 일정 시간 내 연결이 완료되지 않으면 RST를 전송하여 미완료 연결을 정리하는 방식.","a":"(가) 라우터가 SYN 패킷 차단","e":"Watch Mode(일정 시간 연결 안되면 라우터가 SYN 패킷 차단하는 모드) → 일정 시간 내 연결이 완료되지 않으면 RST를 전송하여 미완료 연결을 정리하는 방식.","source":212,"corrected":false,"legal":false,"sourceNote":"Watch Mode(일정 시간 연결 안되면 라우터가 SYN 패킷 차단 하는 모드) → 일정 시간 내 연결이 완료되지 않으면 RST를 전송하여 미완료 연결을 정리하는 방식.\n\nIntercept Mode( 라우터에서 SYN 요청 가로채어 클라이언트와 서버 대신 연결 하는 모드) → 서버 대신 3-Way Handshake를 먼저 수행하고, 정상 연결이 확인되면 서버와 연결하여 중계하는 방식","sourceTopic":"DDos 공격과 대응","lessonIds":["tcp-ip"]},{"id":"g213","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nIntercept Mode((가)SYN 요청 가로채어 (나)하는 모드) → 서버 대신 3-Way Handshake를 먼저 수행하고, 정상 연결이 확인되면 서버와 연결하여 중계하는 방식","a":"(가) 라우터에서 / (나) 클라이언트와 서버 대신 연결","e":"Intercept Mode(라우터에서 SYN 요청 가로채어 클라이언트와 서버 대신 연결하는 모드) → 서버 대신 3-Way Handshake를 먼저 수행하고, 정상 연결이 확인되면 서버와 연결하여 중계하는 방식","source":213,"corrected":false,"legal":false,"sourceNote":"Watch Mode(일정 시간 연결 안되면 라우터가 SYN 패킷 차단 하는 모드) → 일정 시간 내 연결이 완료되지 않으면 RST를 전송하여 미완료 연결을 정리하는 방식.\n\nIntercept Mode( 라우터에서 SYN 요청 가로채어 클라이언트와 서버 대신 연결 하는 모드) → 서버 대신 3-Way Handshake를 먼저 수행하고, 정상 연결이 확인되면 서버와 연결하여 중계하는 방식","sourceTopic":"DDos 공격과 대응"},{"id":"g214","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n브로드캐스트 ICMP Echo Request (가)","a":"(가) 차단 : icmp_echo_ignore_broadcasts=1 설정","e":"브로드캐스트 ICMP Echo Request 차단 : icmp_echo_ignore_broadcasts=1 설정","source":214,"corrected":false,"legal":false,"sourceNote":"ICMP echo request 차단 : icmp_echo_ignore_all=1 설정\n\n브로드캐스트 ICMP Echo Request 차단 : icmp_echo_ignore_broadcasts=1 설정","sourceTopic":"DDos 공격과 대응"},{"id":"g215","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"라우터에서 broadcast 차단 / 서버 OS에서 broadcast 차단","q":"Smurf 공격 대응을 위해 (1) 라우터에서 막아야 하는 전송 기능과 (2) 리눅스 호스트에서 무시할 ICMP 요청의 종류를 쓰시오.","a":"(1) IP directed broadcast 전달 제한 (2) 브로드캐스트 ICMP Echo Request","e":"라우터의 브로드캐스트 전달 차단과 호스트의 Echo 응답 거부는 다른 위치에서 이루어지는 통제다.","source":215,"corrected":false,"legal":false,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g216","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nTear drop : MTU(1500byte)보다 큰 패킷 분할 시 분할 여부(flags)와 분할 순서(offset)가 저장되는데, (가)하는 공격.","a":"(가) offset을 임의 조작하여 재조립 못하게","e":"Tear drop : MTU(1500byte)보다 큰 패킷 분할 시 분할 여부(flags)와 분할 순서(offset)가 저장되는데, offset을 임의 조작하여 재조립 못하게 하는 공격.","source":216,"corrected":false,"legal":false,"sourceNote":"Tear drop : MTU(1500byte)보다 큰 패킷 분할 시 분할 여부(flags)와 분할 순서(offset)가 저장되는데, offset을 임의 조작하여 재조립 못하게 하는 공격.","sourceTopic":"DDos 공격과 대응","lessonIds":["tcp-ip","detection"]},{"id":"g217","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"IP Fragmentation 이용 공격 종류","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nTiny Fragment : 최초의 (가) 만들어서 IDS(침입탐지시스템) 우회","a":"(가) Fragment를 아주 작게","e":"Tiny Fragment : 최초의 Fragment를 아주 작게 만들어서 IDS(침입탐지시스템) 우회","source":217,"corrected":false,"legal":false,"lessonIds":["tcp-ip"]},{"id":"g218","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"IP Fragmentation 이용 공격 종류","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nFragment Overlap : (가)처리 이용 → Fragment의 Offset을 중첩시키고, 재조립 과정의 데이터 덮어쓰기(Overwrite) 차이를 악용하여 보안장비 우회","a":"(가) 재조합과 overwrite","e":"Fragment Overlap : 재조합과 overwrite 처리 이용 → Fragment의 Offset을 중첩시키고, 재조립 과정의 데이터 덮어쓰기(Overwrite) 차이를 악용하여 보안장비 우회","source":218,"corrected":false,"legal":false,"lessonIds":["tcp-ip","detection"]},{"id":"g219","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"IP Fragmentation 이용 공격 종류","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : (나)을 전송(여러 개로 분할 됨)하여 서비스 처리 못하게 함 → 첫번째 패킷 offset 0, 두번째 1480, 세번째 2960, … (MTU) ⇒ IP 단편을 재조립했을 때 IPv4 최대 패킷 크기(65,535바이트)를 초과하도록 만들어 취약한 시스템에 장애 유발.","a":"(가) Ping of Death / (나) 큰 IP 패킷","e":"Ping of Death : 큰 IP 패킷을 전송(여러 개로 분할 됨)하여 서비스 처리 못하게 함 → 첫번째 패킷 offset 0, 두번째 1480, 세번째 2960, … (MTU) ⇒ IP 단편을 재조립했을 때 IPv4 최대 패킷 크기(65,535바이트)를 초과하도록 만들어 취약한 시스템에 장애 유발.","source":219,"corrected":false,"legal":false,"lessonIds":["tcp-ip","detection"]},{"id":"g220","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"IP Fragmentation 이용 공격 종류","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nTear Drop : (가)이 중첩되는 패킷 전송 → 비정상적으로 중첩된 Fragment Offset을 이용하여 취약한 시스템의 패킷 재조립 과정에 오류 유발.","a":"(가) offset","e":"Tear Drop : offset이 중첩되는 패킷 전송 → 비정상적으로 중첩된 Fragment Offset을 이용하여 취약한 시스템의 패킷 재조립 과정에 오류 유발.","source":220,"corrected":false,"legal":false,"lessonIds":["tcp-ip","detection"]},{"id":"g221","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nLand Attack : IP Header 변조하여 (가)하게 설정 → 네트워크 부하 → Snort에서 Land Attack 탐지 :(나)","a":"(가) 송신자 IP와 포트를 수신자와 IP와 포트로 동일 / (나) sameip","e":"Land Attack : IP Header 변조하여 송신자 IP와 포트를 수신자와 IP와 포트로 동일하게 설정 → 네트워크 부하 → Snort에서 Land Attack 탐지 : sameip;","source":221,"corrected":false,"legal":false,"sourceNote":"Land Attack : IP Header 변조하여 송신자 IP와 포트를 수신자와 IP와 포트로 동일 하게 설정 → 네트워크 부하 → Snort에서 Land Attack 탐지 : sameip;","sourceTopic":"DDos 공격과 대응"},{"id":"g222","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nSlow HTTP POST(=RUDY): (가) 값을 크게 설정하고 요청 본문을 1바이트씩 천천히 전송하여 서버 자원을 고갈시키는 공격 → (나) <공격 예> Content_Length=50000","a":"(가) Content-Length(헤더 설정 / (나) 헤더를 완성한 후 본문을 천천히 보내는 공격","e":"Slow HTTP POST(=RUDY): Content-Length(헤더 설정) 값을 크게 설정하고 요청 본문을 1바이트씩 천천히 전송하여 서버 자원을 고갈시키는 공격 → 헤더를 완성한 후 본문을 천천히 보내는 공격 <공격 예> Content_Length=50000","source":222,"corrected":false,"legal":false,"sourceNote":"Slow HTTP GET Flooding: HTTP GET 요청을 대량 전송하여 서버의 요청 처리 자원을 고갈시키는 공격\n\nSlow HTTP POST(=RUDY): Content-Length(헤더 설정) 값을 크게 설정하고 요청 본문을 1바이트씩 천천히 전송하여 서버 자원을 고갈시키는 공격 → 헤더를 완성한 후 본문을 천천히 보내는 공격 <공격 예> Content_Length=50000","sourceTopic":"DDos 공격과 대응","lessonIds":["detection"]},{"id":"g223","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nCache Control 공격 : HTTP 헤더에 (가) 설정. 캐시된 응답을 재검증하도록 유도하여 부하 발생","a":"(가) Cache-Control : no cache","e":"Cache Control 공격 : HTTP 헤더에 Cache-Control : no cache 설정. 캐시된 응답을 재검증하도록 유도하여 부하 발생","source":223,"corrected":false,"legal":false,"sourceNote":"Cache Control 공격 : HTTP 헤더에 Cache-Control : no cache 설정. 캐시된 응답을 재검증하도록 유도하여 부하 발생","sourceTopic":"DDos 공격과 대응"},{"id":"g224","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nSlow HTTP (가)Dos : TCP 수신 (나) 시킴 → 처리율 감소시켜 정상 응답 못하도록 함 ⇒ (다) <공격 예> TCP Window size = 0","a":"(가) Read / (나) 윈도우 크기를 감소 / (다) 서버 응답을 천천히 받는 공격","e":"Slow HTTP Read Dos : TCP 수신 윈도우 크기를 감소 시킴 → 처리율 감소시켜 정상 응답 못하도록 함 ⇒ 서버 응답을 천천히 받는 공격 <공격 예> TCP Window size = 0","source":224,"corrected":false,"legal":false,"sourceNote":"Slow HTTP Read Dos : TCP 수신 윈도우 크기를 감소 시킴 → 처리율 감소시켜 정상 응답 못하도록 함 ⇒ 서버 응답을 천천히 받는 공격 <공격 예> TCP Window size = 0\n\nSlow HTTP Header Dos(=Slowloris) : 헤더 모두 전달 안된 것으로 변조( 개행문자 삭제 )하여 연결 장시간 유지 → 요청 헤더를 완성하지 않는 공격 cf. HTTP 응답 분할 : 공격자가 \\r\\n\\r\\n을 계속 추가 (JS코드로). XSS 공격 에 해당. → 첫번째 메시지는 응답 종료, 두번째 메시지는 XSS 공격 등을 실행 → 방어 : 개행문자 제거","sourceTopic":"DDos 공격과 대응"},{"id":"g225","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\nSlow HTTP (가)(나) : 헤더 모두 전달 안된 것으로 변조((다))하여 연결 장시간 유지 → (라) cf. HTTP (마) : 공격자가 \\r\\n\\r\\n을 계속 (바)(JS코드로). (사)에 해당. → 첫번째 메시지는 응답 종료, 두번째 메시지는 XSS 공격 등을 실행 → 방어 : 개행문자 제거","a":"(가) Header / (나) Dos(=Slowloris / (다) 개행문자 삭제 / (라) 요청 헤더를 완성하지 않는 공격 / (마) 응답 분할 / (바) 추가 / (사) XSS 공격","e":"Slow HTTP Header Dos(=Slowloris) : 헤더 모두 전달 안된 것으로 변조(개행문자 삭제)하여 연결 장시간 유지 → 요청 헤더를 완성하지 않는 공격 cf. HTTP 응답 분할 : 공격자가 \\r\\n\\r\\n을 계속 추가(JS코드로). XSS 공격에 해당. → 첫번째 메시지는 응답 종료, 두번째 메시지는 XSS 공격 등을 실행 → 방어 : 개행문자 제거","source":225,"corrected":false,"legal":false,"sourceNote":"Slow HTTP Read Dos : TCP 수신 윈도우 크기를 감소 시킴 → 처리율 감소시켜 정상 응답 못하도록 함 ⇒ 서버 응답을 천천히 받는 공격 <공격 예> TCP Window size = 0\n\nSlow HTTP Header Dos(=Slowloris) : 헤더 모두 전달 안된 것으로 변조( 개행문자 삭제 )하여 연결 장시간 유지 → 요청 헤더를 완성하지 않는 공격 cf. HTTP 응답 분할 : 공격자가 \\r\\n\\r\\n을 계속 추가 (JS코드로). XSS 공격 에 해당. → 첫번째 메시지는 응답 종료, 두번째 메시지는 XSS 공격 등을 실행 → 방어 : 개행문자 제거","sourceTopic":"DDos 공격과 대응","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g226","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n(가) : 웹사이트에서 검색엔진 크롤러(로봇)의 접근 허용 및 제한 범위를 지정하는 텍스트 파일. 위치: 웹사이트 최상위 경로 (https://example.com/robots.txt)","a":"(가) cf. robots.txt","e":"cf. robots.txt : 웹사이트에서 검색엔진 크롤러(로봇)의 접근 허용 및 제한 범위를 지정하는 텍스트 파일. 위치: 웹사이트 최상위 경로 (https://example.com/robots.txt)","source":226,"corrected":false,"legal":false,"sourceNote":"cf. robots.txt : 웹사이트에서 검색엔진 크롤러(로봇)의 접근 허용 및 제한 범위를 지정하는 텍스트 파일. 위치: 웹사이트 최상위 경로 ( https://example.com/robots.txt )","sourceTopic":"DDos 공격과 대응","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g227","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nUser-agent: 적용할 크롤러 지정 <예> (가) * → 모든 크롤러","a":"(가) User-agent","e":"User-agent: 적용할 크롤러 지정 <예> User-agent: * → 모든 크롤러","source":227,"corrected":false,"legal":false,"sourceNote":"User-agent: 적용할 크롤러 지정 <예> User-agent: * → 모든 크롤러\n\nDisallow: 크롤링 금지 경로 <예> Disallow: /admin/","sourceTopic":"DDos 공격과 대응"},{"id":"g228","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nDisallow: 크롤링 금지 경로 <예> (가) /admin/","a":"(가) Disallow","e":"Disallow: 크롤링 금지 경로 <예> Disallow: /admin/","source":228,"corrected":false,"legal":false,"sourceNote":"User-agent: 적용할 크롤러 지정 <예> User-agent: * → 모든 크롤러\n\nDisallow: 크롤링 금지 경로 <예> Disallow: /admin/\n\nAllow: 크롤링 허용 경로 <예> Allow: /public/","sourceTopic":"DDos 공격과 대응"},{"id":"g229","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nAllow: 크롤링 허용 경로 <예> (가) /public/","a":"(가) Allow","e":"Allow: 크롤링 허용 경로 <예> Allow: /public/","source":229,"corrected":false,"legal":false,"sourceNote":"Disallow: 크롤링 금지 경로 <예> Disallow: /admin/\n\nAllow: 크롤링 허용 경로 <예> Allow: /public/","sourceTopic":"DDos 공격과 대응"},{"id":"g230","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"스캐닝 : 정보 획득 목적","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\nTCP connect() sacn = TCP (가)Scan : 3 Way Handshaking(SYN, SYN+ACK, ACK) 진행하여 오픈 포트 확인. 포트(나)옴. (다)Nmap 옵션: -sT","a":"(가) Open / (나) 닫혀있으면 RST+ACK / (다) 연결 로그 App계층에 기록됨.","e":"TCP connect() sacn = TCP Open Scan : 3 Way Handshaking(SYN, SYN+ACK, ACK) 진행하여 오픈 포트 확인. 포트 닫혀있으면 RST+ACK 옴. 연결 로그 App계층에 기록됨. Nmap 옵션: -sT","source":230,"corrected":false,"legal":false,"sourceNote":"포트 스캐닝 : 서버에 열려있는 포트 확인. Nmap(SW) 사용\n\nTCP connect() sacn = TCP Open Scan : 3 Way Handshaking(SYN, SYN+ACK, ACK) 진행하여 오픈 포트 확인. 포트 닫혀있으면 RST+ACK 옴. 연결 로그 App계층에 기록됨. Nmap 옵션: -sT\n\nTCP SYN Scan (= Half-open Scan): SYN 전송 → 열린 포트는 SYN+ACK, 닫힌 포트는 RST+ACK 응답 . 열린 포트에 RST를 전송하여 연결을 완료하지 않음 → 애플리케이션 연결 로그가 남지 않을 수 있음. Nmap 옵션: -sS","sourceTopic":"스캐닝 : 정보 획득 목적","lessonIds":["tcp-ip"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g231","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"스캐닝 : 정보 획득 목적","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n(가)(= Half-open Scan): SYN 전송 → 열린 포트는 SYN+ACK, 닫힌 포트는 (나). 열린 포트에 RST를 전송하여 연결을 완료하지 않음 → 애플리케이션 연결 로그가 남지 않을 수 있음. Nmap 옵션: -sS","a":"(가) TCP SYN Scan / (나) RST+ACK 응답","e":"TCP SYN Scan (= Half-open Scan): SYN 전송 → 열린 포트는 SYN+ACK, 닫힌 포트는 RST+ACK 응답. 열린 포트에 RST를 전송하여 연결을 완료하지 않음 → 애플리케이션 연결 로그가 남지 않을 수 있음. Nmap 옵션: -sS","source":231,"corrected":false,"legal":false,"sourceNote":"TCP connect() sacn = TCP Open Scan : 3 Way Handshaking(SYN, SYN+ACK, ACK) 진행하여 오픈 포트 확인. 포트 닫혀있으면 RST+ACK 옴. 연결 로그 App계층에 기록됨. Nmap 옵션: -sT\n\nTCP SYN Scan (= Half-open Scan): SYN 전송 → 열린 포트는 SYN+ACK, 닫힌 포트는 RST+ACK 응답 . 열린 포트에 RST를 전송하여 연결을 완료하지 않음 → 애플리케이션 연결 로그가 남지 않을 수 있음. Nmap 옵션: -sS\n\n스탤스 Scan 기법 : 정상적인 TCP 연결을 완료하지 않는 스캔 기법. IDS에는 탐지될 수 있음. FIN Scan(-sF) : FIN 전송 → 열림: 무응답 / 닫힘: RST Xmas Scan(-sX) : FIN+PSH+URG 전송 → 열림: 무응답 / 닫힘: RST X(all) 대상 포트로 패킷 전송(FIN, URG, PSH 등) NULL Scan(-sN) : TCP 플래그 없이 전송 → 열림: 무응답 / 닫힘: RST UDP Scan (-sU) : UDP 패킷 전송 → 열림: 무응답 또는 UDP 응답 / 닫힘: ICMP Port Unreachable","sourceTopic":"스캐닝 : 정보 획득 목적","lessonIds":["tcp-ip"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g232","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"스캐닝 : 정보 획득 목적","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : 정상적인 TCP 연결을 완료하지 않는 스캔 기법. IDS에는 탐지될 수 있음.","a":"(가) 스탤스 Scan 기법","e":"스탤스 Scan 기법 : 정상적인 TCP 연결을 완료하지 않는 스캔 기법. IDS에는 탐지될 수 있음.","source":232,"corrected":false,"legal":false,"sourceNote":"TCP SYN Scan (= Half-open Scan): SYN 전송 → 열린 포트는 SYN+ACK, 닫힌 포트는 RST+ACK 응답 . 열린 포트에 RST를 전송하여 연결을 완료하지 않음 → 애플리케이션 연결 로그가 남지 않을 수 있음. Nmap 옵션: -sS\n\n스탤스 Scan 기법 : 정상적인 TCP 연결을 완료하지 않는 스캔 기법. IDS에는 탐지될 수 있음. FIN Scan(-sF) : FIN 전송 → 열림: 무응답 / 닫힘: RST Xmas Scan(-sX) : FIN+PSH+URG 전송 → 열림: 무응답 / 닫힘: RST X(all) 대상 포트로 패킷 전송(FIN, URG, PSH 등) NULL Scan(-sN) : TCP 플래그 없이 전송 → 열림: 무응답 / 닫힘: RST UDP Scan (-sU) : UDP 패킷 전송 → 열림: 무응답 또는 UDP 응답 / 닫힘: ICMP Port Unreachable","sourceTopic":"스캐닝 : 정보 획득 목적"},{"id":"g233","bank":"general","type":"단답형","area":"02 네트워크 보안","topic": 워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nIPSEC VPN 키 관리 : I(가)KMP(Internet Security Association and Key Management Protocol. 보안 (나)), IKE(Internet Key Exchange. (다))","a":"(가) SA / (나) 협상 / (다) 키 교환 → 과거:디피헬먼, 현재:공개키로 세션키 암호화 해서 전송함","e":"IPSEC VPN 키 관리 : ISAKMP(Internet Security Association and Key Management Protocol. 보안 협상), IKE(Internet Key Exchange. 키 교환 → 과거:디피헬먼, 현재:공개키로 세션키 암호화 해서 전송함)","source":281,"corrected":false,"legal":false,"sourceNote":"IPSEC VPN 키 관리 : I SA KMP(Internet Security Association and Key Management Protocol. 보안 협상 ), IKE(Internet Key Exchange. 키 교환 → 과거:디피헬먼, 현재:공개키로 세션키 암호화 해서 전송함 )\n\nIPSEC VPN 헤더 AH : 인증 정보(MAC). SPI(Security Association 식별), Sequence Number(Reply 공격 방어), Authentication Data( 인증 정보 , 무결성 검사) → 수신자의 공개키로 데이터 암호화 후 전송하면, 수신자의 개인키로 인증(=키 인증) cf. Seq Num, 타임스탬프, 랜덤 Num 가 있으면 replay(복사) 공격 방지 가능 ESP : 전송 자료 암호화 정보. SPI, Sequence Number, Padding Length(블록 단위 암호화에서 블록 크기 맞춤. 메시지 크기 커짐), ESP Authentication Data","sourceTopic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","lessonIds":["ipsec"]},{"id":"g282","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"IPsec AH의 보안 기능 두 가지와 제공하지 않는 기능 한 가지를 서술하시오.","a":"AH는 데이터 출처 인증과 무결성을 제공하며, 암호화에 의한 기밀성은 제공하지 않는다.","e":"AH를 수신자 공개키로 데이터를 암호화하는 프로토콜로 설명하면 안 된다. 암호화 기능은 ESP와 구별한다.","source":282,"corrected":true,"legal":false,"lessonIds":["ipsec"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g283","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)이용 터널 생성 과정 : 1단계(IKE Phase1, (나)→(다)), 2단계(IKE Phase2, 암호화→터널생성)","a":"(가) IKE / (나) 협상 / (다) 키 교환","e":"IKE 이용 터널 생성 과정 : 1단계(IKE Phase1, 협상→키 교환), 2단계(IKE Phase2, 암호화→터널생성)","source":283,"corrected":false,"legal":false,"sourceNote":"IKE 이용 터널 생성 과정 : 1단계(IKE Phase1, 협상 → 키 교환 ), 2단계(IKE Phase2, 암호화→터널생성) 1단계(IKE Phase 1) : 암호화 알고리즘 등 보안 정책 협상 → DH 키 교환 → 상대방 인증 → IKE SA(보안 연결) 생성 2단계(IKE Phase 2) : IPsec 보안 정책 협상 → IPsec SA 생성 → 암호화 통신 시작(Quick Mode)\n\n1단계(IKE Phase 1) : 암호화 알고리즘 등 보안 정책 협상 → DH 키 교환 → 상대방 인증 → IKE SA(보안 연결) 생성","sourceTopic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술"},{"id":"g284","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"[가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암] 강조한 보안 개념·기술에 관한 용어를 쓰시오.","a":"(가) 데이터 링크(2계층) VPN 종류 / (나) PPTP VPN(ms 개발), L2TP VPN(cisco 제안), MPLS VPN → 3계층 VPN(IPsec VPN, MPLS L3VPN","e":"cf. 데이터 링크(2계층) VPN 종류 : PPTP VPN(ms 개발), L2TP VPN(cisco 제안), MPLS VPN → 3계층 VPN(IPsec VPN, MPLS L3VPN)","source":284,"corrected":false,"legal":false,"sourceNote":"cf. 데이터 링크(2계층) VPN 종류 : PPTP VPN(ms 개발), L2TP VPN(cisco 제안), MPLS VPN → 3계층 VPN(IPsec VPN, MPLS L3VPN)","sourceTopic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술"},{"id":"g285","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\ncf. (가) : 개인정보취급자가 개인정보처리시스템을 외부에서 연결 시 안전한 접속수단(예:VPN 등) or 안전한 인증(예:2-Factor인증) 사용","a":"(가) 접근통제","e":"cf. 접근통제 : 개인정보취급자가 개인정보처리시스템을 외부에서 연결 시 안전한 접속수단(예:VPN 등) or 안전한 인증(예:2-Factor인증) 사용","source":285,"corrected":false,"legal":false,"sourceNote":"cf. 접근통제 : 개인정보취급자가 개인정보처리시스템을 외부에서 연결 시 안전한 접속수단(예:VPN 등) or 안전한 인증(예:2-Factor인증) 사용","sourceTopic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술"},{"id":"g286","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"NAC (Network Access Control) : 엔드 포인트 보안 솔루션으로 등록 되지 않는 단말기 차단( 미등록 PC 연결 못하게 함 ). 네트워크 무결성 지원","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)(Network Access Control) : 엔드 포인트 보안 솔루션으로 등록 되지 않는 단말기 차단((나)). 네트워크 무결성 지원","a":"(가) NAC / (나) 미등록 PC 연결 ·기술·수치 또는 명령어를 쓰시오.\nIEEE 802 표준 : 802.11b(2.4GHz, 11Mbps), 802.11a(5GHz, 54Mbps), (가)(5G, 2.4G 듀얼, 600Mbps), (나)(차량통신, 5.9GHz, 27Mbps)","a":"(가) 802.11n / (나) 802.11p","e":"IEEE 802 표준 : 802.11b(2.4GHz, 11Mbps), 802.11a(5GHz, 54Mbps), 802.11n(5G, 2.4G 듀얼, 600Mbps), 802.11p(차량통신, 5.9GHz, 27Mbps)","source":290,"corrected":false,"legal":false,"sourceNote":"IEEE 802 표준 : 802.11b(2.4GHz, 11Mbps), 802.11a(5GHz, 54Mbps), 802.11n (5G, 2.4G 듀얼, 600Mbps), 802.11p (차량통신, 5.9GHz, 27Mbps)","sourceTopic":"무선 LAN"},{"id":"g291","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"무선 LAN","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\n(가)(Wired Equivalent Privacy) 인증 : IEEE (나), RC4 대칭키 알고리즘 (다) 키 사용, (라)연결하여 총 64bit 키로 암호화. → RC는 스트림 암호화(패딩 불필요, 암호문 다시 암호화 시 복호화됨) → (마)하므로 (바) 등에 취약. cf. (사)(아)","a":"(가) WEP / (나) 802.11 표준 / (다) 40bit / (라) 24bit 초기화 벡터 / (마) 정적(고정된)키 사용 / (바) 무작위 공격 / (사) 안전하지 않은 암호화 / (아) 기법(RC, MD, DES, SHA-1","e":"WEP(Wired Equivalent Privacy) 인증 : IEEE 802.11 표준, RC4 대칭키 알고리즘 40bit 키 사용, 24bit 초기화 벡터 연결하여 총 64bit 키로 암호화. → RC는 스트림 암호화(패딩 불필요, 암호문 다시 암호화 시 복호화됨) → 정적(고정된)키 사용하므로 무작위 공격 등에 취약. cf. 안전하지 않은 암호화 기법(RC, MD, DES, SHA-1)","source":291,"corrected":false,"legal":false,"sourceNote":"WEP (Wired Equivalent Privacy) 인증 : IEEE 802.11 표준 , RC4 대칭키 알고리즘 40bit 키 사용, 24bit 초기화 벡터 연결하여 총 64bit 키로 암호화. → RC는 스트림 암호화(패딩 불필요, 암호문 다시 암호화 시 복호화됨) → 정적(고정된)키 사용 하므로 무작위 공격 등에 취약. cf. 안전하지 않은 암호화 기법(RC, MD, DES, SHA-1)","sourceTopic":"무선 LAN","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g292","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"무선 LAN","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\nWPA(Wi-Fi Protected Acess) 인증 : 무선 인증 표준, 128bit (가) 암호화/복호화, (나) 방식(RC4 쓰지만 암호화 키 동적). 인증서버((다)) 사용 → Personal Mode(미리 정의된 PSK(암호화 (라)), (마)사용자별 유일한 세션키, (바)(사)(아)(로그인) 필요)","a":"(가) 동적 / (나) TKIP / (다) Radius, EAP에서 인증=상호인증 / (라) 키) 공유 / (마) Enterprise Mode / (바) EAP를 지원 / (사) 하는 / (아) 인증서버","e":"WPA(Wi-Fi Protected Acess) 인증 : 무선 인증 표준, 128bit 동적 암호화/복호화, TKIP 방식(RC4 쓰지만 암호화 키 동적). 인증서버(Radius, EAP에서 인증=상호인증) 사용 → Personal Mode(미리 정의된 PSK(암호화 키) 공유), Enterprise Mode(사용자별 유일한 세션키, EAP를 지원하는 인증서버(로그인) 필요)","source":292,"corrected":false,"legal":false,"sourceNote":"WEP (Wired Equivalent Privacy) 인증 : IEEE 802.11 표준 , RC4 대칭키 알고리즘 40bit 키 사용, 24bit 초기화 벡터 연결하여 총 64bit 키로 암호화. → RC는 스트림 암호화(패딩 불필요, 암호문 다시 암호화 시 복호화됨) → 정적(고정된)키 사용 하므로 무작위 공격 등에 취약. cf. 안전하지 않은 암호화 기법(RC, MD, DES, SHA-1)\n\nWPA(Wi-Fi Protected Acess) 인증 : 무선 인증 표준, 128bit 동적 암호화/복호화, TKIP 방식(RC4 쓰지만 암호화 키 동적). 인증서버( Radius, EAP에서 인증=상호인증 ) 사용 → Personal Mode(미리 정의된 PSK(암호화 키) 공유 ), Enterprise Mode( 사용자별 유일한 세션키, EAP를 지원 하는 인증서버 (로그인) 필요)","sourceTopic":"무선 LAN","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g293","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"무선 LAN","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\nWPA2 : (가) 암호화(=스트림 아닌 (나)), (다)(AES, (라)-블록암호화 운영모드) cf. (마): WPA2 암호화 기능 무력화 공격","a":"(가) AES / (나) 블록 암호화 / (다) 802.11i / (라) CCMP / (마) KRACK","e":"WPA2 : AES 암호화(=스트림 아닌 블록 암호화), 802.11i(AES, CCMP-블록암호화 운영모드) cf. KRACK : WPA2 암호화 기능 무력화 공격","source":293,"corrected":false,"legal":false,"sourceNote":"WPA2 : AES 암호화(=스트림 아닌 블록 암호화 ), 802.11i (AES, CCMP -블록암호화 운영모드) cf. KRACK : WPA2 암호화 기능 무력화 공격","sourceTopic":"무선 LAN","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g294","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"무선 LAN","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n모니터 모드(무런 랜카드 (가)) : 주변 무선 프레임 수집 가능","a":"(가) 모니터 모드로 전환","e":"모니터 모드(무런 랜카드 모니터 모드로 전환) : 주변 무선 프레임 수집 가능","source":294,"corrected":false,"legal":false,"sourceNote":"모니터 모드(무런 랜카드 모니터 모드로 전환 ) : 주변 무선 프레임 수집 가능 airmon-ng start wlan0 : 모니터 모드 활성화 iwconfig : 무선 인터페이스 및 모드 확인","sourceTopic":"무선 LAN"},{"id":"g295","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"무선 LAN","q":"다음 설명의 괄호에 들 teQuery() 방어2(Spring 프레임워크에서 Mybatis가 중간 역할 함) : ${} → # {} DBMS 조회 및 결과 검증 : DB계정 권한 최소화, 동적SQL 대신 정적 SQL 사용, 동적SQL 사용해야 한다면 입력값을 필터링","sourceTopic":"SW 개발보안","lessonIds":["sql-injection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g413","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n방어1(정적SQL) :(가) 사용. 실행 중에 매핑 <예> sql = “select * from t_member where id=(나)” → (다)(sql) → (라)(userid) → executeQuery()","a":"(가) 호스트(바인드) 변수 / (나) ? / (다) PreparedStatement / (라) setString","e":"방어1(정적SQL) : 호스트(바인드) 변수 사용. 실행 중에 매핑 <예> sql = “select * from t_member where id=?” → PreparedStatement(sql) → setString(userid) → executeQuery()","source":413,"corrected":false,"legal":false,"sourceNote":"방어1(정적SQL) : 호스트(바인드) 변수 사용. 실행 중에 매핑 <예> sql = “select * from t_member where id= ? ” → PreparedStatement (sql) → setString (userid) → executeQuery()","sourceTopic":"SW 개발보안","lessonIds":["sql-injection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g414","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n방어2(Spring 프레임워크에서 Mybatis가 중간 역할 함) : ${} → (가){}","a":"(가) #","e":"방어2(Spring 프레임워크에서 Mybatis가 중간 역할 함) : ${} → #{}","source":414,"corrected":false,"legal":false,"sourceNote":"방어2(Spring 프레임워크에서 Mybatis가 중간 역할 함) : ${} → # {}","sourceTopic":"SW 개발보안"},{"id":"g415","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"데이터베이스 조회·결과 검증 분야에서 최소권한과 준비된 문장을 적용해야 하는 이유를 설명하시오.","a":"DB 계정에 필요한 최소 권한만 부여해 피해 범위를 줄이고, Prepared Statement와 바인딩으로 사용자 입력이 SQL 구조를 변조하지 않도록 한다.","e":"단순 키워드 필터는 우회가 가능하므로 쿼리 구조와 값의 분리를 우선한다.","source":415,"corrected":false,"legal":false,"lessonIds":["sql-injection"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g416","bank":"general","type":"단답형","area":"03 애플리케이션 보안", se,"legal":false,"sourceNote":"경로조작 및 자원 삽입 : 외부 입력 값 검증이 없거나 잘못된 검증을 거쳐서 시스템 자원 접근 <예> 파일 오픈(파일명 입력값으로 받음), ../../(경로조작 문자열) 사용 방어 : 경로조작 문자열을 ReplaceAll 로 없앰\n\n방어 : 경로조작 문자열을 ReplaceAll 로 없앰\n\nXSS (크로스사이드 스크립팅) : 외부 입력 값에 의해 브라우저에서 악의적인 코드(JS) 실행. 클라이언트 공격(웹 브라우저 공격 ) → XSS 테스트 입력 예 : <script> alert(document.cookie) <\/script> 세션 정보 갈취 → HTML 인코딩, XSS 필터를 사용하여 대응( replaceAll() ) cf. document.cookie에 세션 정보가 있음 → HttpOnly 설정 으로 JS에서 접근 못하게 함. 또는 secure 설정 을 한다.(=SSL에서면 접근하도록 함) 방어1 : 동적 웹페이지에 대해 XSS 필터링 적용 → <예> <, >, &, ‘를 lt, gt, amp, quot로 replaceAll 방어2 : DB 조회 시 HTML 인코딩, XSS 필터 적용 Spring 프레임워크(전자정부 프레임워크)에서 XSS 방어하는 컴퍼넌트 : Filter(필터), Intercept(차단), Validator(검증)","sourceTopic":"SW 개발보안"},{"id":"g420","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\n(가)(크로스사이드 스크립팅) : 외부 입력 값에 의해 브라우저에서 악의적인 코드(JS) 실행. (나)(다)) → XSS 테스트 입력 (라)(마)정보 갈취 → HTML 인코딩, XSS 필터를 사용하여 대응((바)) cf. document.cookie에 세션 정보가 있음 → (사)으로 JS에서 접근 못하게 함. 또는 (아)을 한다.(=SSL에서면 접근하도록 함)","a":"(가) XSS / (나) 클라이언트 공격(웹 / (다) 브라우저 공격 / (라) 예 : <script> alert(document.cookie) <\/script> / (마) 세션 / (바) replaceAll / (사) HttpOnly 설정 / (아) secure 설정","e":"XSS(크로스사이드 스크립팅) : 외부 입력 값에 의해 브라우저에서 악의적인 코드(JS) 실행. 클라이언트 공격(웹 브라우저 공격) → XSS 테스트 입력 예 : <script> alert(document.cookie) <\/script>세션 정보 갈취 → HTML 인코딩, XSS 필터를 사용하여 대응(replaceAll()) cf. document.cookie에 세션 정보가 있음 → HttpOnly 설정으로 JS에서 접근 못하게 함. 또는 secure 설정을 한다.(=SSL에서면 접근하도록 함)","source":420,"corrected":false,"legal":false,"sourceNote":"XSS (크로스사이드 스크립팅) : 외부 입력 값에 의해 브라우저에서 악의적인 코드(JS) 실행. 클라이언트 공격(웹 브라우저 공격 ) → XSS 테스트 입력 예 : <script> alert(document.cookie) <\/script> 세션 정보 갈취 → HTML 인코딩, XSS 필터를 사용하여 대응( replaceAll() ) cf. document.cookie에 세션 정보가 있음 → HttpOnly 설정 으로 JS에서 접근 못하게 함. 또는 secure 설정 을 한다.(=SSL에서면 접근하도록 함) 방어1 : 동적 웹페이지에 대해 XSS 필터링 적용 → <예> <, >, &, ‘를 lt, gt, amp, quot로 replaceAll 방어2 : DB 조회 시 HTML 인코딩, XSS 필터 적용 Spring 프레임워크(전자정부 프레임워크)에서 XSS 방어하는 컴퍼넌트 : Filter(필터), Intercept(차단), Validator(검증)","sourceTopic":"SW 개발보안","lessonIds":["xss-csrf","http-sec"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g421","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"[SW 개발보안] 강조한 보안 개념·기술에 관한 용어를 쓰시오.","a":"(가) HTML 인코딩, XSS 필터 적용","e":"방어2 : DB 조회 시 HTML 인코딩, XSS 필터 적용","source":421,"corrected":false,"legal":false,"sourceNote":"XSS (크로스사이드 스크립팅) : 외부 입력 값에 의해 브라우저에서 악의적인 코드(JS) 실행. 클라이언트 공격(웹 브라우저 공격 ) → XSS 테스트 입력 예 : <script> alert(document.cookie) <\/script> 세션 정보 갈취 → HTML 인코딩, XSS 필터를 사용하여 대응( replaceAll() ) cf. document.cookie에 세션 정보가 있음 → HttpOnly 설정 으로 JS에서 접근 못하게 함. 또는 secure 설정 을 한다.(=SSL에서면 접근하도록 함) 방어1 : 동적 웹페이지에 대해 XSS 필터링 적용 → <예> <, >, &, ‘를 lt, gt, amp, quot로 replaceAll 방어2 : DB 조회 시 HTML 인코딩, XSS 필터 적용 Spring 프레임워크(전자정부 프레임워크)에서 XSS 방어하는 컴퍼넌트 : Filter(필터), Intercept(차단), Validator(검증)","sourceTopic":"SW 개발보안"},{"id":"g422","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 명령·설정·로그 관련 자료에서 괄호에 들어갈 명령어·옵션·설정값·의미를 작성하시오.\n(가)((나)) : 외부 공격자가 운영체제 명령어 삽입하여 실행. 웹 사이트에에서 외부 입력값을 이용해 OS 명령어 실행((다)) 기능 있을 때 가능 <예> ls & netstat ((라) 쓸 수 있으면 위험) → 지정된 명령어만 실행하도록 해서 방어","a":"(가) 운영체제 명령어 삽입 / (나) command 인젝션 / (다) JAVA에서 Runtime.exec / (라) |, &","e":"운영체제 명령어 삽입(command 인젝션) : 외부 공격자가 운영체제 명령어 삽입하여 실행. 웹 사이트에에서 외부 입력값을 이용해 OS 명령어 실행(JAVA에서 Runtime.exec) 기능 있을 때 가능 <예> ls & netstat (|, &, ; 쓸 수 있으면 위험) → 지정된 명령어만 실행하도록 해서 방어","source":422,"corrected":false,"legal":false,"sourceNote":"운영체제 명령어 삽입 ( command 인젝션 ) : 외부 공격자가 운영체제 명령어 삽입하여 실행. 웹 사이트에에서 외부 입력값을 이용해 OS 명령어 실행( JAVA에서 Runtime.exec ) 기능 있을 때 가능 <예> ls & netstat ( |, &, ; 쓸 수 있으면 위험) → 지정된 명령어만 실행하도록 해서 방어 공격 : cmd = request.getParameter(”cmd”); java.Runtime.exec (cmd);\n\n공격 : cmd = request.getParameter(”cmd”); java.Runtime.exec (cmd);","sourceTopic":"SW 개발보안","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g423","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n공격 : cmd = request.getParameter(”cmd”); (가)(cmd);","a":"(가) java.Runtime.exec","e":"공격 : cmd = request.getParameter(”cmd”); java.Runtime.exec(cmd);","source":423,"corrected":false,"legal":false,"sourceNote":"운영체제 명령어 삽입 ( command 인젝션 ) : 외부 공격자가 운영체제 명령어 삽입하여 실행. 웹 사이트에에서 외부 입력값을 이용해 OS 명령어 실행( JAVA에서 Runtime.exec ) 기능 있을 때 가능 <예> ls & netstat ( |, &, ; 쓸 수 있으면 위험) → 지정된 명령어만 실행하도록 해서 방어 공격 : cmd = request.getParameter(”cmd”); java.Runtime.exec (cmd);\n\n공격 : cmd = request.getParameter(”cmd”); java.Runtime.exec (cmd);","sourceTopic":"SW 개발보안","lessonIds":["sql-injection"]},{"id":"g424","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : 파일 형식 검증 없이 업로드 허용하여 악성 코드((나))를 업로드 후 실행 → php, asp, jsp 또는 CER(인증서파일. 실행도 가능)을 웹 셸로 사용","a":"(가) 위험한 형식 파일 업로드 / (나) 웹 셸","e":"위험한 형식 파일 업로드 : 파일 형식 검증 없이 업로드 허용하여 악성 코드(웹 셸)를 업로드 후 실행 → php, asp, jsp 또는 CER(인증서파일. 실행도 가능)을 웹 셸로 사용","source":424,"corrected":false,"legal":false,"sourceNote":"위험한 형식 파일 업로드 : 파일 형식 검증 없이 업로드 허용하여 악성 코드( 웹 셸 )를 업로드 후 실행 → php, asp, jsp 또는 CER(인증서파일. 실행도 가능)을 웹 셸로 사용 Multipart(첨부파일 업로드 프로그램) 등 사용 시 발생(공개 웹 에디터 사용) 공격코드 : Web Shell 업로드(서버side 스크림트:jsp, php, asp 등) 방어 : 확장자 필터링 및 제거, 파일명을 랜덤하게 함, 디렉터리가 외부 노출 안되게 함, 파일 타입/크기/실행권한 제거 → 한계 : 이중 확장자 (test.php.jpg)에 취약. Null Byte 공격 (test.php%00.jpg) 가능","sourceTopic":"SW 개발보안"},{"id":"g425","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nMultipart(첨부파일 업로드 프로그램) 등 사용 시 발생(공개 (가) 사용)","a":"(가) 웹 에디터","e":"Multipart(첨부파일 업로드 프로그램) 등 사용 시 발생(공개 웹 에디터 사용)","source":425,"corrected":false,"legal":false,"sourceNote":"위험한 형식 파일 업로드 : 파일 형식 검증 없이 업로드 허용하여 악성 코드( 웹 셸 )를 업로드 후 실행 → php, asp, jsp 또는 CER(인증서파일. 실행도 가능)을 웹 셸로 사용 Multipart(첨부파일 업로드 프로그램) 등 사용 시 발생(공개 웹 에디터 사용) 공격코드 : Web Shell 업로드(서버side 스크림트:jsp, php, asp 등) 방어 : 확장자 필터링 및 제거, F 토큰(=난수 / (다) 재인증","e":"대응2 : 중요 화면(예:pw변경)에는 세션 외에 CSRF 토큰(=난수)으로 재인증. cf. OAuth : SNS 통한 인증. OAuth 2.0은 Access key에 대한 refresh 기능 포함 → Spring Framework 작업 : DispatcherServlet(토큰 전송), Inspector(차단, 검사)","source":435,"corrected":false,"legal":false,"sourceNote":"대응2 : 중요 화면(예:pw변경)에는 세션 외에 CSRF 토큰(=난수) 으로 재인증 . cf. OAuth : SNS 통한 인증. OAuth 2.0은 Access key에 대한 refresh 기능 포함 → Spring Framework 작업 : DispatcherServlet(토큰 전송), Inspector(차단, 검사)","sourceTopic":"SW 개발보안"},{"id":"g436","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : 패스워드 변경 시 (나)로 추가적으로 입력받아 확인","a":"(가) 대응3 / (나) 현재 패스워드","e":"대응3 : 패스워드 변경 시 현재 패스워드로 추가적으로 입력받아 확인","source":436,"corrected":false,"legal":false,"sourceNote":"대응3 : 패스워드 변경 시 현재 패스워드 로 추가적으로 입력받아 확인","sourceTopic":"SW 개발보안"},{"id":"g437","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : 입력 폼 작성 시 GET아니라 (나) 사용","a":"(가) 대응4 / (나) POST 방식","e":"대응4 : 입력 폼 작성 시 GET아니라 POST 방식 사용","source":437,"corrected":false,"legal":false,"sourceNote":"대응4 : 입력 폼 작성 시 GET아니라 POST 방식 사용","sourceTopic":"SW 개발보안"},{"id":"g438","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n서버사이드 요청 위조((가)) : 사용자 입력 값을 (나)에 사용하여 악의적인 요청 전송","a":"(가) SSRF / (나) 서버 간의 요청","e":"서버사이드 요청 위조(SSRF) : 사용자 입력 값을 서버 간의 요청에 사용하여 악의적인 요청 전송","source":438,"corrected":false,"legal":false,"sourceNote":"서버사이드 요청 위조( SSRF ) : 사용자 입력 값을 서버 간의 요청 에 사용하여 악의적인 요청 전송 공격 : url=request.getParameter(”url”) url. OpenConnection ();","sourceTopic":"SW 개발보안"},{"id":"g439","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n공격 : url=request.getParameter(”url”) url.(가)();","a":"(가) OpenConnection","e":"공격 : url=request.getParameter(”url”) url.OpenConnection();","source":439,"corrected":false,"legal":false,"sourceNote":"서버사이드 요청 위조( SSRF ) : 사용자 입력 값을 서버 간의 요청 에 사용하여 악의적인 요청 전송 공격 : url=request.getParameter(”url”) url. OpenConnection ();\n\n공격 : url=request.getParameter(”url”) url. OpenConnection ();","sourceTopic":"SW 개발보안","lessonIds":["sql-injection"]},{"id":"g440","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"HTTP 응답 분할 취약점에서 헤더 구분에 악용될 수 있는 CRLF의 16진수 값과 제어 문자 표현을 쓰시오.","a":"0D0A, \\r\\n","e":"CR=0D, LF=0A이므로 CRLF는 0D0A이다.","source":440,"corrected":true,"legal":false},{"id":"g441","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"[SW 개발보안] 강조한 보안 개념·기술에 관한 용어를 쓰시오.","a":"(가) 두번째 응답에 XSS","e":"첫 번째 응답 종료, 두번째 응답에 XSS","source":441,"corrected":false,"legal":false,"sourceNote":"HTTP 응답 분할 : HTTP 응답 헤더에 개행문자(CRLF, 0A0D, \\r\\n) 를 삽입하여 응답을 분할(헤더와 바디가 추가로 더 생김)하는 보안약점 → 응답 헤더를 조작하거나 악의적인 JS를 삽입하여 클라이언트 공격(XSS) 가능 첫 번째 응답 종료, 두번째 응답에 XSS 방어 : 개행문자 ReplaceAll\n\n첫 번째 응답 종료, 두번째 응답에 XSS","sourceTopic":"SW 개발보안"},{"id":"g442","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : Stack(지역 변수, 복귀 주소), Heap(동적 메모리)의 메모리 공간 넘어감 → 메모리 정보가 노출되거나 비정상 종료됨","a":"(가) 메모리 버퍼 오버플로우","e":"메모리 버퍼 오버플로우 : Stack(지역 변수, 복귀 주소), Heap(동적 메모리)의 메모리 공간 넘어감 → 메모리 정보가 노출되거나 비정상 종료됨","source":442,"corrected":false,"legal":false,"sourceNote":"메모리 버퍼 오버플로우 : Stack(지역 변수, 복귀 주소), Heap(동적 메모리)의 메모리 공간 넘어감 → 메모리 정보가 노출되거나 비정상 종료됨 공격 : test.do?data=aa….aa 방어1 : DEP - Heap 실행 권한 삭제, 랜덤스택(ASLR) - 동적주소 설정 <예> randomize_va_space=2, Stack Shield = 1 방어2 : 취약한 API 사용하지 않음, 경계값 검사","sourceTopic":"SW 개발보안"},{"id":"g443","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : DEP - Heap 실행 권한 삭제, 랜덤스택(ASLR) - 동적주소 설정 <예> randomize_va_space=2, Stack Shield = 1","a":"(가) 방어1","e":"방어1 : DEP - Heap 실행 권한 삭제, 랜덤스택(ASLR) - 동적주소 설정 <예> randomize_va_space=2, Stack Shield = 1","source":443,"corrected":false,"legal":false,"sourceNote":"방어1 : DEP - Heap 실행 권한 삭제, 랜덤스택(ASLR) - 동적주소 설 e":"충분하지 않은 키 길이 사용 : 대칭키 128비트, 비대칭키 RSA 2048비트 이상 사용 권장\n\n적절하지 않은 난수 값 사용 : SEED 값(동적 값이어야 하며)은 256비트 이상 사용 권장. Math.random은 보안에 취약 → java. util .random → java.security.SecureRandom 사용 권장","sourceTopic":"SW 개발보안","lessonIds":["xss-csrf"]},{"id":"g452","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)함수 사용 : (나)찾을 수 있는 취약점 cf. 가명처리에서의 솔트 = 추가정보로 관리","a":"(가) 솔트(32byte) 없이 일방향 해시 / (나) 레인보우 테이블을 이용하여 원문","e":"솔트(32byte) 없이 일방향 해시 함수 사용 : 레인보우 테이블을 이용하여 원문 찾을 수 있는 취약점 cf. 가명처리에서의 솔트 = 추가정보로 관리","source":452,"corrected":false,"legal":false,"sourceNote":"솔트(32byte) 없이 일방향 해시 함수 사용 : 레인보우 테이블을 이용하여 원문 찾을 수 있는 취약점 cf. 가명처리에서의 솔트 = 추가정보로 관리","sourceTopic":"SW 개발보안"},{"id":"g453","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"개발보안의 시간 및 상태 관련 취약점의 예를 하나 쓰고 예방 방법을 설명하시오.","a":"경쟁 상태(Race Condition) 또는 TOCTOU 취약점. 원자적 처리, 락, 상태 검증 등을 적용한다.","e":"검사 시점과 실제 사용 시점 사이의 상태 변경을 공격할 수 있다.","source":453,"corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g454","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : 다중 프로세스 환경에서 경합. 스레드를 (나)(락 등)으로 처리해야 해결","a":"(가) 경쟁조건 / (나) 동기화 구문","e":"경쟁조건 : 다중 프로세스 환경에서 경합. 스레드를 동기화 구문(락 등)으로 처리해야 해결","source":454,"corrected":false,"legal":false,"sourceNote":"경쟁조건 : 다중 프로세스 환경에서 경합. 스레드를 동기화 구문 (락 등)으로 처리해야 해결","sourceTopic":"SW 개발보안"},{"id":"g455","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"SW 개발보안에서 에러 처리, 코드 오류, 캡슐화, API 오용 중 두 분야를 골라 보안상 주의점을 설명하시오.","a":"에러 처리: 내부 경로·SQL 등을 상세 오류에 노출하지 않는다. API 오용: API 계약·권한·인증서 검증을 올바르게 수행한다.","e":"코드 오류와 캡슐화 문제도 의도하지 않은 정보 노출·권한 침해와 연결될 수 있다.","source":455,"corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g456","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발 L 문의 (라) 만들어서 공격. 컬럼 개수와 데이터 타입이 동일해야 적용 가능 cf. Mass SQL Injection : 대용량 DB 접근 cf. Cookie Injection : Get/Post가 아닌 Cookie 통해 데이터 전달","a":"(가) Blind / (나) SQL Injection / (다) SQL 결과가 True와 False로 오며, substr() 함수와 함께 사용 / (라) Union으로 합집합","e":"Blind SQL Injection : substr()으로 문자열을 하나씩 자르고 아스키코드 입력해서 해당 문자열 완성(true, false로 확인)하는 공격기법. SQL 결과가 True와 False로 오며, substr() 함수와 함께 사용됨 cf. UNION SQL Injection : SQL 문의 Union으로 합집합 만들어서 공격. 컬럼 개수와 데이터 타입이 동일해야 적용 가능 cf. Mass SQL Injection : 대용량 DB 접근 cf. Cookie Injection : Get/Post가 아닌 Cookie 통해 데이터 전달","source":460,"corrected":false,"legal":false,"sourceNote":"Blind SQL Injection : substr()으로 문자열을 하나씩 자르고 아스키코드 입력해서 해당 문자열 완성(true, false로 확인)하는 공격기법. SQL 결과가 True와 False로 오며, substr() 함수와 함께 사용 됨 cf. UNION SQL Injection : SQL 문의 Union으로 합집합 만들어서 공격. 컬럼 개수와 데이터 타입이 동일해야 적용 가능 cf. Mass SQL Injection : 대용량 DB 접근 cf. Cookie Injection : Get/Post가 아닌 Cookie 통해 데이터 전달","sourceTopic":"기타 보안","lessonIds":["xss-csrf","sql-injection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g461","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"기타 보안","q":"안전한 파일 업로드 구현에 필요한 보안 대책을 네 가지 쓰시오.","a":"확장자·MIME·파일 내용 확인, 파일 크기·개수 제한, 업로드 경로 실행권한 제거, 안전한 파일명 재지정 및 저장소 분리.","e":"확장자만 검사하면 우회될 수 있으므로 여러 보안 통제를 결합한다.","source":461,"corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g462","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"기타 보안","q":"파일 업로드 보안에서 파일 타입, 크기, 개수와 실행 권한을 각각 제한하는 이유를 설명하시오.","a":"악성 유형 업로드 방지, 자원 소진 방지, 대량 업로드 제한, 업로드 파일을 웹서버가 실행하지 못하게 하기 위함이다.","e":"파일 저장과 실행 권한을 분리하는 것이 중요하다.","source":462,"corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g463","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"기타 보안","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n파일 크기 제한 : 최대 5Mb(5,000,000bit) 제한. 아파치는 웹 서버에서 제한 가능( (가) 사용). c :"general","type":"단답형","area":"04 정보보호일반","topic":"해시함수 : 키 없이 입력 데이터를 고정 길이의 해시값으로 변환하는 일방향 함수","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)(제2역상 저항성, (나)): 주어진 입력과 동일한 해시값을 갖는 다른 입력을 찾기 어려움 → H(M1) = H(M2),(다)","a":"(가) 약한 충돌 회피성 / (나) 2차 선이미지 회피성 / (다) M1 != M2인 M2를 찾기 어려움 (M1은 주어진 값","e":"약한 충돌 회피성(제2역상 저항성, 2차 선이미지 회피성): 주어진 입력과 동일한 해시값을 갖는 다른 입력을 찾기 어려움 → H(M1) = H(M2), M1 != M2인 M2를 찾기 어려움 (M1은 주어진 값)","source":566,"corrected":false,"legal":false,"sourceNote":"충돌 회피성 ( 강한 충돌 저항성 ): 동일한 해시값을 갖는 서로 다른 두 입력을 찾기 어려움 → H(M1) = H(M2), M1 != M2인 M1과 M2를 찾기 어려움 (M1, M2 모두 자유롭게 선택)\n\n약한 충돌 회피성 (제2역상 저항성, 2차 선이미지 회피성 ): 주어진 입력과 동일한 해시값을 갖는 다른 입력을 찾기 어려움 → H(M1) = H(M2), M1 != M2인 M2를 찾기 어려움 (M1은 주어진 값)\n\n생일자 역설 : 해시 충돌은 약 2^(n/2)번의 시도로 발견 가능. SHA-256 이상 권장 (256비트) cf. SHA-1(160비트) - 안전하지 않음 → 생일자 공격 : 23명 중 같은 생일 가지는 사람이 두사람 이상일 확률이 1/2보다 크다. 이를 이용해 동일한 해시값을 갖는 두 입력(해시 충돌) 찾는 공격 → 리눅스 : SHA-512 사용(+salt 적용)","sourceTopic":"해시함수 : 키 없이 입력 데이터를 고정 길이의 해시값으로 변환하는 일방향 함수"},{"id":"g567","bank":"general","type":"서술형","area":"04 정보보호일반","topic":"해시함수 : 키 없이 입력 데이터를 고정 길이의 해시값으로 변환하는 일방향 함수","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\n(가): 해시 충돌은 약 2^(n/2)번의 시도로 발견 가능. (나)(256비트) cf. SHA-1(160비트) - 안전하지 않음 → 생일자 공격 : 23명 중 같은 생일 가지는 사람이 두사람 이상일 확률이 1/2보다 크다. 이를 이용해 동일한 해시값을 갖는 두 입력(해시 충돌) 찾는 공격 → 리눅스 : SHA-512 사용(+salt 적용)","a":"(가) 생일자 역설 / (나) SHA-256 이상 권장","e":"생일자 역설: 해시 충돌은 약 2^(n/2)번의 시도로 발견 가능. SHA-256 이상 권장(256비트) cf. SHA-1(160비트) - 안전하지 않음 → 생일자 공격 : 23명 중 같은 생일 가지는 사람이 두사람 이상일 확률이 1/2보다 크다. 이를 이용해 동일한 해시값을 갖는 두 입력(해시 충돌) 찾는 공격 → 리눅스 : SHA-512 사용(+salt 적용)","source":567,"corrected":false,"legal":false,"sourceNote":"생일자 역설 : 해시 충돌은 약 2^(n/2)번의 시도로 발견 가능. SHA-256 이상 권장 (256비트) cf. SHA-1(160비트) - 안전하지 않음 → 생일자 공격 : 23명 중 같은 생일 가지는 사람이 두사람 이상일 확률이 1/2보다 크다. 이를 이용해 동일한 해시값을 갖는 두 입력(해시 충돌) 찾는 공격 → 리눅스 : SHA-512 사용(+salt 적용)","sourceTopic":"해시함수 : 키 없이 입력 데이터를 고정 길이의 해시값으로 변환하는 일방향 함수","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 임 클라우드 서버 region","source":574,"corrected":false,"legal":false,"sourceNote":"개인정보보호법 : 15조 (수집이용), 17조(제공), 21조 (파기), 22조(동의 받는 방법), 23조(민감정보 처리 제한), 24조 (고유식별자 처리 제한), 24조2(주민번호 처리 제한), 26조 (업무위탁에 의한 처리 제한) cf. 이용 및 제공 내역의 통지 : 5만명 민감 혹은 고유식별자 또는 정보주체수 100만명 이상인 경우 cf. 업무 위탁이 아닌 처리 위탁의 경우 별도 동의 불필요 <예> 게임 클라우드 서버 region","sourceTopic":"개요","lessonIds":["privacy"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g575","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"정보보호 관리","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\nISMS 인증 : (가). 일정 조건 사업자 의무 인증. 인증 유효기간 (나) → (다): (라)(VoIP, CDN, IPTV 사업자 포함), (마)(통신 시설 운영 사업자-서버호스팅 사업자 등), 정보통신서비스 (바) 이상 사업자,(사), 세입 1500억원 이상이면서(아)교 ","a":"(가) 관리체계 수립 및 운영, 보호대책 요구사항 / (나) 3년 / (다) 대상자 / (라) ISP / (마) IDC / (바) 매출액 100억 또는 일일 이용자 100만명 / (사) 매출액 1500억 이상 상급종합병원 / (아) 재학생 1만명 이상 대학","e":"ISMS 인증 : 관리체계 수립 및 운영, 보호대책 요구사항. 일정 조건 사업자 의무 인증. 인증 유효기간 3년 → 대상자 : ISP(VoIP, CDN, IPTV 사업자 포함), IDC(통신 시설 운영 사업자-서버호스팅 사업자 등), 정보통신서비스 매출액 100억 또는 일일 이용자 100만명 이상 사업자, 매출액 1500억 이상 상급종합병원, 세입 1500억원 이상이면서 재학생 1만명 이상 대학교","source":575,"corrected":false,"legal":true,"sourceNote":"ISMS 인증 : 관리체계 수립 및 운영, 보호대책 요구사항 . 일정 조건 사업자 의무 인증. 인증 유효기간 3년 → 대상자 : ISP (VoIP, CDN, IPTV 사업자 포함), IDC (통신 시설 운영 사업자-서버호스팅 사업자 등), 정보통신서비스 매출액 100억 또는 일일 이용자 100만명 이상 사업자, 매출액 1500억 이상 상급종합병원 , 세입 1500억원 이상이면서 재학생 1만명 이상 대학 교\n\nISMS-P 인증 : ISMS 인증에 개인정보처리 단계별 요구사항 추가한 통합 인증. 자율 인증. 한국인터넷진흥원, 금융보안원 에서 인증 부여. 정보통신 제공자(영리 목적으로 망 이용하는자) 에 대한 인증 . cf. 금융권 : 전자금융거래법상 매출액 100억 이용자 100만명에서 제외","sourceTopic":"정보보호 관리","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g576","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"정보보호 관리","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nISMS-P 인증 : ISMS 인증에 (가) 추가한 통합 인증. 자율 인증.(나)에서 인증 부여.(다). cf. 금융권 : 전자금융거래법상 매출액 100억 이용자 100만명에서 제외","a":"(가) 개인정보처리 단계별 요구사항 / (나) 한국인터넷진흥원, 금융보안원 / (다) 정보통신 제공자(영리 목적으로 망 이용하는자) eNote":"혼합 분석(복합적 접근법) : 정성적+정략적 함께 사용. 고위험 영역은 상세 위험 분석 + 다른 영역은 기준선법 적용","sourceTopic":"위험평가"},{"id":"g600","bank":"general","type":"작업형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"자산가치(AV) 1,000만 원, 노출계수(EF) 30%, 연간발생률(ARO) 0.2일 때 SLE와 ALE를 계산하시오.","a":"SLE=300만 원, ALE=60만 원","e":"SLE=AV×EF, ALE=SLE×ARO를 적용한다.","source":600,"corrected":false,"legal":false,"sourceNote":"위험에 따른 손실액 분석 ARO(Annualized Rate of Occurrence, 연간 발생률): 연간 예상 사고 발생 횟수 SLE(Single Loss Expectancy, 단일 예상손실액): 사고 1회 발생 시 예상 손실액 → SLE = 자산가치(AV) x 노출계수(EF) ALE(Annualized Loss Expectancy, 연간 예상손실액): 1년 동안 예상되는 총손실액 → ALE = SLE x ARO","sourceTopic":"위험평가","lessonIds":["risk-bcp"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g601","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nARO(Annualized Rate of Occurrence, 연간 발생률): (가)예상 사고 발생 (나)","a":"(가) 연간 / (나) 횟수","e":"ARO(Annualized Rate of Occurrence, 연간 발생률): 연간 예상 사고 발생 횟수","source":601,"corrected":false,"legal":false,"sourceNote":"위험에 따른 손실액 분석 ARO(Annualized Rate of Occurrence, 연간 발생률): 연간 예상 사고 발생 횟수 SLE(Single Loss Expectancy, 단일 예상손실액): 사고 1회 발생 시 예상 손실액 → SLE = 자산가치(AV) x 노출계수(EF) ALE(Annualized Loss Expectancy, 연간 예상손실액): 1년 동안 예상되는 총손실액 → ALE = SLE x ARO\n\nARO(Annualized Rate of Occurrence, 연간 발생률): 연간 예상 사고 발생 횟수\n\nSLE(Single Loss Expectancy, 단일 예상손실액): 사고 1회 발생 시 예상 손실액 → SLE = 자산가치(AV) x 노출계수(EF)","sourceTopic":"위험평가"},{"id":"g602","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nSLE(Single Loss Expectancy, 단일 예상손실액): 사고 (가) 발생 시 예상 (나)→(다)","a":"(가) 1회 / (나) 손실액 / (다) SLE = 자산가치(AV) x 노출계수(EF","e":"SLE(Single Loss Expectancy, 단일 예상손실액): 사고 1회 발생 시 예상 손실액 → SLE = 자산가치(AV) x 노출계수(EF)","source":602,"corrected":false,"legal":false,"sourceNote":"ARO(Annualized Rate of Occurrence, 연간 발생률): 연간 예상 사고 발생 횟수\n\nSLE(Single Loss Expectancy, 단일 예상손실액): 사고 1회 발생 시 예상 손실액 → SLE = 자산가치(AV) x 노출계수(EF)\n\nALE(Annualized Loss Expectancy, 연간 예상손실액): 1년 동안 예상되는 총손실액 → ALE = SLE x ARO","sourceTopic":"위험평가"},{"id":"g603","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\nALE(Annualized Loss Expectancy, 연간 예상손실액): 1년 동안 예상되는 총손실액 → (가)","a":"(가) ALE = SLE x ARO","e":"ALE(Annualized Loss Expectancy, 연간 예상손실액): 1년 동안 예상되는 총손실액 → ALE = SLE x ARO","source":603,"corrected":false,"legal":true,"sourceNote":"SLE(Single Loss Expectancy, 단일 예상손실액): 사고 1회 발생 시 예상 손실액 → SLE = 자산가치(AV) x 노출계수(EF)\n\nALE(Annualized Loss Expectancy, 연간 예상손실액): 1년 동안 예상되는 총손실액 → ALE = SLE x ARO","sourceTopic":"위험평가","lessonIds":["risk-bcp"]},{"id":"g604","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"위험대응 전략 네 가지의 이름과 의미를 각각 쓰시오.","a":"위험 수용·감소·전가·회피. 수용은 인정, 감소는 통제 적용, 전가는 책임/손실 분담, 회피는 위험 활동 중단이다.","e":"전가해도 위험 자체가 사라진다고 보장되지 않는다.","source":604,"corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g605","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : 위험분석 → 위험 평가 → 대책설정","a":"(가) 3단계 위험 관리","e":"3단계 위험 관리 : 위험분석 → 위험 평가 → 대책설정","source":605,"corrected":false,"legal":false,"sourceNote":"3단계 위험 관리 : 위험분석 → 위험 평가 → 대책설정","sourceTopic":"위험평가"},{"id":"g606","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\n경영진의 참여 : 정보보호 정책, (가)결과, 보호대책 (나), (다)결과 등 주요 사항 (라)","a":"(가) 위험평가 / (나) 이행계획 / (다) 내부감사 / (라) 검토·승인","e":"경영진의 참여 : 정보보호 정책, 위험평가 결과, 보호대책 이행계획, 내부감사 결과 등 주요 사항 검토·승인","source":606,"corrected":false,"legal":false,"sourceNote":"관리체계 수립 및 운영 경영진의 참여 : 정보보호 정책, 위험평가 결과, 보호대책 이행계획 , 내부감사 결과 등 주요 사항 검토·승인 정보보호 최고책임자( CISO ) 지정 : 임원급으로 지정. 매출액 100억 이상, 이용자 100만명 이상 인 경우 과기정통부에 6개월 이내 신고 → 겸직 금지 대상 : 자산총액 5조 원 이상, 또는 ISMS 의무 인증 대상이면서 자산총액 5,000억 원 이상인 정보통신서비스 제공자 등. → 개인정보 보호책임자(CPO) : 소규모 기업은 대표 → CISO, CPO 공동 : 보호 계획 수립, 관리 실태 점검, 교육. cf. CISO는 위험평가도 해야 함 조직구성 : 정보보호 실무조직 및 위원회 구성, 역할과 책임 명확화 위험관리 : 정보자산 식별 - (보호대책) : 자산 및 개인정보 분류기준( 서버, DB 등 그룹핑 ) , 중요도 산정 (기밀성/무결성/가용성) 위험 평가 : 연 1회 이상 실시하고 주요 변경 발생 시 추가 검토\n\n경영진의 참여 : 정보보호 정책, 위험평가 결과, 보호대책 이행계획 , 내부감사 결과 등 주요 사항 검토·승인","sourceTopic":"위험평가","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g607","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 정보보안 사례·설명의 빈칸을 채우고, 핵심 기술의 목적이나 동작 원리를 함께 설명하시오.\n정보보호 최고책임자((가)) 지정 : 임원급으로 지정. (나)인 경우 과기정통부에(다) 신고 →(라) 대상 : 자산총액 5조 원 이상, 또는 ISMS 의무 인증 대상이면서 자산총액 5,000억 원 이상인 정보통신서비스 제공자 등. → 개인정보 보호책임자(CPO) : 소규모 기업은 대표 → CISO, CPO 공동 : 보호 계획 수립, 관리 실태 점검, 교육. cf. CISO는 위험평가도 해야 함","a":"(가) CISO / (나) 매출액 100억 이상, 이용자 100만명 이상 / (다) 6개월 이내 / (라) 겸직 금지","e":"정보보호 최고책임자(CISO) 지정 : 임원급으로 지정. 매출액 100억 이상, 이용자 100만명 이상인 경우 과기정통부에 6개월 이내 신고 → 겸직 금지 대상 : 자산총액 5조 원 이상, 또는 ISMS 의무 인증 대상이면서 자산총액 5,000억 원 이상인 정보통신서비스 제공자 등. → 개인정보 보호책임자(CPO) : 소규모 기업은 대표 → CISO, CPO 공동 : 보호 계획 수립, 관리 실태 점검, 교육. cf. CISO는 위험평가도 해야 함","source":607,"corrected":false,"legal":true,"sourceNote":"정보보호 최고책임자( CISO ) 지정 : 임원급으로 지정. 매출액 100억 이상, 이용자 100만명 이상 인 경우 과기정통부에 6개월 이내 신고 → 겸직 금지 대상 : 자산총액 5조 원 이상, 또는 ISMS 의무 인증 대상이면서 자산총액 5,000억 원 이상인 정보통신서비스 제공자 등. → 개인정보 보호책임자(CPO) : 소규모 기업은 대표 → CISO, CPO 공동 : 보호 계획 수립, 관리 실태 점검, 교육. cf. CISO는 위험평가도 해야 함","sourceTopic":"위험평가","lessonIds":["privacy"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g608","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n조직구성 : 정보보호 (가)및 (나)구성, 역할과 책임 명확화","a":"(가) 실무조직 / (나) 위원회","e":"조직구성 : 정보보호 실무조직 및 위원회 구성, 역할과 책임 명확화","source":608,"corrected":false,"legal":false,"sourceNote":"정보보호 최고책임자( CISO ) 지정 : 임원급으로 지정. 매출액 100억 이상, 이용자 100만명 이상 인 경우 과기정통부에 6개월 이내 신고 → 겸직 금지 대상 : 자산총액 5조 원 이상, 또는 ISMS 의무 인증 대상이면서 자산총액 5,000억 원 이상인 정보통신서비스 제공자 등. → 개인정보 보호  따라 보존해야 하는 경우 분리 보관 등 필요한 조치 개인정보 제3자 제공 : 동의 또는 법적 근거 필요. 동의 시 제공받는 자, 이용 목적 , 제공 항목 , 보유 및 이용기간 , 거부 권리와 불이익 고지. 개인정보 처리 위탁 : 위탁업무와 수탁자 공개, 위탁계약 문서화, 수탁자 교육 및 감독. 개인정보 안전성 확보 : 접근권한 관리, 암호화 , 접속기록 관리, 보안 프로그램 운영 등 기술적·관리적·물리적 보호조치. 정보주체 권리 보장 : 개인정보 열람, 정정·삭제, 처리정지, 동의 철회, 자동화된 결정에 대한 거부·설명 요구 등 보장. cf. 개인정보 별도동의 사항 : 제3자 제공, 목적 외 이용, 민감정보, 고유 식별자, 국외이전","sourceTopic":"위험평가","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g619","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)(나) : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. (다).","a":"(가) 주민등록번호 / (나) 처리 제한 / (다) 정보주체의 동의만으로는 처리 불가","e":"주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가.","source":619,"corrected":false,"legal":false,"sourceNote":"주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가 .\n\n민감정보 및 고유식별정보의 처리 : 원칙적으로 처리 금지. 별도 동의 또는 법령상 허용 근거가 있는 경우 가 능. 단, 주민등록번호는 별도 동의만으로 처리 불가 .","sourceTopic":"위험평가"},{"id":"g620","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)(나) : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. (다).","a":"(가) 주민등록번호 / (나) 처리 제한 / (다) 정보주체의 동의만으로는 처리 불가","e":"주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가.","source":620,"corrected":false,"legal":false,"sourceNote":"주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가 .\n\n민감정보 및 고유식별정보의 처리 : 원칙적으로 처리 금지. 별도 동의 또는 법령상 허용 근거가 있는 경우 가 능. 단, 주민등록번호는 별도 동의만으로 처리 불가 .","sourceTopic":"위험평가"},{"id":"g621","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n민감정보 및 고유식별정보의 처리 : 원칙적으로 처리 금지. (가)능. 단, (나).","a":"(가) 별도 동의 또는 법령상 허용 근거가 있는 경우 가 / (나) 주민등록번호는 별도 동의만으로 처리 불가","e":"민감정보 및 고유식별정보의 처리 : 원칙적으로 처리 금지. 별도 동의 또는 법령상 허용 근거가 있는 경우 가능. 단, 주민등록번호는 별도 ","area":"05 정보보호관리 및 법률","topic":"정보보호 인증제도","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가) : ST에 명세된 보안 요구사항 충족여부 확인","a":"(가) 평가대상(TOE","e":"평가대상(TOE) : ST에 명세된 보안 요구사항 충족여부 확인","source":643,"corrected":false,"legal":false,"sourceNote":"보안목표명세서(ST ) : 구현명세의 집합 , PP 요구사항 충족여부 확인\n\n평가대상(TOE) : ST에 명세된 보안 요구사항 충족여부 확인\n\n평가보증등급(EAL) : 보증 수준. 평가요구사항대로 구현되었는지 평가. EAL~EAL7.","sourceTopic":"정보보호 인증제도"},{"id":"g644","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"정보보호 인증제도","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)(Korea Cryptographic Module Validation Program, (나)) : 국가·공공기관 등에서 사용하는 암호모듈의 안전성과 구현 적합성을 검증하는 제도.","a":"(가) KCMVP / (나) 암호모듈 검증제도","e":"KCMVP(Korea Cryptographic Module Validation Program, 암호모듈 검증제도) : 국가·공공기관 등에서 사용하는 암호모듈의 안전성과 구현 적합성을 검증하는 제도.","source":644,"corrected":false,"legal":false,"sourceNote":"KCMVP (Korea Cryptographic Module Validation Program, 암호모듈 검증제도 ) : 국가·공공기관 등에서 사용하는 암호모듈의 안전성과 구현 적합성을 검증하는 제도.\n\nGDPR(General Data Protection Regulation, 일반 개인정보 보호법) : EU 회원국에 공통으로 적용되는 개인정보 보호 법률","sourceTopic":"정보보호 인증제도"},{"id":"g645","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"정보보호 인증제도","q":"클라우드 서비스의 대표 모델인 IaaS, PaaS, SaaS의 제공 범위를 각각 설명하시오.","a":"IaaS는 가상 서버·스토리지·네트워크 인프라, PaaS는 애플리케이션 개발·실행 플랫폼, SaaS는 완성된 응용 소프트웨어를 서비스로 제공한다.","e":"계층에 따라 서비스 제공자와 이용자의 보안 책임 범위가 달라진다.","source":645,"corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g646","bank":"general","type":"단답형","area":"05 정보보호관리 및 법률","topic":"정보보호 인증제도","q":"다음 설명의 괄호에 들어갈 용어·기술·수치 또는 명령어를 쓰시오.\n(가)(Security as a Service, 서비스형 보안) : 클라우드 기반으로 보안 기능을 서비스 형태로 제공","a":"(가) SECaaS","e":"SECaaS(Security as a Service, 서비스형 보안) : 클라우드 기반으로 보안 기능을 서비스 형태로 제공","source":646,"corrected":false,"legal":false,"sourceNote":"SaaS(Software as a Service, 서비스형 소프트웨어) : 인터넷을 통해 완성된 소프트웨어 제공. 사용자는 별도 설치·관리 없이 서비스 이용. 예) Gmail, Google Docs\n\nSECaaS (Security as a Service, 서비스형 보안) : 클라우드 기반으로 보안 기능을
