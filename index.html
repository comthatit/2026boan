function renderHome(){const x=stat();const recent=S.history[0];return `<div class="hero"><div class="eyebrow">PASS THE PRACTICAL EXAM</div><h1>핵심은 확실하게 암기하고,<br>실전은 시험처럼 연습하세요.</h1><p>학습노트 강조 구간과 과년도 실기 문항 형식을 바탕으로 만든 통합 학습실입니다. 단답형·서술형·작업형 풀이에서 100점 실전 모의고사까지 한 곳에서 진행하세요.</p><div class="heroactions"><button class="btn secondary" data-route="deep">◈ 심층 학습·추가 예상문제</button><button class="btn" data-route="memory">★ 핵심 암기 시작</button><button class="btn secondary" data-route="mock">실전 모의고사</button></div></div>
 <div class="metrics"><div class="metric"><div class="label">전체 예상문제</div><div class="value">753</div><div class="meta">원문 682 + 기출형 응용 71</div></div><div class="metric"><div class="label">핵심 예상문제</div><div class="value">101</div><div class="meta">붉은색 / 굵게+밑줄</div></div><div class="metric"><div class="label">풀이 완료</div><div class="value">${x.done}</div><div class="meta">문제풀이에서 직접 채점</div></div><div class="metric"><div class="label">핵심 암기 숙지</div><div class="value">${x.memor}<span style="font-size:16px;color:#8d9cac"> /101</span></div><div class="meta">암기 평가 2단계 이상</div></div></div>
 <div class="twocol"><div class="card"><h2>오늘의 추천 학습</h2><div class="notice">신규 심층 예상문제 71문항을 별도 추가했습니다. 문항별 학습노트 원문과 실전 답안 체크리스트를 확인하세요.</div><div class="pathbox"><div class="pathicon">★</div><div><h3>1. ★★★ 최우선 암기</h3><p>핵심 101개 중 실제 답안 작성에 중요한 개념·명령·방어법을 먼저 학습</p><button class="btn sm soft" data-action="mem-start-high">암기 시작</button></div></div><div class="divider"></div><div class="pathbox"><div class="pathicon">▤</div><div><h3>2. 핵심 문제 풀이</h3><p>문제 → 직접 답변 → 모범답안 확인 → 맞힘/재학습 기록</p><button class="btn sm soft" data-action="practice-core">문제 풀이</button></div></div><div class="divider"></div><div class="pathbox"><div class="pathicon">◷</div><div><h3>3. 실전 모의고사</h3><p>단답 12문항 + 서술 4문항 + 실무형 2택1, 총 100점</p><button class="btn sm soft" data-route="mock">시험 연습</button></div></div></div>
 <div class="card"><h2>실기 배점 한눈에</h2><table class="testtable"><thead><tr><th>유형</th><th>문항</th><th>배점</th></tr></thead><tbody><tr><td>단답형</td><td>12</td><td>36점</td></tr><tr><td>서술형</td><td>4</td><td>48점</td></tr><tr><td>실무형</td><td>2택1</td><td>16점</td></tr><tr><th>합계</th><th>17</th><th>100점</th></tr></tbody></table><div class="notice">합격 기준: 60점 이상. 이 배점은 첨부한 표를 따른 <strong>학습용 모의시험</strong>입니다.</div><h3 style="margin-top:23px">최근 학습</h3>${recent?`<p class="studyhint">${time(recent.date)}</p><div class="examscore">${recent.score}<span style="font-size:16px;color:#8998aa"> / 100</span></div><p class="small">${recent.complete?'자가채점 완료':'부분 가채점'} · ${esc(recent.mode)}</p>`:`<div class="empty"><div class="sym">◷</div>아직 모의고사 결과가 없습니다.</div>`}<button class="btn secondary sm" data-route="review">오답·북마크 ${x.wr+x.book}개 보기</button></div></div>`}
function filtered(){let arr=S.practiceBank==='core'?CORE:S.practiceBank==='advanced'?ADVANCED:GENERAL;let word=S.practiceQuery.trim().toLowerCase();return arr.filter(q=>(S.practiceType==='all'||q.type===S.practiceType)&&(S.practiceArea==='all'||q.area===S.practiceArea)&&(S.practiceOnly==='all'||(S.practiceOnly==='wrong'?S.progress[q.id]?.status==='wrong':S.bookmarks[q.id]))&&(!word||[q.q,q.a,q.topic,q.e,...(q.focus||[])].join(' ').toLowerCase().includes(word)))}

function extLinks(q){const ids=(q.lessonIds||[]).filter(x=>LESSON_MAP.has(x));return ids.map(id=>{const L=LESSON_MAP.get(id);return `<div class="deepref"><b>심화 연결 · ${esc(L.title)}</b><p>${sformat(L.summary)}</p><details><summary>자세한 설명 · 실전 예시 열기</summary><div class="detail-text">${sformat(L.detail)}</div><p class="studyhint"><b>출제형 상황:</b> ${sformat(L.scenario)}</p><p class="notehint">주의: ${sformat(L.pitfalls)}</p><div class="small">근거: <a href="${esc(L.source)}" target="_blank" rel="noopener noreferrer">관련 공식 문서 보기</a></div></details></div>`}).join('')}
function sourcePanel(q){const source=q.sourceNote?`<details class="sourcepanel"><summary>📚 학습노트 원문 · 관련 문단 자세히 보기</summary><div class="small" style="margin-bottom:7px">원문 분야: ${esc(q.area)} / ${esc(q.sourceTopic||q.topic)} · <b>인용된 노트 문장</b>이며 표준 해설과 다른 경우 아래 교정 내용을 우선하세요.</div><div class="detail-text">${sformat(q.sourceNote)}</div>${q.verifiedNote?`<div class="notehint"><b>교정 메모</b> ${esc(q.verifiedNote)}</div>`:''}</details>`:'';return source+extLinks(q)}
function detailedAnswer(q,context='practice'){
 const max=context==='mock'?maxpt(S.mock?.reviewIndex||0):(q.type==='단답형'?3:q.type==='서술형'?12:16);
 const chunks=(q.rubric||rubric(q)).slice(0,7);
 const hasParts=Array.isArray(q.rubric)&&q.rubric.length>=3;
 const method=q.answerMethod|| (q.type==='서술형'?'정의·원리 → 분석 근거·비교 → 대응·확인 순서로 서술합니다.':q.type==='작업형'?'원인 파악 → 정확한 명령·설정 → 결과 해석 → 보완·검증 순서로 서술합니다.':'정확한 표준 용어·명령어·수치로 답합니다.');
 return `<section class="answerdetail"><h3>실전 답안 구조 · 학습용 채점 체크</h3><p class="studyhint">${esc(method)} · 아래는 <b>공식 채점표가 아닌 학습용 체크리스트</b>입니다.</p><div class="rubricgrid">${chunks.length?chunks.map((x,i)=>`<div><span class="rubricno">${i+1}</span>${esc(x)}</div>`).join(''):`<div>정확한 명칭과 이유, 관련 보안 속성을 구분해 답하세요.</div>`}</div>${q.detailedAnswer?`<details><summary>작업형 답안 작성 순서</summary><div class="detail-text">${sformat(q.detailedAnswer)}</div></details>`:''}${q.explainSteps?`<div class="checklist">${q.explainSteps.map((x,i)=>`<div>✓ ${esc(x)}</div>`).join('')}</div>`:''}${q.why?`<div class="small" style="margin-top:12px">신규 출제 선정 이유: ${esc(q.why)}</div>`:''}${q.refUrl?`<p class="small" style="margin-top:12px">기준 자료: <a href="${esc(q.refUrl)}" target="_blank" rel="noopener noreferrer">공식 문서 열기</a></p>`:''}</section>`
}
function renderDeep(){const search=(S.deepFind||'').trim().toLowerCase();const hits=LESSONS.filter(x=>(S.deepArea==='all'||x.area===S.deepArea)&&(!search||[x.title,x.summary,x.detail,x.terms.join(' ')].join(' ').toLowerCase().includes(search)));const topic=hits.find(x=>x.id===S.deepLesson)||hits[0]||LESSONS[0];
return title('EXAM BLUEPRINT','기존 학습노트의 맥락과 기출 복원 자료의 문제 형식, 2025~2026 공식 지침을 구분해 학습합니다.')+`<div class="card" style="margin-bottom:17px"><div class="btn-row"><span class="tag">심층 학습 ${LESSONS.length}주제</span><span class="tag">신규 응용 ${ADVANCED.length}문항</span><button class="btn sm right" data-action="practice-advanced">신규 예상문제 풀기</button></div><div class="notice">★★★는 반복학습 추천 우선순위이며 실제 출제 가능성을 통계적으로 계산한 값이 아닙니다. <b>추가 내용</b>은 학습노트 인용과 구분하여 표준·실무 자료를 근거로 작성했습니다.</div><div class="filtergrid" style="grid-template-columns:1fr 2fr"><div class="field"><label>분야</label><select data-change="deepArea"><option value="all">전체 영역</option>${AREA.map(x=>`<option value="${esc(x)}" ${S.deepArea===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>기술/명령어 검색(Enter)</label><input id="deep-search" value="${esc(S.deepFind)}" placeholder="예: SSH, XSS, SIEM, TLS"></div></div></div><div class="deepgrid"><div class="card"><h3>심층 학습 목록 <span class="small">${hits.length}주제</span></h3><div class="lessonlist">${hits.map(x=>`<button class="lessonbtn ${x.id===topic.id?'sel':''}" data-action="deep-open" data-id="${x.id}"><span class="star">${'★'.repeat(x.priority)}</span> <b>${esc(x.title)}</b><span>${esc(x.area)}</span></button>`).join('')||'<div class="empty">검색된 학습 주제가 없습니다.</div>'}</div></div><div class="card"><div class="qhead"><span class="badge practical">확장 학습 · ${esc(topic.origin)}</span><span class="star">${'★'.repeat(topic.priority)}</span></div><h2>${esc(topic.title)}</h2><p class="lead">${esc(topic.summary)}</p><h3 class="deepcaption">① 개념과 분석 · 상세 설명</h3><div class="detail-text">${sformat(topic.detail)}</div><h3 class="deepcaption">② 실전 출제 상황</h3><div class="notice">${sformat(topic.scenario)}</div><h3 class="deepcaption">③ 오답 방지</h3><div class="notehint">${sformat(topic.pitfalls)}</div><div class="divider"></div><p class="small">검증 및 참고 출처: <a href="${esc(topic.source)}" target="_blank" rel="noopener noreferrer">${esc(topic.source)}</a></p><p class="studyhint">※ 표준의 버전과 시험 공고·법령 시행일은 달라질 수 있습니다.</p></div></div>`}

function renderPract(){const avail=filtered(),validOrder=S.practiceOrder.filter(id=>BY_ID.has(id));const inSession=validOrder.length>0;const current=inSession?BY_ID.get(validOrder[Math.min(S.practiceIndex,validOrder.length-1)]):null;const n=Math.min(S.practiceIndex,validOrder.length-1);return title('PRACTICE','예상문제와 핵심 예상문제를 구분하여 유형·분야별로 학습합니다.')+`<div class="card" style="margin-bottom:15px"><div class="filtergrid"><div class="field"><label for="bank">문제집</label><select id="bank" data-change="practiceBank"><option value="core" ${S.practiceBank==='core'?'selected':''}>★ 핵심 예상문제 (101)</option><option value="general" ${S.practiceBank==='general'?'selected':''}>학습노트 예상문제 (753)</option><option value="advanced" ${S.practiceBank==='advanced'?'selected':''}>★ 신규 심층 예상문제 (71)</option></select></div><div class="field"><label for="ptype">문항 유형</label><select id="ptype" data-change="practiceType"><option value="all">전체 유형</option>${['단답형','작업형','서술형'].map(x=>`<option value="${x}" ${S.practiceType===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="area">출제 영역</label><select id="area" data-change="practiceArea"><option value="all">전체 영역</option>${AREA.map(x=>`<option value="${esc(x)}" ${S.practiceArea===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="searchline"><input type="search" id="psearch" placeholder="용어, 명령어, 공격 기법 검색" aria-label="검색어" value="${esc(S.practiceQuery)}"><select class="miniSelect" id="only" aria-label="문항 필터" data-change="practiceOnly"><option value="all">전체</option><option value="wrong" ${S.practiceOnly==='wrong'?'selected':''}>다시 볼 문제</option><option value="book" ${S.practiceOnly==='book'?'selected':''}>북마크</option></select><button class="btn" data-action="start-practice">${inSession?'필터로 다시 시작':'문제 시작'}</button></div><div class="small" style="margin-top:9px">현재 조건: ${avail.length}문항 · 문제 수를 줄이려면 영역이나 유형을 선택하세요.</div></div>${current?`<div class="practicewrap"><div>${renderQuestion(current,n+1,validOrder.length,'practice')}<div class="sessionbar"><button class="btn secondary sm" data-action="p-prev" ${n<=0?'disabled':''}>← 이전</button><span class="small num">${n+1} / ${validOrder.length}</span><div class="bar"><i style="width:${pct(n+1,validOrder.length)}%"></i></div><button class="btn sm" data-action="p-next" ${n>=validOrder.length-1?'disabled':''}>다음 →</button></div></div><div class="card minicard"><h3>현재 학습 세트</h3><p class="studyhint">문항 번호를 눌러 자유롭게 이동할 수 있습니다.</p><div class="jumpwrap">${validOrder.map((id,i)=>`<button class="jump ${i===n?'current':S.progress[id]?'done':''}" data-action="p-jump" data-index="${i}">${i+1}</button>`).join('')}</div><div class="divider"></div><p class="studyhint">풀이한 뒤 <strong>정답·해설 보기</strong>를 누르고 스스로 채점하세요. 모의고사에는 정답이 미리 보이지 않습니다.</p><div class="notice">★ 원문 표시 내용은 학습 우선순위일 뿐 실제 출제를 보장하지 않습니다.</div></div></div>`:`<div class="card empty"><div class="sym">▤</div><h3>문제를 선택해주세요</h3><p>필터를 고르고 <strong>문제 시작</strong>을 누르면 풀이 화면이 표시됩니다.</p><button class="btn" data-action="start-practice">${avail.length}문항 시작하기</button></div>`}`}
function renderQuestion(q,pos,total,context){const shown=context==='review'?S.practiceReveal[q.id]:S.practiceReveal[q.id];let p=S.progress[q.id];return `<div class="card qcard"><div class="qhead">${badge(q.type)}${coreTag(q)}<span class="qmeta right">${esc(q.area)} · ${esc(q.topic.slice(0,55))}</span></div><div class="small" style="margin-bottom:9px">문제 ${pos} / ${total}</div><div class="qtext">${sformat(q.q)}</div>${sourceHint(q)}<div class="divider"></div><div class="field"><label for="p-answer">내 답안</label><textarea class="answerarea" id="p-answer" data-answer="${q.id}" placeholder="정답을 먼저 작성해 보세요.&#10;단답형은 용어·명령어를, 서술형은 핵심 근거를 적으세요.">${esc(S.practiceAnswers[q.id]||'')}</textarea></div><div class="btn-row" style="margin-top:14px"><button class="btn ${shown?'secondary':''}" data-action="p-reveal" data-id="${q.id}">${shown?'정답·해설 숨기기':'정답·해설 보기'}</button><button class="btn secondary" data-action="bookmark" data-id="${q.id}">${S.bookmarks[q.id]?'★ 북마크 해제':'☆ 북마크'}</button>${p?`<span class="badge ${p.status==='right'?'practical':'warn'}">${p.status==='right'?'맞힌 문제':'재학습 문제'}</span>`:''}</div>${shown?`<div class="sol"><div class="solheader">모범답안 · 해설</div><div class="solbody"><strong>정답</strong><p>${sformat(q.a)}</p><strong>설명</strong><p>${sformat(q.e)}</p>${q.memory?`<div class="memorynote"><strong>★ 암기 문장</strong>${esc(q.memory)}</div>`:''}${q.pitfall?`<div class="notehint">⚑ 혼동 주의: ${esc(q.pitfall)}</div>`:''}${q.focus?.length?`<p class="small" style="margin-top:12px">원문 특별 강조: ${esc(q.focus.join(' · '))}</p>`:''}${detailedAnswer(q)}${sourcePanel(q)}</div></div><div class="btn-row" style="margin-top:14px"><button class="btn good" data-action="p-grade" data-id="${q.id}" data-grade="right">✓ 정확히 맞힘</button><button class="btn warn" data-action="p-grade" data-id="${q.id}" data-grade="wrong">↺ 다시 학습</button></div>`:''}</div>`}
function filteredMemory(){let arr=CORE.filter(q=>S.memoryTier==='all'||q.stars>=Number(S.memoryTier));if(S.memoryOnly==='weak')arr=arr.filter(q=>!(S.memoryGrades[q.id]?.level>=2));if(S.memoryOnly==='due')arr=arr.filter(q=>!(S.memoryGrades[q.id]?.due> Date.now()));return arr}

function renderSettings(){return title('DATA & HELP','인터넷 연결 없이 실행되며, 답안 및 학습 기록은 사용 중인 브라우저의 저장소에 보관됩니다.')+`<div class="twocol"><div class="card"><h2>문제 출처와 구성</h2><table class="testtable"><tr><td>전체 예상문제</td><td>753문항</td></tr><tr><td>핵심 예상문제</td><td>101문항</td></tr><tr><td>새로 추가한 심층 예상문제</td><td>71문항</td></tr><tr><td>심층 학습 단원</td><td>22개</td></tr><tr><td>특별 강조 기준</td><td>붉은색 또는 굵게+밑줄</td></tr><tr><td>문항별 내용</td><td>문제 · 정답 · 단계별 채점 요소 · 원문 상세 문단 · 심화 학습 연결</td></tr><tr><td>학습 기록</td><td>정답 확인 · 맞힘/재학습 · 북마크 · 암기 단계 · 모의고사</td></tr></table><div class="notice">전체 문제집과 핵심 문제집은 같은 학습노트에서 파생되어 일부 주제가 중복됩니다. 실무형 모의고사는 특별 제작한 17개 4문항 사례 중 2개를 제시합니다. 과년도 복원 PDF는 문제 유형을 참고한 자료이며, 저자의 원문을 복제한 시험은 아닙니다.</div><h3>정확도 관련 안내</h3><p class="studyhint">기존 학습노트 기반 자동 생성 문항에는 과거 버전이나 단순화된 문장이 포함될 수 있습니다. 원문 인용과 신규 검증 해설을 별도 구분합니다. 중요한 101개 핵심 문항의 일부 정답·해설과 암기 포인트를 보강했으며, 기존 전체 854문항을 개별적으로 공식 검수한 것은 아닙니다. 추가 심층 문항은 공식 표준을 중심으로 별도 검토했습니다. 법령·기술 버전은 시험 시행일의 기준으로 재확인하세요.</p><h3>공식 문서 확인</h3><p class="studyhint"><a href="${OFFICIAL.owasp}" target="_blank" rel="noopener noreferrer">OWASP Top 10:2025</a> · <a href="${OFFICIAL.tls}" target="_blank" rel="noopener noreferrer">RFC 8446(TLS 1.3)</a> · <a href="${OFFICIAL.privacy}" target="_blank" rel="noopener noreferrer">개인정보 안전성 확보조치 기준</a></p><p class="studyhint"><a href="${OFFICIAL.xss}" target="_blank" rel="noopener noreferrer">OWASP XSS 방어</a> · <a href="${OFFICIAL.csrf}" target="_blank" rel="noopener noreferrer">OWASP CSRF 방어</a> · <a href="${OFFICIAL.sql}" target="_blank" rel="noopener noreferrer">OWASP SQL 인젝션 방어</a></p></div><div class="card"><h2>학습 기록 관리</h2><p class="studyhint">같은 PC·브라우저에서 파일을 열어야 저장된 진도와 오답 정보를 계속 사용할 수 있습니다. 파일 경로나 브라우저 환경을 바꾸면 저장소가 달라질 수 있습니다.</p><div class="btn-row" style="margin:18px 0"><button class="btn" data-action="export">학습 기록 내보내기</button><button class="btn secondary" data-action="import">기록 불러오기</button><input id="importfile" type="file" accept="application/json,.json" hidden></div><div class="divider"></div><button class="btn danger" data-action="reset">학습 기록 초기화</button><p class="small" style="margin-top:12px">암기 상태, 오답, 응시 중인 모의고사, 자가채점 및 과거 기록이 삭제됩니다. 문제 데이터는 HTML 안에 그대로 남습니다.</p><div class="divider"></div><h3>채점 방식</h3><p class="studyhint">단답형은 일부 짧은 답안에서만 텍스트 일치 여부를 바탕으로 자동 가점합니다. 띄어쓰기·영문 표기는 정규화하지만 동의어, 복합답안, 서술형, 실무형은 자동 판정하지 않습니다. 따라서 전체 점수는 정답·해설과 대조한 <strong>사용자의 자가채점</strong>을 기준으로 합니다.</p></div></div>`}
function render(){document.querySelectorAll('.navbtn[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===S.page));el.innerHTML=({home:renderHome,practice:renderPract,memory:renderMemory,deep:renderDeep,mock:mockStartView,review:renderReview,settings:renderSettings}[S.page]||renderHome)();document.getElementById('statusline').textContent=`학습: ${stat().done}문항 완료`;updateClock();}
function sample(arr,n){let x=arr.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x.slice(0,n)}
function preparePractice(){const f=filtered();if(!f.length){alert('해당 조건에 맞는 문제가 없습니다. 필터를 조정하세요.');return}S.practiceOrder=f.map(x=>x.id);S.practiceIndex=0;save();render()}
function memStart(){const arr=filteredMemory();if(!arr.length){alert('현재 조건에서 암기할 카드가 없습니다.');return}S.memoryOrder=sample(arr,arr.length).map(x=>x.id);S.memoryIndex=0;S.memoryReveal=false;save();render()}
function memNext(){if(S.memoryIndex<S.memoryOrder.length-1){S.memoryIndex++;S.memoryReveal=false;save();render()}else{S.memoryOrder=[];S.memoryIndex=0;S.memoryReveal=false;save();render();alert('선택한 암기 세트를 마쳤습니다. 미숙지 카드나 전체 카드를 다시 선택해 복습할 수 있습니다.')}}
function examEligible(q){if(q.supplement)return true;const t=q.q||'';if(/이 단원에서 강조|학습노트의|강조된 보안 개념/.test(t))return false;const p=t.split('\n').slice(1).join(' ').trim();if(/^(다음 설명|다음 명령|다음 정보보안)/.test(t)&&p.length<85)return false;return t.length>=50}
function drawMix(type,n,mode,excluded=new Set()){const a=CORE.filter(x=>x.type===type&&!excluded.has(x.source));const b=[...ADVANCED,...GENERAL].filter(x=>x.type===type&&(!x.source||!excluded.has(x.source))&&examEligible(x));const coreN=mode==='core'?n:mode==='general'?0:Math.min(n,Math.ceil(n*.58));const chosen=sample(a,coreN);const used=new Set(chosen.filter(x=>x.source).map(x=>x.source));const rest=b.filter(x=>!x.source||!used.has(x.source));const curated=rest.filter(x=>x.bank==='advanced'||x.supplement);const candidates=rest.filter(x=>x.bank!=='advanced'&&!x.supplement);let left=n-chosen.length;let curatedN=Math.min(left,Math.ceil(left*.8));const fromCurated=sample(curated,curatedN);chosen.push(...fromCurated);left=n-chosen.length;chosen.push(...sample(candidates,left));left=n-chosen.length;if(left>0)chosen.push(...sample(curated.filter(x=>!chosen.includes(x)),left));left=n-chosen.length;if(left>0)chosen.push(...sample(a.filter(x=>!chosen.includes(x)),left));return sample(chosen,n)}
function newMock(){const mode=document.querySelector('input[name="mockmode"]:checked')?.value||'mix',duration=Number(document.getElementById('duration')?.value||180),short=drawMix('단답형',12,mode),essay=drawMix('서술형',4,mode),practical=sample([...CASES,...ADVANCED.filter(x=>x.type==='작업형')],2);if(short.length!==12||essay.length!==4||practical.length!==2){alert('필요한 문항을 충분히 추출하지 못했습니다.');return}const m={id:Date.now(),mode,modeLabel:mode==='mix'?'혼합형':mode==='core'?'핵심 집중형':'전체 예상문제형',duration,started:Date.now(),deadline:duration?Date.now()+duration*60000:0,items:[...short,...essay].map(q=>q.id),practical:{A:practical[0].id,B:practical[1].id},choice:'A',answers:{},index:0,submitted:false,grades:{},reviewIndex:0,saved:false};S.mock=m;save();render()}
function submitMock(auto=false){const m=S.mock;if(!m||m.submitted)return;if(!auto){const incomplete=examQs(m).filter(id=>!String(m.answers[id]||'').trim()).length;if(!confirm(`모의고사를 제출하시겠습니까?\n미작성 ${incomplete}문항이 있습니다. 제출 후에는 답안을 수정할 수 없습니다.`))return}m.submitted=true;m.reviewIndex=0;examQs(m).forEach((id,i)=>{if(i<12){const v=autoShort(BY_ID.get(id),m.answers[id]||'');if(v!==null)m.grades[i]=v}});S.mock=m;save();render()}
function saveResult(){const m=S.mock;if(!m)return;const g=gradeInfo(m);if(!g.complete){alert('17문항 채점을 모두 완료한 다음 기록할 수 있습니다.');return}const record={id:m.id,date:Date.now(),score:g.total,complete:true,mode:m.modeLabel};S.history=S.history.filter(x=>x.id!==m.id);S.history.unshift(record);S.history=S.history.slice(0,40);m.saved=true;save();render();alert(`자가채점 ${g.total}/100점 기록을 저장했습니다. ${g.total>=60?'설정된 60점 합격 기준에 도달했습니다.':'60점 미만이므로 복습을 권장합니다.'}`)}
function countCurrentAnswers(){const m=S.mock;return m?examQs(m).filter(id=>String(m.answers[id]||'').trim()).length:0}
function updateClock(){const badge=document.getElementById('clock');const m=S.mock;if(m&&!m.submitted&&m.deadline){let left=Math.max(0,Math.ceil((m.deadline-Date.now())/1000)),h=Math.floor(left/3600),mi=Math.floor((left%3600)/60),s=left%60;badge.hidden=false;badge.textContent=`◷ ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}`;badge.style.color=left<300?'#a83a35':'#1d518d';if(left===0){submitMock(true);alert('설정한 시험 시간이 종료되어 제출 처리했습니다.')}}else badge.hidden=true}
const ACTION={

'mem-view':b=>{S.memoryView=b.dataset.view;save();render()},'mem-sheet-reveal':()=>{S.memorySheetReveal=!S.memorySheetReveal;save();render()},'mem-sheet-grade':b=>{const id=b.dataset.id,old=S.memoryGrades[id];S.memoryGrades[id]=old?.level===2?{level:1,streak:0,due:Date.now(),ts:Date.now()}:{level:2,streak:1,due:Date.now()+86400000,ts:Date.now()};save();render()},'mem-tier':b=>{S.memoryTier=b.dataset.tier;S.memoryOrder=[];S.memoryIndex=0;save();render()},'start-memory':memStart,'m-reveal':()=>{S.memoryReveal=!S.memoryReveal;save();render()},'m-next':memNext,'m-prev':()=>{S.memoryIndex=Math.max(0,S.memoryIndex-1);S.memoryReveal=false;save();render()},
'm-grade':b=>{const id=S.memoryOrder[S.memoryIndex];let old=S.memoryGrades[id]||{streak:0},lvl=Number(b.dataset.level),streak=lvl===2?(old.streak||0)+1:0;S.memoryGrades[id]={level:lvl,streak,due:Date.now()+(lvl===2?(streak>=3?7:streak===2?3:1)*86400000:lvl===1?1800000:0),ts:Date.now()};save();memNext()},

'reset':()=>{if(confirm('모든 학습 기록과 진행 중인 모의고사를 초기화하시겠습니까?')){S=defaults();save();goto('home')}}
};
