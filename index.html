아닌 경우 → 하나라도 해당하면 2년간 보관","a":"(가) 접속기록 보관·점검 / (나) 1년만 보관 / (다) 5만명 이하 / (라) 민감/고유식별자 / (마) 기간통신사업자(ISP","e":"접속기록 보관·점검 : 개인정보처리시스템의 접속기록을 1년 이상 보관(일정 조건에서는 2년 이상). 월 1회 이상 점검, 다운로드 시 사유 확인. cf. 1년만 보관해도 되는 기업 : 5만명 이하 정보주체 개인정보 보유, 민감/고유식별자 없는 경우, 기간통신사업자(ISP) 아닌 경우 → 하나라도 해당하면 2년간 보관","source":682,"corrected":false,"legal":true,"sourceNote":"접속기록 보관·점검 : 개인정보처리시스템의 접속기록을 1년 이상 보관(일정 조건에서는 2년 이상). 월 1회 이상 점검, 다운로드 시 사유 확인. cf. 1년만 보관 해도 되는 기업 : 5만명 이하 정보주체 개인정보 보유, 민감/고유식별자 없는 경우, 기간통신사업자(ISP) 아닌 경우 → 하나라도 해당하면 2년간 보관","sourceTopic":"개인정보안전성 확보조치","lessonIds":["privacy"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g683","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"리눅스 로그","q":"리눅스에서 현재 로그인한 사용자, 로그인 이력, 로그인 실패 이력을 보는 대표 명령어를 차례대로 쓰시오.","a":"who(또는 w), last, lastb","e":"who/w는 utmp 계열, last는 wtmp, lastb는 btmp 기록을 참조한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["linux-logs"]},{"id":"g684","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"리눅스 권한","q":"공유 디렉터리에서 다른 사용자가 소유한 파일을 임의로 삭제하지 못하게 하는 특수 권한의 명칭과 8진수 비트 값을 쓰시오.","a":"Sticky Bit, 1000","e":"/tmp에 흔히 1777 모드가 사용된다. 디렉터리 소유자와 파일 소유자, 권한이 있는 관리자 등의 삭제 권한에 주의한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["linux-perm"]},{"id":"g685","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"리눅스 패스워드","q":"/etc/shadow의 $6$salt$hash 형식에서 6과 salt가 의미하는 것을 쓰시오.","a":"6은 SHA-512 계열 crypt 식별자, salt는 동일 비밀번호의 해시값이 같아지는 것을 줄이는 난수 값","e":"salt는 레인보우 테이블과 사전 계산 공격의 효율을 떨어뜨린다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["linux-auth"]},{"id":"g686","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"리눅스 방화벽","q":"iptables에서 신규 규칙 추가 시 -A와 -I 옵션의 차이를 쓰시오.","a":"-A: 체인 끝에 추가 / -I: 체인 지정 위치(기본 맨 앞)에 삽입","e":"방화벽 규칙은 순서에 영향을 받을 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g687","bank":"general","type":"단답형","area":"01 시스템 보안","topic":"윈도우 포렌식","q":"Windows에서 사용자 계정 해시를 포함하는 SAM 하이브의 파일 위치를 쓰시오.","a":"C:\\Windows\\System32\\config\\SAM","e":"SAM에는 계정 정보가 저장되며 보호된 환경에서 접근이 제한된다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g688","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"네트워크 보안","q":"공격자가 출발지와 목적지 IP를 피해자 주소로 동일하게 구성하는 공격과 브로드캐스트 기반 ICMP 반사 공격의 이름을 쓰시오.","a":"LAND 공격 / Smurf 공격","e":"LAND는 주소 위조, Smurf는 ICMP Echo 요청의 발신지 위조 및 다수 응답 유도 특성을 가진다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g689","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"네트워크 보안","q":"TCP 연결 수립 과정에서 ACK를 완료하지 않아 서버의 반개방 연결을 다량 점유하는 공격은?","a":"TCP SYN Flooding","e":"대응에는 SYN cookies, 연결 대기열·임계값 관리, 트래픽 차단 등이 활용된다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["tcp-ip","ddos"]},{"id":"g690","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"네트워크 보안","q":"UDP 1900번 포트와 연관되며 반사·증폭 공격에 악용될 수 있는 서비스 탐색 프로토콜은?","a":"SSDP","e":"SSDP는 서비스 탐색을 위한 프로토콜이고 잘못 구성된 서비스는 반사 DDoS에 악용될 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g691","bank":"general","type":"단답형","area":"02 네트워크 보안","topic":"무선 LAN","q":"WEP과 WPA2에서 널리 연관된 암호화 기술을 차례대로 쓰시오.","a":"WEP: RC4 / WPA2: AES-CCMP","e":"WEP는 오래된 취약한 방식이며, WPA2는 일반적으로 AES-CCMP를 사용한다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g692","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"이메일 보안","q":"발신 IP의 도메인 허용 여부, 메일 서명 검증, 두 방식을 바탕으로 한 도메인 정책 적용에 대응하는 표준을 차례대로 쓰시오.","a":"SPF, DKIM, DMARC","e":"SPF는 발신 서버, DKIM은 서명·무결성, DMARC는 정렬 및 수신자 정책을 다룬다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g693","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"웹 보안","q":"웹페이지의 스크립트가 document.cookie로 쿠키를 읽지 못하게 하는 쿠키 속성은?","a":"HttpOnly","e":"HttpOnly는 자바스크립트의 쿠키 접근을 제한하지만 모든 XSS 피해를 차단하는 것은 아니다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["xss-csrf","http-sec"]},{"id":"g694","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"웹 보안","q":"검색엔진 크롤러에 접근 경로 지침을 전달하는 웹루트 텍스트 파일의 이름을 쓰시오.","a":"robots.txt","e":"검색 엔진의 규약 준수에 의존하며 보안 통제가 아니므로 민감정보 보호 수단으로 사용하면 안 된다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g695","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"입력값이 SQL 구문으로 해석되는 것을 방지하기 위한 대표적인 DB 쿼리 작성 기법은?","a":"준비된 문장(Prepared Statement)과 바인딩 파라미터","e":"문자열 연결로 SQL을 구성하는 대신 쿼리 구조와 입력값을 분리한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["sql-injection"]},{"id":"g696","bank":"general","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"인증된 사용자의 브라우저가 의도하지 않은 요청을 보내게 하는 공격 명칭은?","a":"CSRF","e":"세션이 유효하다는 사실만으로 요청 의도를 확인해서는 안 된다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g697","bank":"general","type":"단답형","area":"04 정보보호일반","topic":"정보보호일반","q":"SHA-256의 다중 충돌 탐색과 관련해 약 2^128 수준의 시도를 설명하는 원리는?","a":"생일 역설(생일 공격)","e":"n비트 해시의 충돌 저항성은 대략 2^(n/2) 수준의 복잡도와 관련된다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g698","bank":"general","type":"단답형","area":"04 정보보호일반","topic":"정보보호관리","q":"단일 손실액 SLE에 연간 발생률 ARO를 곱하여 계산하는 값의 명칭과 약어는?","a":"연간 예상손실액(ALE)","e":"ALE=SLE×ARO이며 SLE=자산가치(AV)×노출계수(EF)이다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g699","bank":"general","type":"단답형","area":"04 정보보호일반","topic":"정보보호관리","q":"정보보호 관리체계의 지속적인 개선을 위한 계획-실행-점검-개선 사이클 약어는?","a":"PDCA","e":"Plan-Do-Check-Act를 반복하며 체계를 개선한다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g700","bank":"general","type":"단답형","area":"04 정보보호일반","topic":"디지털 포렌식","q":"디지털 증거의 수집 시점과 분석 시점의 변조 여부 검증에 대표적으로 사용하는 값은?","a":"해시값","e":"수집 당시와 이후의 해시를 비교해 증거 무결성을 확인한다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g701","bank":"general","type":"단답형","area":"04 정보보호일반","topic":"정보보호일반","q":"네트워크 계층 VPN에서 무결성·인증 기능 중심의 프로토콜과 암호화 기능을 지원하는 프로토콜을 쓰시오.","a":"AH, ESP","e":"IPsec의 AH는 기밀성을 제공하지 않으며 ESP는 암호화와 무결성 기능을 제공할 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g702","bank":"general","type":"단답형","area":"04 정보보호일반","topic":"접근통제","q":"기밀성 보호 모델과 무결성 보호 모델을 각각 쓰시오.","a":"Bell-LaPadula / Biba","e":"기밀성은 정보 누출 방지, 무결성은 잘못된 데이터의 전파 방지에 초점을 둔다.","source":null,"corrected":false,"legal":false,"supplement":true},{"id":"g703","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 권한","q":"다음 조건을 만족시키는 명령을 쓰시오: /data/backup 디렉터리에 새로 생성되는 일반 파일은 소유자만 읽고 쓰도록 기본 마스크를 설정한다.","a":"umask 077","e":"일반 파일 기본 생성 모드 666에 umask 077을 적용하면 보통 600으로 생성된다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g704","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 권한","q":"test.sh를 소유자 rwx, 그룹 r-x, 기타 r-x로 설정하는 8진수 chmod 명령을 쓰시오.","a":"chmod 755 test.sh","e":"권한 비트는 r=4, w=2, x=1을 합산한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g705","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 권한","q":"/srv/shared를 모든 사용자가 읽고·쓰고·탐색할 수 있게 하면서 타인 파일의 삭제를 제한하는 chmod 명령을 쓰시오.","a":"chmod 1777 /srv/shared","e":"1777은 rwxrwxrwx에 sticky bit를 추가한 모드이다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g706","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 권한","q":"시스템에서 SetUID가 설정된 모든 파일을 검색하는 find 명령을 쓰시오(오류 메시지는 버림).","a":"find / -type f -perm -4000 2>/dev/null","e":"-perm -4000은 SetUID 비트 포함 조건이다. 2>/dev/null은 표준 오류를 버린다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["linux-perm"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g707","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 권한","q":"파일 /tmp/test의 immutable 속성을 설정하고 다시 해제하는 명령을 차례대로 쓰시오.","a":"chattr +i /tmp/test ; chattr -i /tmp/test","e":"lsattr로 적용된 파일 속성을 조회할 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g708","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 패스워드","q":"Linux에서 로그인 실패 5회 시 계정을 잠그고 120초 후 해제하려 한다. faillock.conf에 작성할 설정 두 줄을 쓰시오.","a":"deny = 5\nunlock_time = 120","e":"pam_faillock가 사용하는 정책 설정 예이며 실제 PAM 구성 적용 여부를 확인해야 한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["linux-auth"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g709","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 작업 스케줄","q":"매일 새벽 3시에 /home/user/backup.sh를 실행하는 사용자 crontab 한 줄을 작성하시오.","a":"0 3 * * * /home/user/backup.sh","e":"사용자 crontab은 분 시 일 월 요일 뒤에 명령이 나온다.","source":null,"corrected":false,"legal":false,"supplement":true,"sourceNote":"crontab 파일 구조 : 분 시 일 월 요일 사용자 실행명령. cf. 인젝션 코드를 서버에 삽입하도록 하면 치명적 해킹 사례가 됨. cf. 윈도우 at : 작업 스케줄러 <예> 0 3 * * * /home/user/backup.sh : 매일 오전 3시 백업스크립트 실행\n\ncrontab 옵션 : -l (작업 스케줄 확인), -e (작업 등록), -r( 작업 삭제), -u 유저 (유저명 설정)","sourceTopic":"리눅스 작업 스케줄","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g710","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 로그","q":"로그인 실패 기록과 마지막 로그인 기록을 각각 살펴보는 명령을 쓰시오.","a":"lastb / lastlog","e":"lastb는 실패 이력, lastlog는 계정별 마지막 로그인 정보를 확인한다.","source":null,"corrected":false,"legal":false,"supplement":true,"sourceNote":"last : 로그인 로그아웃 정보 확인 명령. /var/log/ wtmp 정보 읽음\n\nlastlog : 마지막 로그인 정보 확인 명령. cf. secure는 원격 접속 로그인 정보 볼 수 있는 로그.\n\nlastb : 로그인 실패정보 확인 명령. /var/log/ btmp 정보 읽음","sourceTopic":"리눅스 로그","lessonIds":["linux-logs"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g711","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 방화벽","q":"192.0.2.30에서 들어오는 패킷을 INPUT 체인에서 거부하는 iptables 규칙 한 줄을 쓰시오.","a":"iptables -A INPUT -s 192.0.2.30 -j DROP","e":"운영환경에서는 현재 정책과 기존 규칙 우선순위를 검토한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g712","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 방화벽","q":"TCP 목적지 포트 22로 향하는 패킷만 지정하는 iptables 매치 옵션을 작성하시오.","a":"-p tcp --dport 22","e":"목적지 포트는 --dport이고 출발지 포트는 --sport를 사용한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g713","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 네트워크","q":"192.0.2.0/24 네트워크에서 TCP 443번 목적지 포트 트래픽을 캡처하는 tcpdump 필터를 쓰시오.","a":"tcpdump -nn \"src net 192.0.2.0/24 and tcp dst port 443\"","e":"-nn은 이름/서비스명 역변환을 하지 않고 숫자로 출력한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g714","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"리눅스 네트워크","q":"PID 5900의 프로세스가 실행할 때 전달받은 명령행을 /proc 파일 시스템에서 확인하는 명령을 쓰시오.","a":"tr \"\\0\" \" \" < /proc/5900/cmdline","e":"/proc/PID/cmdline은 인자를 NUL 문자로 구분한다. 단순 출력은 cat /proc/5900/cmdline도 가능하다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g715","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"네트워크 스캐닝","q":"192.0.2.10을 대상으로 운영체제 추정을 수행하는 Nmap 명령과 UDP 스캔 옵션을 각각 쓰시오.","a":"nmap -O 192.0.2.10 / -sU","e":"OS 추정에는 보통 적절한 권한이 필요하며 출력은 확정 정보가 아닌 추정이다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["tcp-ip"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g716","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"윈도우 명령어","q":"Windows에서 로컬 계정·암호 정책 정보를 확인하는 명령과 현재 공유 폴더 목록을 확인하는 명령을 작성하시오.","a":"net accounts / net share","e":"net accounts는 계정 정책, net share는 SMB 공유 상태 확인 명령이다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g717","bank":"general","type":"작업형","area":"01 시스템 보안","topic":"윈도우 명령어","q":"Windows에서 a.txt를 읽기 전용으로 설정하고 해제하는 명령을 차례대로 작성하시오.","a":"attrib +r a.txt / attrib -r a.txt","e":"attrib의 +r/-r는 읽기 전용 파일 속성을 제어한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g718","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"웹 서버 보안","q":"Apache 웹루트에서 디렉터리 인덱스 노출을 막는 Options 설정 예시를 작성하시오.","a":"Options -Indexes","e":"Indexes가 활성화되어 색인 파일이 없는 경우 디렉터리 목록이 노출될 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g719","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"웹 서버 보안","q":"Apache 설정에서 심볼릭 링크 따라가기를 제한하려 한다. Options 지시어 예시를 작성하시오.","a":"Options -FollowSymLinks","e":"적용 위치와 다른 Options 설정에 따라 동작이 달라질 수 있으므로 실제 설정 병합을 확인한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g720","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"웹 서버 보안","q":"웹 요청을 재검증 없이 저장해서는 안 된다. 저장 자체를 금지하는 HTTP 응답 헤더를 작성하시오.","a":"Cache-Control: no-store","e":"no-cache는 저장 금지가 아니라 재검증과 관련된 지시어이다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["http-sec"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g721","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"웹 보안","q":"쿠키 session=ABC를 HTTPS에서만 전송하고 자바스크립트로 읽지 못하게 하는 Set-Cookie 헤더를 작성하시오.","a":"Set-Cookie: session=ABC; Secure; HttpOnly; SameSite=Lax","e":"Secure는 HTTPS 전송 제한, HttpOnly는 JS 쿠키 접근 제한, SameSite는 사이트 간 요청에서 쿠키 전송 제한이다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["xss-csrf","http-sec"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g722","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"Snort","q":"Snort 규칙 옵션에서 경고 메시지가 \"SYN 시도\"가 되도록 하는 옵션을 작성하시오.","a":"msg:\"SYN 시도\";","e":"msg는 룰 탐지 시 기록하는 메시지를 지정한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g723","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"Snort","q":"Snort content 매칭에서 페이로드에 USER가 있고 anonymous는 없도록 하는 옵션을 작성하시오.","a":"content:\"USER\"; content:!\"anonymous\";","e":"각 content 조건과 적용 버전 및 검출 범위를 함께 검토해야 한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["detection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g724","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"Snort","q":"Snort 규칙에서 페이로드 첫 1바이트가 0x00인지 검사하는 내용 매칭 옵션을 작성하시오.","a":"content:\"|00|\"; depth:1;","e":"depth:1은 검색 범위를 페이로드 처음 1바이트로 제한한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["detection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g725","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"DNS 보안","q":"example.com의 TXT 레코드를 조회하여 SPF 설정을 확인하는 dig 명령을 작성하시오.","a":"dig TXT example.com","e":"SPF는 주로 DNS TXT 레코드에 게시된다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["arp-dns"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g726","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"DB 보안","q":"MySQL에서 account 계정이 testdb.users 테이블을 읽을 수 있도록 권한을 주는 SQL을 작성하시오.","a":"GRANT SELECT ON testdb.users TO 'account'@'localhost';","e":"필요한 최소 권한만 부여하고 계정의 호스트 범위를 명시한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g727","bank":"general","type":"작업형","area":"03 애플리케이션 보안","topic":"DB 보안","q":"MySQL에서 이전 문제의 SELECT 권한을 회수하는 SQL을 작성하시오.","a":"REVOKE SELECT ON testdb.users FROM 'account'@'localhost';","e":"REVOKE는 이미 부여된 권한을 회수한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g728","bank":"general","type":"작업형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"서버의 자산가치 2,000만원, 노출계수 25%, 예상 연간 발생률 0.4회일 때 SLE와 ALE를 계산하시오.","a":"SLE=500만원, ALE=200만원","e":"SLE=AV×EF=2,000만×0.25. ALE=SLE×ARO=500만×0.4.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["risk-bcp"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g729","bank":"general","type":"작업형","area":"02 네트워크 보안","topic":"네트워크 계층","q":"IPv4의 MTU가 1500바이트, IP 헤더가 20바이트인 경우 IP 데이터 4,000바이트를 단편화한다. 각 조각의 페이로드와 Fragment Offset을 쓰시오(단편화 가능, 일반적인 20바이트 헤더).","a":"1번: 1480바이트/offset 0, 2번: 1480바이트/offset 185, 3번: 1040바이트/offset 370","e":"마지막 조각을 제외한 페이로드는 8의 배수여야 한다. Fragment Offset 단위는 8바이트이다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["tcp-ip","detection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"g730","bank":"general","type":"서술형","area":"04 정보보호일반","topic":"디지털 포렌식","q":"디지털 포렌식 증거 수집·분석에서 정당성, 무결성, 절차 연속성 원칙을 각각 설명하고 확보 방안을 한 가지씩 쓰시오.","a":"정당성: 적법한 권한과 절차. 무결성: 해시값 비교와 원본 보존. 절차 연속성: 인계·보관·이동·분석 등 취급 이력 문서화.","e":"서술형에서는 원칙의 뜻과 증거 보존 방안을 짝지어 작성하는 것이 좋다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g731","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"웹 보안","q":"게시판 댓글에 삽입한 악성 스크립트가 다른 이용자 브라우저에서 실행되는 공격의 명칭, 원인, 대응책 세 가지를 서술하시오.","a":"Stored XSS. 원인은 불신 입력값을 출력할 때 문맥별 인코딩/안전한 처리를 하지 않기 때문. 대응은 출력 인코딩, 안전한 HTML Sanitizer, CSP(보조), HttpOnly 쿠키 등.","e":"XSS 유형과 실행 위치를 구분하고 출력 인코딩을 핵심 대책으로 제시한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["xss-csrf"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g732","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"웹 보안","q":"웹페이지 내에 삽입된 악성 스크립트에 대한 Secure와 HttpOnly 쿠키 속성의 효과를 구분하고 한계를 설명하시오.","a":"Secure는 HTTPS 연결에서만 쿠키 전송, HttpOnly는 자바스크립트의 쿠키 읽기 제한. XSS 자체를 완전히 방어하지는 못한다.","e":"속성별 보호 목표가 다르므로 XSS 대응 전체와 동일시하면 안 된다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["xss-csrf"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g733","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"DDoS","q":"SYN Flooding, Smurf, DNS 증폭 공격을 원리와 대응 방안 중심으로 비교하시오.","a":"SYN Flooding: 반개방 연결 자원 고갈/SYN cookie 및 연결 관리. Smurf: 위조된 ICMP Echo와 브로드캐스트 응답/Directed Broadcast 전달 차단 등. DNS 증폭: 출발지 IP 위조와 공개 리졸버의 큰 응답/재귀 서비스 제한, BCP38 등.","e":"네트워크 자원 고갈, 반사, 증폭의 차이와 방어 위치를 구분한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["ddos"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g734","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"IPsec","q":"IPsec 전송 모드와 터널 모드 차이를 설명하고 ESP가 보호하는 주요 범위를 기술하시오.","a":"전송 모드는 원래 IP 헤더를 유지하며 주로 상위 계층 페이로드를 보호한다. 터널 모드는 원본 IP 패킷을 내부에 넣고 새 외부 IP 헤더를 붙인다. ESP 암호화는 전송 모드의 상위 페이로드, 터널 모드에서는 내부 원본 IP 패킷을 보호하며 새 외부 IP 헤더는 암호화하지 않는다.","e":"ESP 트레일러와 인증 태그 등의 구체적인 범위는 구성·알고리즘에 따라 확인한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["ipsec"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g735","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"무선 LAN","q":"WEP, WPA, WPA2, WPA3에서 대표적인 암호화·인증 방식의 차이를 설명하고 WEP가 안전하지 않은 이유를 쓰시오.","a":"WEP: RC4 및 짧은 IV 등 설계상 취약. WPA: TKIP/RC4 중심. WPA2: AES-CCMP 중심. WPA3-Personal: SAE 사용.","e":"제품의 모드와 규격에 따른 차이가 있으므로 단순 암기할 때 세대별 대표 기술로 구분한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g736","bank":"general","type":"서술형","area":"02 네트워크 보안","topic":"DNS 보안","q":"DNS Cache Poisoning 공격 원리와 DNSSEC가 제공하는 보안 성질 및 한계를 설명하시오.","a":"DNS Cache Poisoning은 DNS 응답을 속여 캐시에 잘못된 주소를 넣는다. DNSSEC는 DNS 레코드의 출처 인증과 무결성을 제공하지만 DNS 질의·응답 내용을 암호화하는 기술은 아니다.","e":"DNSSEC는 인증/무결성, DoT/DoH는 전송 구간 암호화와 관련된다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["arp-dns"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g737","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"이메일 보안","q":"SPF, DKIM, DMARC 각각의 검증 대상과 상호보완 관계를 설명하시오.","a":"SPF는 발송 서버 IP의 허용 여부, DKIM은 전자서명 검증, DMARC는 SPF/DKIM의 도메인 정렬과 실패 시 정책/보고 기능을 제공한다.","e":"보이는 From 주소와의 도메인 정렬 여부가 DMARC에서 중요하다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g738","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"웹 서버 보안","q":"웹서버 설정에 Options Indexes FollowSymLinks가 있고 외부에 공개된 디렉터리에는 index 파일이 없다. 예상 위험 2가지와 대응책을 쓰시오.","a":"위험: 디렉터리 목록 노출 및 부적절한 심볼릭 링크를 통한 파일 노출 가능성. 대응: -Indexes 적용, FollowSymLinks 제한 및 파일·디렉터리 권한 점검.","e":"웹 서버의 Directory 설정 적용 범위와 상위 설정을 함께 확인해야 한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g739","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"SQL Injection과 XSS의 공격 대상 및 근본 대응책을 비교하시오.","a":"SQL Injection은 DB 질의 구문을 변조하므로 바인딩 파라미터와 최소권한이 핵심. XSS는 브라우저에서 스크립트를 실행시키므로 출력 문맥별 인코딩과 안전한 HTML 처리 등이 핵심이다.","e":"입력 검증은 보조 통제이며 각 취약점에 대응하는 기본 방어를 우선한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["sql-injection"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g740","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"XXE 공격이 발생하는 조건과 서버에서 이를 방지하는 XML 파서 설정 원칙을 서술하시오.","a":"외부 엔티티를 해석하는 XML 파서가 악의적 DTD/엔티티를 처리해 파일 읽기·SSRF 등을 일으킬 수 있다. 불필요한 DTD·외부 엔티티 해석을 비활성화하고 안전한 파서를 사용한다.","e":"SQL 인젝션 방어인 파라미터 바인딩과 XXE 파서 방어는 서로 다른 문제다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["ssrf-xxe"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g741","bank":"general","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"SSRF 공격의 원리, 대표 피해, 예방·완화 방법을 각각 설명하시오.","a":"서버가 공격자 제공 URL로 요청하면서 내부망·메타데이터 엔드포인트 등에 접근하게 하는 공격이다. 허용 목록, URL 정규화·재검증, DNS 및 리다이렉션 통제, 네트워크 출구 접근 제한이 중요하다.","e":"URL 문자열의 contains()만으로 허용 도메인을 판별하면 우회될 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["ssrf-xxe"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g742","bank":"general","type":"서술형","area":"04 정보보호일반","topic":"정보보호 일반","q":"대칭키 암호, 공개키 암호, 해시함수의 목적과 키 사용 여부를 비교하시오.","a":"대칭키 암호는 같은 비밀키로 암·복호화해 기밀성 제공. 공개키 암호는 공개키/개인키 쌍 사용. 해시함수는 일반적으로 키 없이 입력을 고정 길이 결과로 변환해 무결성 검증 등에 활용한다.","e":"HMAC은 일반 해시와 달리 비밀키를 사용하는 메시지 인증 코드다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g743","bank":"general","type":"서술형","area":"04 정보보호일반","topic":"키 분배","q":"Diffie-Hellman 키 교환의 장점과 단점을 쓰고 중간자 공격 방지 방법을 설명하시오.","a":"상대방과 공유 비밀을 직접 전송하지 않고 수립할 수 있다. 그러나 기본 DH 자체에는 상대방 인증이 없어 중간자 공격에 취약하며 전자서명·인증서·인증된 프로토콜로 보완한다.","e":"비밀 값 공유와 상대 신원 인증은 별개이다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g744","bank":"general","type":"서술형","area":"04 정보보호일반","topic":"접근통제","q":"임의적 접근통제(DAC), 강제적 접근통제(MAC), 역할 기반 접근통제(RBAC)의 권한 결정 기준을 비교하시오.","a":"DAC는 소유자 중심 권한 부여, MAC은 등급·보안 레이블과 중앙 정책, RBAC는 직무·역할에 따른 권한 부여이다.","e":"주체·객체의 관계를 어떤 기준으로 결정하는지 표현해야 한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g745","bank":"general","type":"서술형","area":"04 정보보호일반","topic":"암호화","q":"ECB, CBC, CTR 운용 모드를 동일 평문 패턴 노출 여부, IV/nonce 사용, 병렬 처리 특성 중심으로 비교하시오.","a":"ECB는 같은 평문 블록이 같은 암호문으로 반복될 수 있어 패턴 노출. CBC는 IV와 이전 블록을 연계하며 암호화 병렬화가 어렵다. CTR은 nonce/counter에 기반해 키스트림을 생성하므로 병렬화 가능하고 nonce 재사용을 피해야 한다.","e":"ECB는 일반적인 데이터 암호화에 권장되지 않는다. 구현과 설정에서 IV/nonce 정책이 중요하다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g746","bank":"general","type":"서술형","area":"04 정보보호일반","topic":"전자서명","q":"전자서명에서 송신자와 수신자가 개인키와 공개키를 어떻게 활용하는지 쓰고 제공되는 보안 성질 세 가지를 제시하시오.","a":"송신자는 자신의 개인키로 서명하고 수신자는 대응 공개키로 검증한다. 송신자 인증, 무결성, 부인방지에 활용된다.","e":"서명은 암호문 기밀성을 제공하는 공개키 암호화와 구분한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g747","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"위험 수용, 위험 감소, 위험 전가, 위험 회피 전략을 각각 한 문장으로 설명하고 예시를 쓰시오.","a":"수용: 잔여 위험을 인정. 감소: 패치·방화벽 등 통제 적용. 전가: 보험·계약 등 비용/책임 분담. 회피: 위험 활동 중단.","e":"위험 전가는 위험 자체가 완전히 사라짐을 뜻하지 않는다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g748","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"정량적 위험분석과 정성적 위험분석의 방법과 장단점을 비교하시오.","a":"정량적은 금액·확률로 위험을 평가하므로 비용편익 비교에 유용하지만 자료 확보가 어렵다. 정성적은 전문가 판단·등급으로 평가하여 빠르지만 주관성 문제가 있다.","e":"ALE 계산과 델파이·기준선법을 사례로 연결할 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g749","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"ISMS-P","q":"ISMS와 ISMS-P의 범위를 비교하고 관리체계 운영에서 위험평가의 역할을 서술하시오.","a":"ISMS는 정보보호 관리체계의 운영·보호대책을 평가한다. ISMS-P는 이에 개인정보 처리단계별 요구사항을 추가한다. 위험평가로 보호할 자산, 위협·취약점을 분석해 보호대책 우선순위를 선정한다.","e":"실기에서는 “인증제도 목적-적용 범위-운영 절차”를 연결해 서술한다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g750","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"업무연속성","q":"BCP와 DRP의 목적을 구분하고 RTO와 RPO를 각각 설명하시오.","a":"BCP는 핵심 업무 지속·복구를 위한 포괄적 계획, DRP는 IT 서비스/시스템 복구 계획이다. RTO는 허용 가능한 복구 소요시간, RPO는 허용 가능한 데이터 손실 시점 범위다.","e":"백업만으로 업무연속성이 달성되지는 않으며 복구 목표와 정기 훈련이 필요하다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["risk-bcp"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g751","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"개인정보 보호","q":"개인정보 접속기록 관리에서 기록해야 할 요소와 이상 징후를 점검할 때 확인할 항목을 제시하시오.","a":"식별자, 접속일시, 접속지 정보, 처리한 정보주체 정보, 수행 업무 등을 기록한다. 대량 다운로드, 비정상 시간대 접근, 권한 없는 조회 등을 확인하고 사유 검증·후속조치를 수행한다.","e":"최신 안전성 확보조치 기준에서 보관·점검 체계를 확인해야 한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["privacy"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g752","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"개인정보 보호","q":"가명정보와 익명정보의 차이를 설명하고 가명정보 활용 시 지켜야 할 주요 안전조치를 쓰시오.","a":"가명정보는 추가 정보를 사용하면 재식별 가능성이 있는 개인정보로 법령상 허용 목적에 따라 처리할 수 있다. 익명정보는 합리적으로 고려할 때 더 이상 특정 개인을 알아볼 수 없는 정보다. 가명정보는 추가정보 분리 보관, 재식별 금지, 접근권한 관리 등의 조치가 필요하다.","e":"통계작성·과학적 연구·공익적 기록보존 등 법률상 근거를 구분해 기술한다.","source":null,"corrected":false,"legal":false,"supplement":true,"lessonIds":["privacy"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"g753","bank":"general","type":"서술형","area":"05 정보보호관리 및 법률","topic":"침해사고 대응","q":"침해사고 발생 시 준비-탐지/분석-봉쇄-제거-복구-사후 분석 단계의 활동을 각각 서술하시오.","a":"준비: 절차·도구·연락망 마련. 탐지/분석: 로그·징후 분석. 봉쇄: 확산 차단. 제거: 악성요소 제거·취약점 조치. 복구: 정상 서비스 확인. 사후 분석: 원인·교훈·재발방지 개선.","e":"증거 수집·보존은 각 단계와 연계되며 봉쇄 전에 무작정 전원을 끄면 휘발성 증거가 소실될 수 있다.","source":null,"corrected":false,"legal":false,"supplement":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c1","bank":"core","type":"서술형","area":"01 시스템 보안","topic":"전체 개요","q":"개인정보처리시스템에서 인터넷망 접속을 제한하는 보안 목적을 설명하고 적용 대상을 판단할 때 확인할 요소를 쓰시오.","a":"개인정보 유출을 방지하기 위해 고위험 취급업무의 인터넷 접근을 제한한다. 처리 정보 규모, 취급자의 업무·권한, 현행 안전성 확보조치 기준과 적용 예외를 확인한다.","e":"원노트의 구체적인 수치만 단독으로 암기하지 않고 최신 고시의 적용 요건과 예외를 검토해야 한다.","source":1,"flags":"붉은색","focus":["인터넷 차단"],"stars":2,"memory":"개인정보 유출을 방지하기 위해 고위험 취급업무의 인터넷 접근을 제한한다. 처리 정보 규모, 취급자의 업무·권한, 현행 안전성 확보조치 기준과 적용 예외를 확인한다.","pitfall":"","corrected":true,"legal":true,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c2","bank":"core","type":"작업형","area":"01 시스템 보안","topic":"프로세스","q":"실행 파일을 삭제한 뒤에도 실행 중인 리눅스 PID가 5900이다. (1) /proc의 성격, (2) 실행 파일 연결 경로, (3) 파일 확보 명령을 작성하시오.","a":"(1) /proc는 커널·프로세스 정보를 보여 주는 가상 파일 시스템, (2) /proc/5900/exe, (3) cp /proc/5900/exe /tmp/recovered-exe","e":"리눅스가 프로그램 복사본을 /proc에 저장하여 실행하는 것은 아니다. 실행 중인 파일에 연결된 /proc/PID/exe를 이용해 복구할 수 있는 사례가 있다.","source":6,"flags":"굵게+밑줄","focus":["proc 디렉터리"],"stars":3,"memory":"실행 중 삭제된 파일 → /proc/PID/exe","pitfall":"/proc는 가상 파일시스템이지 실행 파일 복사본 저장소가 아님","corrected":true,"legal":false,"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c3","bank":"core","type":"작업형","area":"01 시스템 보안","topic":"리눅스 명령어","q":"Linux에서 현재 셸의 명령어 실행 이력을 조회하는 명령과 Windows CMD의 현재 세션 명령 이력을 조회하는 명령을 각각 쓰시오.","a":"history / doskey /history","e":"history는 현재 셸의 기록을 조회한다. Windows CMD에서는 doskey /history를 사용할 수 있다.","source":17,"flags":"굵게+밑줄","focus":["history"],"stars":3,"memory":"Linux: history / CMD: doskey /history","pitfall":"명령 이력은 삭제·변조 가능하므로 단독 증거로 단정하지 않음","corrected":false,"legal":false,"sourceNote":"history : (포렌식) 로그인 후 사용한 명령어 목록. (win : doskey /history )","sourceTopic":"리눅스 명령어","lessonIds":["linux-logs"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c4","bank":"core","type":"서술형","area":"01 시스템 보안","topic":"리눅스 패스워드","q":"패스워드를 해시함수로 저장하는 이유와 솔트(salt)를 추가하는 보안 목적을 설명하시오.","a":"해시함수는 원문을 복원하기 어렵게 변환한다. salt는 동일한 비밀번호라도 저장 해시값이 달라지게 하여 사전 계산·레인보우 테이블 공격의 효율을 낮춘다.","e":"비밀번호 저장에는 일반 해시 단독보다 Argon2, scrypt, bcrypt, PBKDF2 등 전용 비밀번호 해시 기법을 권장한다.","source":33,"flags":"굵게+밑줄","focus":["해시함수"],"stars":3,"memory":"비밀번호 = 느린 전용 해시 + 고유 salt","pitfall":"일반 SHA-256만 단독 적용하는 방식보다 Argon2id·scrypt·bcrypt 등을 고려","corrected":true,"legal":false,"sourceNote":"해시함수 : 입력값을 고정 길이의 해시값으로 변환하는 단방향 함수(패스워드 암호화에 활용). 동일한 해시값으로 원래 값 예측가능한 점을 임의의 난수(salt값)으로 보완(레인보우 테이블 공격 방어) . <예> $6( SHA-512 알고리즘) $efaFe(salt)$ fsaejl…sdofj(해시로계산된암호) → $1 : MD5, $5 : SHA256, $6 : SHA512","sourceTopic":"리눅스 패스워드","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c5","bank":"core","type":"작업형","area":"01 시스템 보안","topic":"리눅스 권한","q":"리눅스에서 일반 파일 생성 권한을 644, 디렉터리 생성 권한을 755로 만들기 위한 umask 값을 쓰고 원리를 설명하시오.","a":"umask 022","e":"일반 파일은 통상 666, 디렉터리는 777에서 시작하여 umask의 설정 비트를 제거한다. 엄밀히는 비트 단위 AND NOT 연산이다.","source":38,"flags":"굵게+밑줄","focus":["umask"],"stars":3,"memory":"파일 666, 디렉터리 777 → umask 022 → 644, 755","pitfall":"8진수 단순 뺄셈이 아니라 비트 마스크로 권한 제거","corrected":false,"legal":false,"sourceNote":"umask : 기본 권한에서 제거할 권한을 지정하는 값. 0022 . 파일(644)은 666에서 디렉터리(755, 디렉터리 이동을 위해 x필요 )은 777에서 umask 값 뺌.","sourceTopic":"리눅스 권한","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c6","bank":"core","type":"작업형","area":"01 시스템 보안","topic":"리눅스 권한","q":"Linux에서 /var 아래의 이름이 *.log인 일반 파일을 검색하는 find 명령을 작성하시오.","a":"find /var -type f -name \"*.log\"","e":"-type f는 일반 파일, -name은 파일명 패턴 조건이다.","source":43,"flags":"굵게+밑줄","focus":["find 옵션"],"stars":3,"memory":"find /var -type f -name \"*.log\"","pitfall":"-name 패턴은 셸에서 먼저 펼쳐지지 않도록 따옴표 사용","corrected":false,"legal":false,"sourceNote":"특수권한 파일 검색 : find / -perm 6000 (setuid, setgid 모두 있는 것만 있는 것 찾아라. 정확히 일치 ), find / -perm - 4000(setuid도 있는 것 찾아라. 포함조건 . 즉 6000, 4000, 7000 등의 권한 모두 찾음)\n\ncf. find 옵션 : -name(이름), -mtime(수정시간), -perm(권한)\n\nfind / -name a.txt -print","sourceTopic":"리눅스 권한","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c7","bank":"core","type":"작업형","area":"01 시스템 보안","topic":"리눅스 읽기 전용 파일 설정","q":"Linux에서 important.txt 파일에 immutable 속성을 부여하고 해제하는 명령을 각각 쓰시오.","a":"chattr +i important.txt / chattr -i important.txt","e":"+i가 설정되면 일반적인 삭제·변경이 제한된다. lsattr로 속성 상태를 확인할 수 있다.","source":66,"flags":"굵게+밑줄","focus":["chattr"],"stars":3,"memory":"chattr +i 설정 / chattr -i 해제","pitfall":"chattr는 chmod와 역할이 다름","corrected":false,"legal":false,"sourceNote":"chattr : 특수 속성 파일 설정(+i)/해제(-i). root만 실행 가능. 함부로 지울 수 없다.(백도어 못지우게 하려고 이런 설정 활용) <예> chattr +i test","sourceTopic":"리눅스 읽기 전용 파일 설정","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c8","bank":"core","type":"단답형","area":"01 시스템 보안","topic":"리눅스 방화벽","q":"Linux에서 Netfilter를 기반으로 패킷 허용·차단 정책을 적용하는 보안 기능은?","a":"리눅스 방화벽","e":"iptables, nftables 등으로 커널 패킷 필터 규칙을 관리한다.","source":67,"flags":"붉은색·굵게+밑줄","focus":["리눅스 방화벽"],"stars":2,"memory":"리눅스 방화벽","pitfall":"","corrected":false,"legal":false,"sourceNote":"netfilter : 리눅스 커널에서 방화벽 역할하는 프로그램\n\niptables : netfilter 이용. 데비안에서 방화벽 정책 수립. 필터링","sourceTopic":"리눅스 방화벽"},{"id":"c9","bank":"core","type":"서술형","area":"01 시스템 보안","topic":"NTFS 파일 시스템의 특징","q":"Windows의 EFS와 BitLocker가 암호화하는 대상을 각각 구분하고 BitLocker의 특징을 서술하시오.","a":"EFS는 NTFS 파일·디렉터리 단위, BitLocker는 드라이브·볼륨 단위 암호화 기능이다. BitLocker는 TPM과 연계하여 보호 키를 관리할 수 있다.","e":"TPM 사용은 필수 구성으로 단정할 수 없으며, 복구 키 관리도 중요하다.","source":90,"flags":"굵게+밑줄","focus":["BitLocker"],"stars":2,"memory":"EFS = 파일, BitLocker = 볼륨","pitfall":"BitLocker의 TPM 사용은 선택적 구성 가능","corrected":false,"legal":false,"sourceNote":"EFS : Encrypting File System. 대칭키 기법으로 파일 데이터 암호화 . → NTFS가 아닌 다른 볼륨으로 복사하면 암호과가 풀림. 암호화 키를 OS 보관 cf. BitLocker 암호화 키를 TPM (Trusted Platform Module)이라는 하드웨어에 복사. 볼륨 전체 암호화","sourceTopic":"NTFS 파일 시스템의 특징","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c10","bank":"core","type":"단답형","area":"01 시스템 보안","topic":"NTFS 파일 시스템의 특징","q":"Internet Explorer 10/11 등의 웹 방문기록·쿠키·캐시 정보가 저장되었던 Windows 웹캐시 ESE 데이터베이스 파일명은?","a":"WebCacheV01.dat","e":"원노트의 WebCache24.dat 표기는 바로잡았다. 대표 경로: %LOCALAPPDATA%\\Microsoft\\Windows\\WebCache\\WebCacheV01.dat. 브라우저와 Windows 버전에 따라 다르다.","source":92,"flags":"굵게+밑줄","focus":["WebCache24.dat"],"stars":2,"memory":"WebCacheV01.dat","pitfall":"","corrected":true,"legal":false,"sourceNote":"MTF (Master File Table) 파일시스템 메타정보 (생성날짜, 만든이, 속성, 크기 등) 가짐. Encase 라는 포렌식 도구로 파일 변경(메타 정보의 생성시간 확인) 여부 확인 가능. → cf. WebCache24.dat (웹 브라우저 다운로드 시간 기록)와 비교하여 다운로드 파일인지 여부 검증","sourceTopic":"NTFS 파일 시스템의 특징"},{"id":"c11","bank":"core","type":"작업형","area":"01 시스템 보안","topic":"윈도우 도구, 명령어","q":"Windows에서 a.txt를 읽기 전용 파일로 지정하고 다시 해제하는 attrib 명령을 각각 작성하시오.","a":"attrib +r a.txt / attrib -r a.txt","e":"attrib는 파일의 읽기 전용(R), 숨김(H), 시스템(S) 등 속성을 조회·변경한다.","source":102,"flags":"굵게+밑줄","focus":["attrib"],"stars":2,"memory":"attrib +r a.txt / attrib -r a.txt","pitfall":"","corrected":false,"legal":false,"sourceNote":"attrib 명령 : 파일 속성 확인/변경 가능. <변경 예> attrib +r a.txt (읽기 전용 속성 설정) → +S -S 옵션으로 시스템 속성으로 설정/해제 할 수 있다. (A 보관(Archive, 단순 저장된 파일) 속성, H 숨김 속성, R 읽기전용 속성, S 시스템 속성) cf. 리눅스의 lsattr , chattr 유사(+i 읽기전용) → 악성코드도 함부로 삭제 못하도록 시스템 속성을 설정하는 경우 많다.","sourceTopic":"윈도우 도구, 명령어","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c12","bank":"core","type":"단답형","area":"01 시스템 보안","topic":"시작 프로그램 관련 레지스트리 키","q":"정상 프로그램을 실행하는 것처럼 위장하면서 추가 악성코드를 시스템에 내려놓거나 설치하는 악성코드 유형은?","a":"Dropper(드로퍼)","e":"드로퍼는 악성 실행 파일을 시스템에 배치·설치하는 역할을 수행하며, 다른 악성코드를 추가로 다운로드하는 다운로더와 구분할 수 있다.","source":112,"flags":"굵게+밑줄","focus":["Dropper"],"stars":1,"memory":"Dropper(드로퍼)","pitfall":"","corrected":false,"legal":false,"sourceNote":"cf. RunMRU : 최근 실행한 명령어 정보 가짐\n\ncf. Dropper : 피해자가 인식하지 못하는 순간에 설치하는 악성코드. 악성코드를 실행하고 Drop 하는 프로그램( Dropper ) 을 찾기 위해 프로세스 모니터(Process Tree) 프로그램 사용.(Boot Enable 기능으로 부팅 과정에서 drop 된 프로그램 확인 가능)","sourceTopic":"시작 프로그램 관련 레지스트리 키"},{"id":"c13","bank":"core","type":"단답형","area":"01 시스템 보안","topic":"윈도우 공격","q":"문서·콘텐츠의 활성 요소를 제거하고 안전한 형태로 재구성하여 악성 매크로 등의 위험을 줄이는 보안 기술은?","a":"CDR(Content Disarm and Reconstruction)","e":"CDR은 파일을 분석하여 잠재적으로 위험한 구성 요소를 제거한 뒤 재조립하는 방식이다.","source":123,"flags":"붉은색","focus":["CDR"],"stars":2,"memory":"CDR(Content Disarm and Reconstruction)","pitfall":"","corrected":false,"legal":false,"sourceNote":"매크로 바이러스 : Word, Excel 등 응용 프로그램의 매크로 기능을 악용하여 실행·전파. OS 무관하게 App에서 동작하는 바이러스 → 보안 솔루션 : CDR (재조립 통해 유해한 콘텐츠를 무해하게 만듦. 즉, 매크로 제거)","sourceTopic":"윈도우 공격"},{"id":"c14","bank":"core","type":"서술형","area":"01 시스템 보안","topic":"기타 보안","q":"DDE(Dynamic Data Exchange)의 역할과 악성 문서 공격에서 악용될 수 있는 이유를 쓰시오.","a":"DDE는 Windows 응용 프로그램 사이의 데이터 교환 메커니즘이다. 문서 내 자동 처리 기능이 악용될 경우 원치 않는 명령 실행을 유도할 수 있다.","e":"문서의 외부 연결·자동 업데이트 사용을 제한하고 출처 불명 문서를 열지 않도록 관리한다.","source":126,"flags":"굵게+밑줄","focus":["DDE"],"stars":1,"memory":"DDE는 Windows 응용 프로그램 사이의 데이터 교환 메커니즘이다. 문서 내 자동 처리 기능이 악용될 경우 원치 않는 명령 실행을 유도할 수 있다.","pitfall":"","corrected":false,"legal":false,"sourceNote":"DDE 취약점 : DDE(윈도우 프로그램 간에 데이터 전송 프로토콜)를 이용해 문서 열때마다 임의의 악성코드 실행 → 작업관리자 프로세스 보고 유추 가능(<예>ms word가 cmd, calc 사용?). MS 오피스 고급 옵션에 “ 문서를 열 때 자동 연결 업데이트” 비활성화 하면 예방 가능","sourceTopic":"기타 보안","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c15","bank":"core","type":"작업형","area":"01 시스템 보안","topic":"기타 보안","q":"리눅스에서 주소 공간 배치 난수화(ASLR) 설정값을 조회하는 명령과, 전체 난수화를 켜는 설정 명령을 쓰시오.","a":"sysctl kernel.randomize_va_space / sysctl -w kernel.randomize_va_space=2","e":"ASLR은 프로세스 주소 공간의 메모리 배치를 무작위화하여 취약점 악용을 어렵게 한다. NX/DEP와는 다른 보호 기술이다.","source":128,"flags":"굵게+밑줄","focus":["ASLR"],"stars":3,"memory":"ASLR 조회: sysctl kernel.randomize_va_space","pitfall":"전체 난수화: sysctl -w kernel.randomize_va_space=2","corrected":false,"legal":false,"sourceNote":"ASLR (Address Space Layout Randomization, 랜덤스택, 주소공간배치 난수화 ) : 메모리 주소 동적 할당으로 메모리에서의 실행 방지 . <예> sysctl -w kernel. randomize_va_space=2 (스택, 힙 모두 적용) cf. 다른 해결법 : Nx bit (None excute bit, True로 설정하여 스택과 힙의 영역의 실행권한 제거 ), 스택가드 (함수의 진입과 종료 코드 검사), 스택쉴드 (함수의 복귀주소 방어)","sourceTopic":"기타 보안","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c16","bank":"core","type":"서술형","area":"01 시스템 보안","topic":"기타 보안","q":"사이버 킬체인(Cyber Kill Chain)의 7단계를 순서대로 쓰시오.","a":"정찰 → 무기화 → 전달 → 취약점 악용(Exploitation) → 설치 → 명령 및 제어(C2) → 목표 달성(Actions on Objectives)","e":"Lockheed Martin의 고전적인 Cyber Kill Chain 모델의 7단계 순서이다.","source":136,"flags":"붉은색","focus":["사이버 킬체인 단계"],"stars":2,"memory":"정찰 → 무기화 → 전달 → 취약점 악용(Exploitation) → 설치 → 명령 및 제어(C2) → 목표 달성(Actions on Objectives)","pitfall":"","corrected":true,"legal":false,"sourceNote":"사이버 킬체인 단계 : 사이버 공격이 준비되어 침투하고 목적을 달성하기까지의 과정을 단계별로 나눈 공격 분석 모델. 1. 정찰 → 2. 무기화 및 전달 → 3. 익스플로잇 설치 → 4. 명령 및 제어 → 5. 행동 및 탈출","sourceTopic":"기타 보안","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c17","bank":"core","type":"작업형","area":"02 네트워크 보안","topic":"네트워크 활용","q":"Apache 서버 응답 헤더에서 서버 버전·운영체제 등 불필요한 정보를 최소화하기 위한 대표 설정을 쓰시오.","a":"ServerTokens Prod","e":"원노트의 ServerTonkens 표기는 오타이다. ServerTokens Prod는 서버 식별 정보 노출 수준을 제한한다.","source":163,"flags":"굵게+밑줄","focus":["ServerTonkens: prod"],"stars":3,"memory":"Apache 정보노출 축소: ServerTokens Prod","pitfall":"ServerSignature Off는 오류 페이지의 서버 서명 표시 억제","corrected":true,"legal":false,"sourceNote":"Server : Apache (뒤 내용 없도록) → ServerTonkens: prod 로 설정 하면 버전 정보 없어짐 (←보안 취약점 점검)","sourceTopic":"네트워크 활용","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c18","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"클라이언트 측의 정보 유지 방법","q":"브라우저 종료 후에도 지정한 만료일 또는 Max-Age까지 저장되는 쿠키의 명칭은?","a":"영속 쿠키(Persistent Cookie)","e":"세션 쿠키는 일반적으로 브라우저 세션 종료 시 제거되며, 영속 쿠키는 Expires 또는 Max-Age로 지속 시간을 지정한다.","source":165,"flags":"붉은색","focus":["연속적 쿠키(=영속쿠키)"],"stars":2,"memory":"영속 쿠키(Persistent Cookie)","pitfall":"","corrected":false,"legal":false,"sourceNote":"Cookie = 연속적 쿠키(=영속쿠키) : 특정 시간동안 클라이어트에 저장되어 있음(OS에 저장) . 기간 설정 방법 : <예 java> cookie. setMaxAge (60*60*24*365); → 60초,1시간,1일,1년. -1로 설정 시 유효 기간 미사용(보안에 유리)","sourceTopic":"클라이언트 측의 정보 유지 방법"},{"id":"c19","bank":"core","type":"서술형","area":"02 네트워크 보안","topic":"DDos : flood, spoofing, 증폭, 반사","q":"DDoS 증폭 공격(Amplification Attack)의 원리를 설명하고 반사 공격과의 관계를 쓰시오.","a":"작은 요청으로 큰 응답이 발생하는 프로토콜을 악용해 피해자에게 많은 트래픽을 유발한다. 출발지 IP를 피해자로 위조하여 제3자가 응답하도록 유도하는 반사 공격과 결합될 수 있다.","e":"증폭과 반사는 구분되는 특징이며 항상 함께 발생하는 것은 아니다.","source":204,"flags":"붉은색","focus":["증폭공격"],"stars":3,"memory":"반사 = 위조 주소로 응답 유도 / 증폭 = 작은 요청·큰 응답","pitfall":"반사와 증폭은 다른 속성, 결합 가능","corrected":false,"legal":false,"sourceNote":"증폭공격 : 작은 요청으로 상대적으로 큰 응답 트래픽을 발생시키는 공격. 1개 전송 N개 응답 . 반사공격 동반","sourceTopic":"DDos : flood, spoofing, 증폭, 반사","lessonIds":["tcp-ip"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c20","bank":"core","type":"서술형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"DoS와 DDoS를 비교하고 대표적인 DDoS 탐지·대응 방법 두 가지를 쓰시오.","a":"DoS는 서비스 가용성을 저해하는 공격, DDoS는 여러 분산 출발지에서 수행하는 DoS 공격이다. 비정상 트래픽 탐지, 속도 제한, 스크러빙, 상위망 차단 등을 적용한다.","e":"실기에서는 공격 원리와 대응 위치를 함께 설명하는 것이 좋다.","source":207,"flags":"붉은색","focus":["DDos 공격과 대응"],"stars":2,"memory":"DoS는 서비스 가용성을 저해하는 공격, DDoS는 여러 분산 출발지에서 수행하는 DoS 공격이다. 비정상 트래픽 탐지, 속도 제한, 스크러빙, 상위망 차단 등을 적용한다.","pitfall":"","corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c21","bank":"core","type":"서술형","area":"02 네트워크 보안","topic":"DDos 공격과 대응","q":"Slow HTTP Header 공격과 HTTP 응답 분할(HTTP Response Splitting)의 공격 원리를 각각 설명하시오.","a":"Slow HTTP Header: HTTP 요청 헤더를 완성하지 않고 천천히 전송해 연결 자원을 점유한다. HTTP 응답 분할: 응답 헤더에 CRLF 같은 제어문자가 삽입되어 응답 구조를 조작한다.","e":"두 공격은 서로 다르다. 전자는 서비스 거부, 후자는 응답 조작·캐시 오염 등과 연관된다. CRLF는 0D0A이다.","source":225,"flags":"굵게+밑줄","focus":["Header","응답 분할"],"stars":3,"memory":"Slow HTTP = 연결 자원 고갈 / 응답 분할 = CRLF 헤더 조작","pitfall":"CRLF: CR=0D, LF=0A","corrected":true,"legal":false,"sourceNote":"Slow HTTP Read Dos : TCP 수신 윈도우 크기를 감소 시킴 → 처리율 감소시켜 정상 응답 못하도록 함 ⇒ 서버 응답을 천천히 받는 공격 <공격 예> TCP Window size = 0\n\nSlow HTTP Header Dos(=Slowloris) : 헤더 모두 전달 안된 것으로 변조( 개행문자 삭제 )하여 연결 장시간 유지 → 요청 헤더를 완성하지 않는 공격 cf. HTTP 응답 분할 : 공격자가 \\r\\n\\r\\n을 계속 추가 (JS코드로). XSS 공격 에 해당. → 첫번째 메시지는 응답 종료, 두번째 메시지는 XSS 공격 등을 실행 → 방어 : 개행문자 제거","sourceTopic":"DDos 공격과 대응","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c22","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"스니핑 : 수동적(passive) 공격. 패킷 훔쳐보는 도구","q":"네트워크 인터페이스가 자신에게 지정되지 않은 목적지 MAC 주소의 프레임도 수신하도록 하는 모드의 명칭은?","a":"Promiscuous Mode(무차별 모드)","e":"물리적으로 수신 가능한 프레임의 필터링을 완화하는 모드이다. 스위치 환경에서 모든 트래픽을 자동으로 볼 수 있는 것은 아니다.","source":235,"flags":"붉은색","focus":["Promiscuous(무차별) 모드"],"stars":2,"memory":"Promiscuous Mode(무차별 모드)","pitfall":"","corrected":false,"legal":false,"sourceNote":"Promiscuous(무차별) 모드 : 목적지 MAC주소와 관계없이 모든 패킷 수신. <설정 예> ifconfig eth0 promisc <해제 예> ifconfig eth0 -promisc","sourceTopic":"스니핑 : 수동적(passive) 공격. 패킷 훔쳐보는 도구"},{"id":"c23","bank":"core","type":"작업형","area":"02 네트워크 보안","topic":"스니핑 : 수동적(passive) 공격. 패킷 훔쳐보는 도구","q":"Linux에서 eth0 인터페이스의 패킷 5개를 캡처하는 tcpdump 명령을 작성하시오.","a":"tcpdump -i eth0 -c 5","e":"-i는 인터페이스, -c는 캡처할 패킷 개수이다.","source":236,"flags":"붉은색","focus":["스니핑 명령"],"stars":3,"memory":"tcpdump -i eth0 -c 5","pitfall":"-i 인터페이스, -c 개수","corrected":false,"legal":false,"sourceNote":"스니핑 명령 <예> tcpdump -c 5(5개 패킷 스니핑), tcpdump -i eth0(특정 인터페이스 스니핑), tcpdump -i eth0 -v host naver.com -w limbest.cap(특정 host 전송 데이터 스니핑 후 파일 저장, -v 뒤에 host, net, ip 등 사용 가능) → -v net 10.10.10.0, -v ip src 10.10.10.1 or dst 10.10.10.2","sourceTopic":"스니핑 : 수동적(passive) 공격. 패킷 훔쳐보는 도구","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c24","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"스위치 공격 및 스니핑 방법","q":"스위치의 MAC 주소 학습 테이블을 가득 채워 정상적인 스위칭 동작을 방해하고 스니핑에 활용할 수 있는 공격은?","a":"MAC Flooding","e":"MAC 테이블 오버플로를 유도해 일부 환경에서 알 수 없는 유니캐스트 프레임 플러딩을 발생시킬 수 있다.","source":246,"flags":"붉은색","focus":["스위치 공격 및 스니핑 방법"],"stars":3,"memory":"MAC flooding → 스위치 MAC 학습 테이블 오버플로","pitfall":"스위치 종류·설정에 따라 파급 효과가 다름","corrected":false,"legal":false},{"id":"c25","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"방화벽","q":"접근통제 정책에 따라 네트워크 패킷의 허용·거부를 결정하는 보안 장비 또는 기술은?","a":"방화벽(Firewall)","e":"접근통제 규칙, 상태 추적, 로깅 등을 제공한다.","source":252,"flags":"붉은색","focus":["방화벽"],"stars":2,"memory":"방화벽(Firewall)","pitfall":"","corrected":false,"legal":false},{"id":"c26","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"방화벽","q":"다음 설명에서 빈칸에 들어갈 핵심 용어를 쓰시오.\n상태기반 패킷검사(Stateful Packet Inspection, (가)) : 패킷 필터링 방식에 비해 세션 추적 기능 추가","a":"(가) SPI","e":"상태기반 패킷검사(Stateful Packet Inspection, SPI) : 패킷 필터링 방식에 비해 세션 추적 기능 추가","source":253,"flags":"굵게+밑줄","focus":["SPI"],"stars":3,"memory":"SPI = Stateful Packet Inspection","pitfall":"상태 추적을 통해 연결 상태에 따른 허용·차단","corrected":false,"legal":false,"sourceNote":"상태기반 패킷검사(Stateful Packet Inspection, SPI ) : 패킷 필터링 방식에 비해 세션 추적 기능 추가\n\n심층패킷분석(Deep Packet Inspection, DPI ) : 패킷이 가지고 있는 컨텐츠까지 모두 검사(payload, 빅데이터) . SPI에서 발전된 형태. 프라이버시 침해 문제 발생 가능","sourceTopic":"방화벽"},{"id":"c27","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"침입탐지시스템(IDS)","q":"네트워크·시스템 활동을 분석하여 침입 징후를 탐지하고 경보를 생성하는 보안 시스템의 약어는?","a":"IDS(Intrusion Detection System)","e":"IPS는 차단 기능을 수행할 수 있다는 점에서 IDS와 구분된다.","source":258,"flags":"붉은색","focus":["침입탐지시스템(IDS)"],"stars":2,"memory":"IDS(Intrusion Detection System)","pitfall":"","corrected":false,"legal":false},{"id":"c28","bank":"core","type":"작업형","area":"02 네트워크 보안","topic":"침입탐지시스템(IDS)","q":"다음 명령·설정 예에서 빈칸에 들어갈 핵심 용어·옵션을 쓰시오.\n(가): 네트워크 패킷을 분석하고 미리 정의된 Rule과 비교하여 침입을 탐지하는 오픈소스 IDS/IPS","a":"(가) Snort","e":"Snort : 네트워크 패킷을 분석하고 미리 정의된 Rule과 비교하여 침입을 탐지하는 오픈소스 IDS/IPS","source":263,"flags":"붉은색","focus":["Snort"],"stars":2,"memory":"(가) Snort","pitfall":"","corrected":false,"legal":false,"sourceNote":"Snort : 네트워크 패킷을 분석하고 미리 정의된 Rule과 비교하여 침입을 탐지하는 오픈소스 IDS/IPS\n\n스니핑 패킷(WinCap으로 진행)과 지정한 rule 비교하여 탐지하는 도구. Sourcefire 사에서 개발","sourceTopic":"침입탐지시스템(IDS)","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c29","bank":"core","type":"작업형","area":"02 네트워크 보안","topic":"침입탐지시스템(IDS)","q":"Snort 규칙에서 (1) 문자열이 페이로드에 포함되는지 검사하는 옵션과 (2) 탐지 발생량을 시간·횟수에 따라 제어하는 옵션의 이름을 각각 쓰시오.","a":"(1) content  (2) threshold","e":"content는 페이로드 패턴 검사, threshold는 이벤트 발생 빈도에 따른 기록/탐지 제어에 사용한다. Snort 버전별 지원 구문을 확인해야 한다.","source":269,"flags":"굵게+밑줄","focus":["content","threshold"],"stars":3,"memory":"Snort content = 문자열 패턴 / threshold = 경고 빈도 제어","pitfall":"Snort 2/3에서 세부 구문 차이 주의","corrected":false,"legal":false,"sourceNote":"룰 옵션 : msg(설정된 문장 로그에 기록), sid(1,000,000이상 값 사용자 임의 지정), dsize (패킷 페이로드 사이즈 지정. dsize:100<>500 → 100에서 500바이트 패킷), nocase(대소문자 구분x), content (특정 문자열 탐지. !(not), |(hex), \\(특수기호) <예> content:!”aa”; content:|1a|; content:”aa\\#”), flags(지정한 TCP Flag), flow (to_server, established 등), itype(ICMP 타임 번호. 0 reply 8 request 등), sameip (송수신 IP 동일 탐지. land attack ), session(세션정보), threshold (경고 발생 빈도 제어, 무작위 공격 탐지), depth (content 옵션이 검사할 바이트수), offset(문자열 검색 시작 위치) threshold 옵션 : limit(임계시간 기준, N회), threshold (패킷발생량, 횟수마다 계속 탐지), both(IP 주소 로그 발생 기준, 1회) <예> threshold:type threshold , track by_dst, count 100, seconds 10; ( 목적지 IP 주소별로 10초 동안 규칙에 일치하는 패킷이 100회 탐지될 때마다 경고를 발생)","sourceTopic":"침입탐지시스템(IDS)","lessonIds":["detection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c30","bank":"core","type":"서술형","area":"02 네트워크 보안","topic":"침입탐지시스템(IDS)","q":"Snort의 threshold 기능을 이용하는 목적을 설명하고 limit, threshold, both 유형의 역할을 비교하시오.","a":"동일한 규칙의 반복 탐지 이벤트를 시간·횟수 기준으로 조절하여 경고 폭주를 줄인다. limit는 일정 시간 내 이벤트 수를 제한하고, threshold는 설정 횟수마다 이벤트를 발생시키며, both는 조건 충족 후 정해진 횟수 내 기록을 제한하는 방식이다.","e":"정확한 세부 구문은 Snort 버전에 따라 달라질 수 있다.","source":270,"flags":"붉은색","focus":["threshold 옵션"],"stars":3,"memory":"limit: 제한 / threshold: 주기적 발생 / both: 조건 충족 후 제한","pitfall":"Snort 버전에 따른 옵션 형식 차이 확인","corrected":false,"legal":false,"sourceNote":"threshold 옵션 : limit(임계시간 기준, N회), threshold (패킷발생량, 횟수마다 계속 탐지), both(IP 주소 로그 발생 기준, 1회) <예> threshold:type threshold , track by_dst, count 100, seconds 10; ( 목적지 IP 주소별로 10초 동안 규칙에 일치하는 패킷이 100회 탐지될 때마다 경고를 발생)","sourceTopic":"침입탐지시스템(IDS)","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c31","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"인터넷 같은 공용망에서 인증·암호화된 논리적 연결을 만들어 사설망처럼 사용하는 기술은?","a":"VPN(가상사설망)","e":"터널링과 암호화, 인증을 조합해 통신 구간의 보안을 제공한다.","source":276,"flags":"붉은색","focus":["가상사설망(VPN"],"stars":2,"memory":"VPN(가상사설망)","pitfall":"","corrected":false,"legal":false},{"id":"c32","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"IPsec에서 기존 IP 패킷 전체를 새로운 외부 IP 헤더로 감싸는 동작 모드는?","a":"터널 모드(Tunnel Mode)","e":"원본 IP 헤더를 포함한 원본 패킷이 내부에 실려 전달된다.","source":279,"flags":"굵게+밑줄","focus":["터널모드"],"stars":3,"memory":"IPsec 터널 = 새 IP 헤더 + 원본 IP 패킷","pitfall":"전송모드는 주로 원본 IP 헤더를 유지","corrected":false,"legal":false,"sourceNote":"터널모드 : IP SEC 헤더를 추가하고 IP 헤더와 데이터(인증 정보 포함)를 암호화\n\n전송모드 : 기존 IP 헤서 사용, 데이터만 암호화","sourceTopic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","lessonIds":["ipsec"]},{"id":"c33","bank":"core","type":"서술형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"IPsec ESP 터널 모드에서 새 외부 IP 헤더, ESP 헤더, 원본 IP 패킷의 보호 범위를 설명하시오.","a":"새 외부 IP 헤더는 암호화 대상이 아니다. ESP는 원본 IP 패킷을 페이로드로 감싸며, 암호화 적용 시 원본 IP 패킷과 ESP 트레일러를 암호화한다. 무결성 보호 범위는 ESP 헤더와 암호문 및 트레일러 등에 적용되며 인증 태그 자체는 제외된다.","e":"암호화와 무결성 보호 범위를 구분한다. 인증 태그의 구체적인 적용은 선택한 알고리즘·구성에 따른다.","source":282,"flags":"붉은색","focus":["IPSEC VPN 헤더"],"stars":3,"memory":"ESP 터널: 외부 IP 헤더는 암호화하지 않음","pitfall":"ESP 보호 범위와 IPsec AH 보호 범위를 혼동하지 않기","corrected":true,"legal":false,"lessonIds":["ipsec"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c34","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"OSI 2계층 기반 터널링 VPN의 대표적인 프로토콜 두 가지를 쓰시오.","a":"PPTP, L2TP","e":"PPTP는 안전하지 않은 구형 방식이므로 새로운 구축에 권장되지 않는다. L2TP는 보통 IPsec과 결합한다.","source":284,"flags":"붉은색","focus":["데이터 링크(2계층) VPN 종류"],"stars":2,"memory":"PPTP, L2TP","pitfall":"","corrected":false,"legal":false,"sourceNote":"cf. 데이터 링크(2계층) VPN 종류 : PPTP VPN(ms 개발), L2TP VPN(cisco 제안), MPLS VPN → 3계층 VPN(IPsec VPN, MPLS L3VPN)","sourceTopic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술"},{"id":"c35","bank":"core","type":"서술형","area":"02 네트워크 보안","topic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","q":"VPN을 통한 외부 접속에서 필요한 접근통제 조치를 두 가지 쓰시오.","a":"허가된 사용자·단말만 VPN 접속 허용, 강력한 사용자 인증(MFA 등)과 접속 권한 최소화, 접속기록 수집·점검 등을 적용한다.","e":"VPN을 사용한다는 사실만으로 접근통제 요건이 모두 충족되는 것은 아니다.","source":285,"flags":"굵게+밑줄","focus":["접근통제"],"stars":2,"memory":"허가된 사용자·단말만 VPN 접속 허용, 강력한 사용자 인증(MFA 등)과 접속 권한 최소화, 접속기록 수집·점검 등을 적용한다.","pitfall":"","corrected":false,"legal":false,"sourceNote":"cf. 접근통제 : 개인정보취급자가 개인정보처리시스템을 외부에서 연결 시 안전한 접속수단(예:VPN 등) or 안전한 인증(예:2-Factor인증) 사용","sourceTopic":"가상사설망(VPN ) : 공용 네트워크(인터넷)를 통해 암호화된 통신 경로를 구성하여 사설망처럼 안전하게 통신하는 기술","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c36","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"ESM(Enterprise Security Management) : 통합 보안 관제 시스템. ESM Agent, Manager, Console 로 구성","q":"다수의 보안 장비·서버에서 로그를 수집하고 이벤트를 상관 분석하는 플랫폼의 약어는?","a":"SIEM(Security Information and Event Management)","e":"로그 통합, 규칙 기반 탐지, 상관 분석을 수행한다.","source":289,"flags":"붉은색","focus":["SIEM"],"stars":2,"memory":"SIEM(Security Information and Event Management)","pitfall":"","corrected":false,"legal":true,"sourceNote":"(cf.) SIEM : 모든 자원의 정보 및 로그 통합 수집, 빅데이터 기술 사용, 데이터 간 상관분석 수행","sourceTopic":"ESM(Enterprise Security Management) : 통합 보안 관제 시스템. ESM Agent, Manager, Console 로 구성"},{"id":"c37","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"무선 LAN","q":"2.4GHz·5GHz 대역을 지원하고 MIMO 등을 활용하며 최대 600Mbps(표준상 이론치)까지 지원하는 IEEE 802.11 규격은?","a":"802.11n","e":"실제 성능은 채널 폭, 공간 스트림 수, 환경에 따라 달라진다.","source":290,"flags":"굵게+밑줄","focus":["802.11n"],"stars":2,"memory":"802.11n","pitfall":"","corrected":false,"legal":false,"sourceNote":"IEEE 802 표준 : 802.11b(2.4GHz, 11Mbps), 802.11a(5GHz, 54Mbps), 802.11n (5G, 2.4G 듀얼, 600Mbps), 802.11p (차량통신, 5.9GHz, 27Mbps)","sourceTopic":"무선 LAN"},{"id":"c38","bank":"core","type":"서술형","area":"02 네트워크 보안","topic":"무선 LAN","q":"WEP가 안전하지 않은 무선 LAN 암호 방식으로 평가되는 원인을 두 가지 쓰시오.","a":"짧은 24비트 IV의 재사용 문제, RC4 기반 키스트림 취약점 및 취약한 무결성 보호 등으로 실용적인 암호해독 공격이 가능하다.","e":"WEP는 사용하지 않고 WPA2-AES 또는 WPA3 등 안전한 방식을 사용한다.","source":291,"flags":"붉은색","focus":["안전하지 않은 암호화"],"stars":3,"memory":"WEP = RC4 + 24bit IV 재사용 → 취약","pitfall":"WPA2는 일반적으로 AES-CCMP, WPA3는 SAE 기반 인증","corrected":true,"legal":false,"sourceNote":"WEP (Wired Equivalent Privacy) 인증 : IEEE 802.11 표준 , RC4 대칭키 알고리즘 40bit 키 사용, 24bit 초기화 벡터 연결하여 총 64bit 키로 암호화. → RC는 스트림 암호화(패딩 불필요, 암호문 다시 암호화 시 복호화됨) → 정적(고정된)키 사용 하므로 무작위 공격 등에 취약. cf. 안전하지 않은 암호화 기법(RC, MD, DES, SHA-1)","sourceTopic":"무선 LAN","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c39","bank":"core","type":"단답형","area":"02 네트워크 보안","topic":"무선 LAN","q":"기업용 무선 LAN 인증에서 EAP 인증 교환에 자주 사용하는 AAA 인증 서버 프로토콜은?","a":"RADIUS","e":"802.1X/EAP 기반 인증 시 AP가 인증자 역할을 하며 인증 서버가 자격 증명을 검증한다.","source":292,"flags":"굵게+밑줄","focus":["EAP를 지원","인증서버"],"stars":3,"memory":"기업용 802.1X 무선 인증 = EAP + RADIUS","pitfall":"AP 인증자(Authenticator) / 서버 인증 서버","corrected":false,"legal":false,"sourceNote":"WEP (Wired Equivalent Privacy) 인증 : IEEE 802.11 표준 , RC4 대칭키 알고리즘 40bit 키 사용, 24bit 초기화 벡터 연결하여 총 64bit 키로 암호화. → RC는 스트림 암호화(패딩 불필요, 암호문 다시 암호화 시 복호화됨) → 정적(고정된)키 사용 하므로 무작위 공격 등에 취약. cf. 안전하지 않은 암호화 기법(RC, MD, DES, SHA-1)\n\nWPA(Wi-Fi Protected Acess) 인증 : 무선 인증 표준, 128bit 동적 암호화/복호화, TKIP 방식(RC4 쓰지만 암호화 키 동적). 인증서버( Radius, EAP에서 인증=상호인증 ) 사용 → Personal Mode(미리 정의된 PSK(암호화 키) 공유 ), Enterprise Mode( 사용자별 유일한 세션키, EAP를 지원 하는 인증서버 (로그인) 필요)","sourceTopic":"무선 LAN"},{"id":"c40","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"이메일 보안","q":"SPF, DKIM, DMARC 등을 통해 이메일의 위조·변조·발신자 사칭을 방지하는 보안 영역은?","a":"이메일 보안","e":"SPF는 발신 서버의 허용 여부, DKIM은 서명, DMARC는 도메인 정렬 및 정책·보고와 관련된다.","source":313,"flags":"붉은색","focus":["이메일 보안"],"stars":2,"memory":"이메일 보안","pitfall":"","corrected":false,"legal":false},{"id":"c41","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"이메일 보안","q":"이메일을 열었는지 확인하기 위해 메시지 본문에 보이지 않는 작은 외부 이미지를 삽입하는 기법은?","a":"웹 비콘(Web Beacon)","e":"메일 열람 시 이미지 요청을 통해 수신 시각 등의 정보를 파악할 수 있다. 사용자·메일 서비스 설정에 따라 차단되기도 한다.","source":318,"flags":"굵게+밑줄","focus":["비콘"],"stars":2,"memory":"웹 비콘(Web Beacon)","pitfall":"","corrected":false,"legal":false,"sourceNote":"웹 비콘 : 메일 수신 확인을 위해 작은 이미지 은닉해서 보내는 것 <예> <img src=”프로그램”>","sourceTopic":"이메일 보안"},{"id":"c42","bank":"core","type":"작업형","area":"03 애플리케이션 보안","topic":"웹 서버 보안","q":"Apache에서 디렉터리 안에 index 파일이 없을 때 목록 노출을 막는 Options 설정값을 쓰시오.","a":"Options -Indexes","e":"Directory Listing 방어의 대표적인 방법이다."," 보통신망 으로 송수신 할 때, 전송구간 암호화"},{"id":"c53","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"OWASP (The Open Web Application Security Project) : 웹 취약점 의 우선순위와 위험도 기준을 제시하는 프로젝트","q":"웹 애플리케이션 보안 위험 목록인 Top 10을 발표하는 비영리 보안 커뮤니티·프로젝트는?","a":"OWASP","e":"OWASP Top 10은 웹 애플리케이션 보안 위험을 정리한 대표 자료이다.","source":396,"flags":"붉은색","focus":["OWASP"],"stars":3,"memory":"OWASP Top 10 최신 공개판 = 2025","pitfall":"시험 자료에 사용된 2021 버전과 항목 명칭·순위를 구별","corrected":false,"legal":false},{"id":"c54","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"소프트웨어 설계·구현 과정에서 취약점을 예방하도록 안전한 코딩·검증·설정을 적용하는 활동은?","a":"SW 개발보안(시큐어 코딩)","e":"입력 검증, 출력 인코딩, 안전한 인증·인가, 보안 테스트 등이 포함된다.","source":404,"flags":"붉은색·굵게+밑줄","focus":["SW 개발보안"],"stars":2,"memory":"SW 개발보안(시큐어 코딩)","pitfall":"","corrected":false,"legal":false},{"id":"c55","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"웹 애플리케이션에서 업로드·다운로드 파일을 검증할 때 확인할 요소를 네 가지 쓰시오.","a":"확장자 허용 목록, MIME·파일 시그니처, 파일 크기 및 개수, 저장 경로·실행 권한, 악성코드 검사 등을 점검한다.","e":"클라이언트가 보낸 파일명·Content-Type만 신뢰하지 않는다.","source":407,"flags":"굵게+밑줄","focus":["업로드/다운로드 파일 검증"],"stars":3,"memory":"업로드 검증 = 확장자·실제 콘텐츠·크기·저장 위치","pitfall":"클라이언트 Content-Type만 믿으면 안 됨","corrected":false,"legal":false,"sourceNote":"분석/ 설계 단계(4가지) 분류 : 입력 데이터 검증 및 표현 , 보안 기능, 에러 처리, 세션 통제\n\n분석 단계 보안 : 입력 데이터 검증 및 표현 → DBMS 조회 및 결과 검증, XML 조회 및 결과 검증, 시스템 자원 및 명령어 수행, 웹 서비스 요청 및 결과 검증, 웹 기반 중요기능 유효성 검사, HTTP 프로토콜 유효성 검증, 허용된 범위 내 메모리 접근 , 보안기능 동작에 사용되는 입력값 검증, 업로드/다운로드 파일 검증","sourceTopic":"SW 개발보안","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c56","bank":"core","type":"작업형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"SQL Injection을 막기 위해 사용자 입력값을 SQL 구조와 분리하여 전달하는 쿼리 작성 방식을 쓰시오.","a":"Prepared Statement(준비된 문장)와 바인딩 파라미터","e":"동적 SQL을 문자열 연결로 구성하는 방식 대신 자리표시자에 값을 바인딩한다.","source":412,"flags":"붉은색·굵게+밑줄","focus":["SQL 삽입","동적 SQL 방식"],"stars":3,"memory":"SQL Injection 방어 = Prepared Statement + 바인딩","pitfall":"값만 바인딩되며 동적 테이블/열 이름은 별도 허용목록 검증 필요","corrected":true,"legal":false,"sourceNote":"SQL 삽입 : 외부 입력 값을 쿼리에 삽입하여 쿼리 조작하는 공격. 모든 정보를 조회 함. <예> ‘ or 1=1 # (오라클에서는 ‘ or 1=1 --), ‘ or ‘a’=’a → Prepared Statemet 사용 (? 플레이스홀더 사용 - 실행중 매칭=바인드변수)으로 대응, ORM 사용 권장(MyBatis에서 ${} → #{}), 외부 문자열 직접 결합하는 동적 SQL 방식 지양 <동적 SQL 예> String query = “select * from test where name=’”+name+”’ “; 방어1(정적SQL) : 호스트(바인드) 변수 사용. 실행 중에 매핑 <예> sql = “select * from t_member where id= ? ” → PreparedStatement (sql) → setString (userid) → executeQuery() 방어2(Spring 프레임워크에서 Mybatis가 중간 역할 함) : ${} → # {} DBMS 조회 및 결과 검증 : DB계정 권한 최소화, 동적SQL 대신 정적 SQL 사용, 동적SQL 사용해야 한다면 입력값을 필터링","sourceTopic":"SW 개발보안","lessonIds":["sql-injection"],"answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c57","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"외부 입력값으로 ../../ 등의 경로 이동 문자열을 주입하여 허가되지 않은 파일에 접근하는 취약점은?","a":"경로 조작(Path Traversal)","e":"허용 디렉터리·경로 정규화·파일 접근권한을 검증해야 한다.","source":418,"flags":"붉은색","focus":["경로조작"],"stars":3,"memory":"Path Traversal = ../ 등의 경로 이동","pitfall":"경로 정규화 + 기본 경로 밖 이탈 차단","corrected":false,"legal":false,"sourceNote":"경로조작 및 자원 삽입 : 외부 입력 값 검증이 없거나 잘못된 검증을 거쳐서 시스템 자원 접근 <예> 파일 오픈(파일명 입력값으로 받음), ../../(경로조작 문자열) 사용 방어 : 경로조작 문자열을 ReplaceAll 로 없앰\n\n방어 : 경로조작 문자열을 ReplaceAll 로 없앰","sourceTopic":"SW 개발보안","lessonIds":["ssrf-xxe"]},{"id":"c58","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"XSS 공격의 실행 위치를 설명하고 핵심 대응책과 HttpOnly 속성의 역할을 쓰시오.","a":"XSS는 공격자 스크립트가 피해자의 브라우저에서 실행되는 취약점이다. 출력 문맥에 따른 인코딩이 핵심 대책이고, HttpOnly는 자바스크립트에서 쿠키를 읽지 못하도록 제한한다.","e":"HttpOnly는 XSS 자체를 방지하는 기술은 아니고 피해를 줄이는 보조 대책이다.","source":420,"flags":"붉은색·굵게+밑줄","focus":["XSS","브라우저 공격","HttpOnly 설정"],"stars":3,"memory":"XSS = 피해자 브라우저 실행 / 핵심 = 출력 인코딩","pitfall":"HttpOnly는 쿠키 읽기 제한이지 XSS 자체 방지 아님","corrected":true,"legal":false,"sourceNote":"XSS (크로스사이드 스크립팅) : 외부 입력 값에 의해 브라우저에서 악의적인 코드(JS) 실행. 클라이언트 공격(웹 브라우저 공격 ) → XSS 테스트 입력 예 : <script> alert(document.cookie) <\/script> 세션 정보 갈취 → HTML 인코딩, XSS 필터를 사용하여 대응( replaceAll() ) cf. document.cookie에 세션 정보가 있음 → HttpOnly 설정 으로 JS에서 접근 못하게 함. 또는 secure 설정 을 한다.(=SSL에서면 접근하도록 함) 방어1 : 동적 웹페이지에 대해 XSS 필터링 적용 → <예> <, >, &, ‘를 lt, gt, amp, quot로 replaceAll 방어2 : DB 조회 시 HTML 인코딩, XSS 필터 적용 Spring 프레임워크(전자정부 프레임워크)에서 XSS 방어하는 컴퍼넌트 : Filter(필터), Intercept(차단), Validator(검증)","sourceTopic":"SW 개발보안","lessonIds":["xss-csrf"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c59","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"입력값을 통해 운영체제 셸의 명령어 또는 구분자를 주입하여 의도하지 않은 명령을 실행시키는 취약점은?","a":"OS Command Injection(운영체제 명령어 삽입)","e":"가능하면 셸 호출을 피하고 안전한 API·허용 목록·권한 제한을 사용한다.","source":422,"flags":"붉은색","focus":["운영체제 명령어 삽입"],"stars":3,"memory":"OS Command Injection = 셸 명령어 주입","pitfall":"가능하면 셸 호출 회피 + 안전한 API 사용","corrected":false,"legal":false,"sourceNote":"운영체제 명령어 삽입 ( command 인젝션 ) : 외부 공격자가 운영체제 명령어 삽입하여 실행. 웹 사이트에에서 외부 입력값을 이용해 OS 명령어 실행( JAVA에서 Runtime.exec ) 기능 있을 때 가능 <예> ls & netstat ( |, &, ; 쓸 수 있으면 위험) → 지정된 명령어만 실행하도록 해서 방어 공격 : cmd = request.getParameter(”cmd”); java.Runtime.exec (cmd);\n\n공격 : cmd = request.getParameter(”cmd”); java.Runtime.exec (cmd);","sourceTopic":"SW 개발보안"},{"id":"c60","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"웹 셸(Web Shell)이 파일 업로드 취약점을 통해 실행되는 과정을 설명하고 예방 방법을 쓰시오.","a":"서버에서 실행 가능한 스크립트 파일을 업로드해 웹 경로를 통해 접근하면 서버 권한으로 악성 코드가 동작할 수 있다. 확장자·내용 검사, 실행 불가 업로드 디렉터리, 저장소 분리, 최소 권한 적용 등이 대응책이다.","e":"PHP·JSP 등 실행 가능 확장자뿐 아니라 서버 설정과 이중 확장자 우회에 주의해야 한다.","source":424,"flags":"붉은색·굵게+밑줄","focus":["위험한 형식 파일 업로드","웹 셸"],"stars":3,"memory":"웹 셸 = 업로드 후 서버 측 스크립트 실행","pitfall":"업로드 저장소 웹 실행권한 금지","corrected":false,"legal":false,"sourceNote":"위험한 형식 파일 업로드 : 파일 형식 검증 없이 업로드 허용하여 악성 코드( 웹 셸 )를 업로드 후 실행 → php, asp, jsp 또는 CER(인증서파일. 실행도 가능)을 웹 셸로 사용 Multipart(첨부파일 업로드 프로그램) 등 사용 시 발생(공개 웹 에디터 사용) 공격코드 : Web Shell 업로드(서버side 스크림트:jsp, php, asp 등) 방어 : 확장자 필터링 및 제거, 파일명을 랜덤하게 함, 디렉터리가 외부 노출 안되게 함, 파일 타입/크기/실행권한 제거 → 한계 : 이중 확장자 (test.php.jpg)에 취약. Null Byte 공격 (test.php%00.jpg) 가능","sourceTopic":"SW 개발보안","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c61","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"검증되지 않은 외부 URL로 사용자를 자동 이동시켜 피싱 등에 악용될 수 있는 취약점의 명칭은?","a":"오픈 리다이렉트(Open Redirect)","e":"허용 목록을 통해 목적지 URL을 검증하고 임의 리다이렉트를 제한한다.","source":427,"flags":"붉은색","focus":["신뢰되지 않는 URL"],"stars":2,"memory":"오픈 리다이렉트(Open Redirect)","pitfall":"","corrected":false,"legal":false,"sourceNote":"신뢰되지 않는 URL 주소로 자동 접속 연결 : 악의적인 사이트로 리다이렉트 → 피싱 공격 가능 공격 : url = request.getParameter(”url”) response. SendRedirect (url); 방어 : 화이트리스트 필터링(contain 메소드로 검사 - 등록된 것만 연결)","sourceTopic":"SW 개발보안"},{"id":"c62","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"XXE 공격이 발생하는 원리와 XML 파서의 대표적인 안전 설정을 쓰시오.","a":"XML 파서가 공격자가 삽입한 외부 엔티티를 해석하면서 파일 조회·SSRF 등이 발생할 수 있다. 필요하지 않은 DTD와 외부 엔티티 해석을 비활성화한다.","e":"XXE 대응은 SQL 바인딩과 무관하며 XML 파서 구성 보호가 핵심이다.","source":429,"flags":"붉은색","focus":["XXE"],"stars":3,"memory":"XXE = XML 외부 엔티티 해석 문제","pitfall":"DTD·외부 엔티티 기능 비활성화, SQL 바인딩과 무관","corrected":true,"legal":false,"sourceNote":"부적절한 XML 외부 개체 참조( XXE ) : XML 외부 엔티티를 처리할 때 외부 파일 접근이나 정보 유출 발생 → 외부파일명을 알고, 파일의 권한(read/write)가 있을 때 공격코드 예 : test.xml (test.xml 내용 예 <entity> aa system /etc/passwd) 방어 : 쿼리 예약어 필터링, 미리 작성된 쿼리문을 자료형에 따라 바인딩","sourceTopic":"SW 개발보안","lessonIds":["ssrf-xxe"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c63","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"외부 입력으로 XML 문서 구조가 변조되는 XML 삽입 취약점의 원리와 대응 방법을 쓰시오.","a":"사용자 입력을 XML 구문에 직접 결합하면 태그·속성 등이 조작될 수 있다. XML API·적절한 이스케이프와 입력 검증을 사용한다.","e":"XPath/XQuery 삽입은 쿼리 문자열 조작에 대한 별도의 방어 검토가 필요하다.","source":430,"flags":"붉은색","focus":["XML 삽입"],"stars":1,"memory":"사용자 입력을 XML 구문에 직접 결합하면 태그·속성 등이 조작될 수 있다. XML API·적절한 이스케이프와 입력 검증을 사용한다.","pitfall":"","corrected":true,"legal":false,"sourceNote":"방어 : 쿼리 예약어 필터링, 미리 작성된 쿼리문을 자료형에 따라 바인딩\n\nXML 삽입 : XML에 악의적 내용 삽입하여 조작. xpath, xquery → 특수문자(쿼리 예약어) 필터링 을 해결 공격코드 예 : name : ‘ or ‘a’=a → XML 문서 전체 내용 조회됨 방어 : 쿼리 예약어 필터링 <예> ‘, <, >, = 등","sourceTopic":"SW 개발보안","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c64","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"CSRF 공격이 성립하는 조건을 설명하고 대응 방법 세 가지를 쓰시오.","a":"인증된 사용자의 브라우저가 공격자가 유도한 상태 변경 요청을 전송하면서 발생한다. CSRF 토큰, SameSite 쿠키, Origin 검증 등을 사용한다.","e":"세션 쿠키 탈취가 반드시 선행되는 공격은 아니다.","source":433,"flags":"붉은색·굵게+밑줄","focus":["CSRF","서버 공격"],"stars":3,"memory":"CSRF = 인증된 브라우저를 이용한 원치 않는 요청","pitfall":"CSRF 토큰 + SameSite + Origin 검증, POST만으로 방어 불가","corrected":true,"legal":false,"lessonIds":["xss-csrf","http-sec"],"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c65","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"비밀번호 변경처럼 중요한 기능에서 로그인 세션 확인 이외에 재인증을 요구하는 이유를 설명하시오.","a":"탈취·방치된 세션만으로 민감한 작업이 수행되지 않도록 하기 위해 비밀번호 재입력, MFA 등으로 본인 확인을 한 번 더 수행한다.","e":"재인증은 민감한 작업을 보호하는 추가 조치이며 CSRF 토큰 검증을 대체하지 않는다.","source":435,"flags":"굵게+밑줄","focus":["재인증"],"stars":1,"memory":"탈취·방치된 세션만으로 민감한 작업이 수행되지 않도록 하기 위해 비밀번호 재입력, MFA 등으로 본인 확인을 한 번 더 수행한다.","pitfall":"","corrected":false,"legal":false,"sourceNote":"대응2 : 중요 화면(예:pw변경)에는 세션 외에 CSRF 토큰(=난수) 으로 재인증 . cf. OAuth : SNS 통한 인증. OAuth 2.0은 Access key에 대한 refresh 기능 포함 → Spring Framework 작업 : DispatcherServlet(토큰 전송), Inspector(차단, 검사)","sourceTopic":"SW 개발보안","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c66","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"HTTP 응답 분할 공격에서 응답 헤더 구분을 조작할 때 악용되는 CRLF의 제어 문자와 16진수 표기를 각각 쓰시오.","a":"\\r\\n, 0D0A","e":"CR은 0x0D, LF는 0x0A이므로 CRLF의 순서는 0D0A이다.","source":440,"flags":"붉은색","focus":["HTTP 응답 분할"],"stars":3,"memory":"CRLF = \\r\\n = 0D0A","pitfall":"응답 헤더 분리·조작은 CRLF 삽입과 관련","corrected":true,"legal":false},{"id":"c67","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"정해진 메모리 버퍼 경계를 넘어 데이터를 쓰면서 메모리 변조·비정상 종료 등의 피해를 유발하는 취약점은?","a":"버퍼 오버플로(Buffer Overflow)","e":"경계 검사, 안전한 메모리 처리, ASLR·DEP 등의 방어가 중요하다.","source":442,"flags":"붉은색","focus":["메모리 버퍼 오버플로우"],"stars":3,"memory":"버퍼 오버플로 = 할당 경계 밖 메모리 쓰기","pitfall":"경계 검사 + ASLR/DEP는 보조적 방어","corrected":false,"legal":false,"sourceNote":"메모리 버퍼 오버플로우 : Stack(지역 변수, 복귀 주소), Heap(동적 메모리)의 메모리 공간 넘어감 → 메모리 정보가 노출되거나 비정상 종료됨 공격 : test.do?data=aa….aa 방어1 : DEP - Heap 실행 권한 삭제, 랜덤스택(ASLR) - 동적주소 설정 <예> randomize_va_space=2, Stack Shield = 1 방어2 : 취약한 API 사용하지 않음, 경계값 검사","sourceTopic":"SW 개발보안"},{"id":"c68","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"SW 개발보안","q":"C의 printf 등에서 공격자가 제어하는 문자열을 형식 문자열로 직접 사용하면 발생하는 취약점과 대응 방법을 쓰시오.","a":"포맷 스트링 삽입(Format String Vulnerability). 고정된 형식 문자열을 사용해 입력을 데이터 인자로 전달하고 입력 검증과 컴파일러 보호 기능을 적용한다.","e":"%x 등은 메모리 정보 노출에, %n은 조건에 따라 메모리 쓰기 문제에 악용될 수 있다.","source":444,"flags":"붉은색","focus":["포맷 스트링 삽입"],"stars":3,"memory":"printf(user_input) 위험 → printf(\"%s\", user_input)","pitfall":"%x 정보 노출, %n 조건부 메모리 쓰기","corrected":false,"legal":false,"sourceNote":"포맷 스트링 삽입 : 외부로 입력된 값을 검증하지 않고 출력 함수의 형식 문자열로 그대로 사용하여 발생 → 메모리 정보 노출, 메모리 변조, Shell code 삽입 이 일어날 수 있음 <예> %x(메모리 주소 노출), %n(메모리 변조), %hn 공격코드 : test.do?data=%n%n%hn%hn","sourceTopic":"SW 개발보안","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c69","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"기타 보안","q":"SQL 실행 결과의 참·거짓 또는 반응 차이를 이용해 정보를 한 글자씩 추정하는 SQL Injection 방식은?","a":"Blind SQL Injection","e":"에러 내용을 보지 않아도 참·거짓·시간차 등으로 정보를 추론한다.","source":460,"flags":"붉은색","focus":["SQL Injection"],"stars":3,"memory":"Blind SQLi = 응답의 참·거짓 또는 시간차로 추론","pitfall":"에러가 화면에 없어도 정보 추출 가능","corrected":false,"legal":false,"sourceNote":"Blind SQL Injection : substr()으로 문자열을 하나씩 자르고 아스키코드 입력해서 해당 문자열 완성(true, false로 확인)하는 공격기법. SQL 결과가 True와 False로 오며, substr() 함수와 함께 사용 됨 cf. UNION SQL Injection : SQL 문의 Union으로 합집합 만들어서 공격. 컬럼 개수와 데이터 타입이 동일해야 적용 가능 cf. Mass SQL Injection : 대용량 DB 접근 cf. Cookie Injection : Get/Post가 아닌 Cookie 통해 데이터 전달","sourceTopic":"기타 보안","lessonIds":["sql-injection"]},{"id":"c70","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"기타 보안","q":"안전한 파일 업로드에 필요한 보안 대책을 네 가지 쓰시오.","a":"확장자·MIME·파일 내용 검증, 파일 크기·개수 제한, 서버에서 임의의 파일명으로 저장, 웹 실행 경로와 저장 경로 분리 및 실행권한 차단 등을 적용한다.","e":"악성코드 검사와 접근권한 관리도 추가 대책이다.","source":461,"flags":"붉은색·굵게+밑줄","focus":["업로드에 대한 보안 대책"],"stars":3,"memory":"업로드: 화이트리스트 + 내용검증 + 실행금지 + 격리","pitfall":"확장자만으로 방어 불충분","corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c71","bank":"core","type":"작업형","area":"03 애플리케이션 보안","topic":"기타 보안","q":"Apache에서 최대 업로드 요청 크기를 5,000,000바이트로 제한할 때 사용하는 지시어와 설정 예를 작성하시오.","a":"LimitRequestBody 5000000","e":"값 단위는 바이트이다. 5,000,000바이트는 약 5MB(10진)이다.","source":463,"flags":"굵게+밑줄","focus":["LimitRequestBody"],"stars":3,"memory":"업로드 제한: LimitRequestBody 5000000","pitfall":"단위는 비트가 아니라 바이트","corrected":true,"legal":false,"sourceNote":"업로드 파일의 타입, 크기, 개수, 실행권한 제한 파일 크기 제한 : 최대 5Mb(5,000,000bit) 제한. 아파치는 웹 서버에서 제한 가능( LimitRequestBody 사용). cf. Tomcat(DB연결 처리)에서는 Spring 프레임워크 사용하여 제한. UploadSize = 5000000 → -1인 경우 무제한)\n\n파일 크기 제한 : 최대 5Mb(5,000,000bit) 제한. 아파치는 웹 서버에서 제한 가능( LimitRequestBody 사용). cf. Tomcat(DB연결 처리)에서는 Spring 프레임워크 사용하여 제한. UploadSize = 5000000 → -1인 경우 무제한)","sourceTopic":"기타 보안","answerMethod":"출력/설정/명령의 대상과 옵션을 확인 → 필요한 명령·값을 정확히 표기 → 결과 판단 근거 → 보안 조치 및 재점검을 작성."},{"id":"c72","bank":"core","type":"단답형","area":"03 애플리케이션 보안","topic":"기타 보안","q":"XSS의 대표적인 세 가지 유형을 쓰시오.","a":"Stored XSS, Reflected XSS, DOM-based XSS","e":"저장형은 서버에 입력이 저장되고, 반사형은 요청이 응답에 반영되며, DOM형은 브라우저의 DOM 조작에서 발생한다.","source":466,"flags":"붉은색","focus":["XSS 종류"],"stars":3,"memory":"XSS 3유형 = 저장형·반사형·DOM 기반","pitfall":"발생 위치와 입력이 저장되는지 구분","corrected":false,"legal":false},{"id":"c73","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"디지털 포렌식 : 디지털  증거 수집","q":"디지털 포렌식의 기본 원칙 다섯 가지를 제시하고 각각 설명하시오.","a":"정당성: 적법하게 수집. 무결성: 수집 이후 변조되지 않음. 재현성: 같은 절차에서 결과 재현. 신속성: 휘발성 증거 손실 방지. 절차 연속성: 수집·이송·분석·보관 전 과정의 관리 기록.","e":"해시 기록과 증거 인수인계 기록을 통해 무결성과 절차 연속성을 강화한다.","source":478,"flags":"굵게+밑줄","focus":["기본원칙"],"stars":3,"memory":"포렌식 원칙: 정당·무결·재현·신속·절차연속","pitfall":"체인 오브 커스터디와 해시 기록 연결","corrected":false,"legal":true,"sourceNote":"기본원칙 : 정당성 원칙 (적법절차로 수집했나?), 재현 원칙 (항상 같은 결과가 나오나?), 신속성 원칙 (포렌식이 신속하게 이뤄졌나? 휘발성 증거 관련), 절차 연속성 원칙 (증거물 수집,이동,보관,분석,제출 명확한가?), 무결성 원칙 (증거가 위변조 되지 않았나? 해시값 이용)","sourceTopic":"디지털 포렌식 : 디지털  증거 수집","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c74","bank":"core","type":"서술형","area":"03 애플리케이션 보안","topic":"디지털 포렌식 : 디지털  증거 수집","q":"디지털 포렌식 절차를 순서대로 쓰고 증거의 무결성을 유지하는 방법을 설명하시오.","a":"준비 → 증거 수집(획득) → 이송·보존 → 분석 → 보고서 작성 → 보관 등. 수집 시 해시값을 계산하고 쓰기 방지 장비와 증거 관리 이력을 활용한다.","e":"기관·표준별 세부 단계는 다를 수 있으므로 제공된 노트 순서를 기준으로 이해한다.","source":480,"flags":"굵게+밑줄","focus":["디지털 포렌식 절차"],"stars":2,"memory":"준비 → 증거 수집(획득) → 이송·보존 → 분석 → 보고서 작성 → 보관 등. 수집 시 해시값을 계산하고 쓰기 방지 장비와 증거 관리 이력을 활용한다.","pitfall":"","corrected":false,"legal":true,"sourceNote":"디지털 포렌식 절차 : 준비→획득→이송→분석→증거분석서 작성→보관","sourceTopic":"디지털 포렌식 : 디지털  증거 수집","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c75","bank":"core","type":"서술형","area":"04 정보보호일반","topic":"지식기반 인증 : 패스워드, Pin번호","q":"무차별 대입 공격과 크리덴셜 스터핑을 구분하고 방어 방법 두 가지를 제시하시오.","a":"무차별 대입은 비밀번호 후보를 반복 시도하는 공격이고, 크리덴셜 스터핑은 다른 서비스 등에서 유출된 ID·비밀번호 쌍을 재사용하는 공격이다. MFA, 요청 횟수 제한, 이상 로그인 탐지 등을 활용한다.","e":"사전 공격은 후보 단어 목록을 사용하는 무차별 대입의 변형이다.","source":487,"flags":"굵게+밑줄","focus":["무차별 공격"],"stars":3,"memory":"무차별대입 = 후보 반복 / 스터핑 = 유출된 ID·PW 재사용","pitfall":"MFA·속도제한·이상탐지","corrected":true,"legal":false,"sourceNote":"무차별 공격 = Brute Force Attack, 사전 공격, 레인보우 테이블, 크리덴셜 스터핑 (A사이트 계정 유출 정보를 B사이트에 사용 → 2차 인 ceNote":"ISMS 인증 : 관리체계 수립 및 운영, 보호대책 요구사항 . 일정 조건 사업자 의무 인증. 인증 유효기간 3년 → 대상자 : ISP (VoIP, CDN, IPTV 사업자 포함), IDC (통신 시설 운영 사업자-서버호스팅 사업자 등), 정보통신서비스 매출액 100억 또는 일일 이용자 100만명 이상 사업자, 매출액 1500억 이상 상급종합병원 , 세입 1500억원 이상이면서 재학생 1만명 이상 대학 교\n\nISMS-P 인증 : ISMS 인증에 개인정보처리 단계별 요구사항 추가한 통합 인증. 자율 인증. 한국인터넷진흥원, 금융보안원 에서 인증 부여. 정보통신 제공자(영리 목적으로 망 이용하는자) 에 대한 인증 . cf. 금융권 : 전자금융거래법상 매출액 100억 이용자 100만명에서 제외","sourceTopic":"정보보호 관리","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c80","bank":"core","type":"서술형","area":"05 정보보호관리 및 법률","topic":"정보보호 관리","q":"ISMS 관리체계 수립 및 운영의 주요 활동을 순서대로 설명하시오.","a":"관리체계 기반 마련 → 위험관리 → 관리체계 운영 → 관리체계 점검 및 개선","e":"PDCA 원리에 따라 지속적으로 운영·개선한다.","source":582,"flags":"붉은색","focus":["관리체계 수립 및 운영"],"stars":2,"memory":"관리체계 기반 마련 → 위험관리 → 관리체계 운영 → 관리체계 점검 및 개선","pitfall":"","corrected":false,"legal":true,"sourceNote":"관리체계 수립 및 운영 : 관리체계 기반 마련 → 위험관리 → 관리체계 운영 → 관리체계 점검 및 개선 (PDCA 사이클로 반복) PDCA(Plan, Do, Check, Act) : 업무 지속적 개선 위한 사이클 (계획-실행-점검-개선)","sourceTopic":"정보보호 관리","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c81","bank":"core","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"정보보호 위험관리에서 자산·위협·취약점이 서로 어떻게 연관되는지 설명하시오.","a":"자산은 보호해야 할 대상, 위협은 피해를 유발할 수 있는 잠재 사건·행위, 취약점은 악용 가능한 약점이다. 위협이 취약점을 악용하면 자산에 손실이 발생할 수 있다.","e":"위험 수준은 발생 가능성과 영향 등을 고려해 평가한다.","source":590,"flags":"붉은색·굵게+밑줄","focus":["위험관리 구성"],"stars":3,"memory":"자산 + 위협 + 취약점 → 위험","pitfall":"위험은 발생가능성과 영향 수준 고려","corrected":false,"legal":false,"answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c82","bank":"core","type":"단답형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"위험분석 기법 중 금액·확률 등 수치를 이용하는 방식과 전문가 판단·등급을 사용하는 방식을 각각 쓰시오.","a":"정량적 위험분석, 정성적 위험분석","e":"정량적은 비용편익 계산에 유리하나 데이터 확보가 어렵고, 정성적은 신속하지만 주관성이 존재한다.","source":595,"flags":"굵게+밑줄","focus":["위험분석기법"],"stars":2,"memory":"정량적 위험분석, 정성적 위험분석","pitfall":"","corrected":false,"legal":false},{"id":"c83","bank":"core","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"상세위험분석에서 수행하는 대표적인 분석 활동 세 가지를 쓰고 목적을 설명하시오.","a":"자산분석, 위협분석, 취약점 분석. 이를 통해 위험 수준과 보호대책 우선순위를 평가한다.","e":"정성적 분석 또는 정량적 분석을 결합하여 활용할 수 있다.","source":596,"flags":"붉은색","focus":["상세위험분석"],"stars":2,"memory":"자산분석, 위협분석, 취약점 분석. 이를 통해 위험 수준과 보호대책 우선순위를 평가한다.","pitfall":"","corrected":false,"legal":false,"sourceNote":"상세위험분석 : 정성적 위험분석(우선순위화), 정량적 위험분석(영향도, 발생확률 수치화). → 자산분석, 위협분석, 취약점 분석 단계로 위험평가 정성적 : 전문가감정/비정형접근법(예:델파이기법-익명성, 의견 반복 수렴, 조정자), 기준선법(예:체크리스크), 시나리오법(알려지지 않은 위협 평가) → 기준선 접근법 : 시간 및 비용이 적게듦. 조직의 특성 고려 안함, 소규모 기업에 적절 정량적 : 연간손실액(ALE) , 과거자료 분석법, 수학적 접근법, 확률분포 추정법 → 확률분포법 : 미지의 사건 을 추정하는데 사용되는 방법 혼합 분석(복합적 접근법) : 정성적+정략적 함께 사용. 고위험 영역은 상세 위험 분석 + 다른 영역은 기준선법 적용","sourceTopic":"위험평가","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c84","bank":"core","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"개인정보를 정보주체의 동의를 받아 수집·이용할 때 고지해야 할 대표 사항 네 가지를 쓰시오.","a":"수집·이용 목적, 수집하는 개인정보 항목, 보유·이용 기간, 동의 거부 권리와 거부 시 불이익이 있는 경우 그 내용","e":"개인정보 보호법 제15조 관련 고지사항이다. 법령상 다른 처리 근거와 구분한다.","source":618,"flags":"붉은색·굵게+밑줄","focus":["개인정보 수집 가능 상황","동의 시 고지 항목"],"stars":3,"memory":"수집 동의 고지 4종 = 목적·항목·기간·거부권(불이익)","pitfall":"동의 외의 적법한 처리 근거와 구분","corrected":false,"legal":true,"sourceNote":"개인정보 처리 단계별 요구사항 개인정보 수집 제한 : 개인정보는 법적 근거(동의, 법률상 의무, 계약 이행 등)가 있는 경우 수집 가능 → 개인정보 수집 가능 상황 : 정보주체 동의 , 법률/공공기관 법률, 계약체결 , 정당학 이익/신체 생명, 공중위생 → 동의 시 고지 항목 : 수집이용 목적, 수집 항목, 보유 및 이용기간, 동의거부권리 및 불이익 → 만 14세 미만 아동 : 법정대리인의 동의(아동, 대리인 둘 다. 신용카드 인증도 가능) 개인정보의 수집 동의 : 최소한의 개인정보만 수집 주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가 . 주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가 . 민감정보 및 고유식별정보의 처리 : 원칙적으로 처리 금지. 별도 동의 또는 법령상 허용 근거가 있는 경우 가 능. 단, 주민등록번호는 별도 동의만으로 처리 불가 . 개인정보 간접 수집 : 제3자 등으로부터 수집한 개인정보에 대해 정보주체가 요구하면 수집 출처, 처리 목적, 처리정지 요구 권리 를 알려야 함. 영상정보처리기기 설치운영 : 고정형(CCTV)/이동형(드론). 법령에 의해서 설치 (수술실, 시설관리, 교통, 교도소, 군사시설) → 안내판 필요, 공개된 장소 여야 함 cf. 안내판 내용 : 목적 및 장소, 범위 및 시간, 관리책임자 연락처, 그 밖에(위탁업체 정보) 홍보 및 마케팅 목적활용 시 조치 : 광고성 정보 수신 동의 여부를 2년마다 확인하는 의무 개인정보 목적 외 이용 및 제공 : 별도 동의 또는 법률상 예외 근거 가 있는 경우 허용 개인정보 국외 이전 : 별도 동의 외에도 법령에서 인정하는 계약 이행, 인증 등 일정 요건에 따라 이전 가능. 개인정보의 파기 : 목적 달성 시 지체없이 파기. 다른 법령에 따라 보존해야 하는 경우 분리 보관 등 필요한 조치 개인정보 제3자 제공 : 동의 또는 법적 근거 필요. 동의 시 제공받는 자, 이용 목적 , 제공 항목 , 보유 및 이용기간 , 거부 권리와 불이익 고지. 개인정보 처리 위탁 : 위탁업무와 수탁자 공개, 위탁계약 문서화, 수탁자 교육 및 감독. 개인정보 안전성 확보 : 접근권한 관리, 암호화 , 접속기록 관리, 보안 프로그램 운영 등 기술적·관리적·물리적 보호조치. 정보주체 권리 보장 : 개인정보 열람, 정정·삭제, 처리정지, 동의 철회, 자동화된 결정에 대한 거부·설명 요구 등 보장. cf. 개인정보 별도동의 사항 : 제3자 제공, 목적 외 이용, 민감정보, 고유 식별자, 국외이전","sourceTopic":"위험평가","answerMethod":"정의·원리 → 발생 조건/근거 → 영향 또는 비교 → 보완·검증 순서로 작성. 문제에서 요구한 개수를 먼저 충족한다."},{"id":"c85","bank":"core","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"개인정보 보호법에서 주민등록번호 처리가 일반 동의만으로 허용되지 않는 이유와 예외를 설명하시오.","a":"주민등록번호는 개인정보 보호법 제24조의2의 제한 대상으로, 법률·대통령령 등에서 구체적으로 허용한 경우 등 법정 예외에 해당할 때만 처리할 수 있다. 정보주체 동의만으로는 처리할 수 없다.","e":"일반 고유식별정보의 동의 처리와 구분한다.","source":619,"flags":"붉은색","focus":["주민등록번호","처리 제한"],"stars":3,"memory":"주민등록번호 = 일반 동의만으로 처리 불가","pitfall":"법률·대통령령상 허용 사유 등 별도 근거 필요","corrected":false,"legal":true,"sourceNote":"개인정보 처리 단계별 요구사항 개인정보 수집 제한 : 개인정보는 법적 근거(동의, 법률상 의무, 계약 이행 등)가 있는 경우 수집 가능 → 개인정보 수집 가능 상황 : 정보주체 동의 , 법률/공공기관 법률, 계약체결 , 정당학 이익/신체 생명, 공중위생 → 동의 시 고지 항목 : 수집이용 목적, 수집 항목, 보유 및 이용기간, 동의거부권리 및 불이익 → 만 14세 미만 아동 : 법정대리인의 동의(아동, 대리인 둘 다. 신용카드 인증도 가능) 개인정보의 수집 동의 : 최소한의 개인정보만 수집 주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가 . 주민등록번호 처리 제한 : 법률·대통령령 등에서 구체적으로 허용하거나 법령상 정해진 예외에 해당하는 경우에만 처리 가능. 정보주체의 동의만으로는 처리 불가 . 민감정보 및 고유식별정보의 처리 : 원칙적으로 처리 금지. 별도 동의 또는 법령상 허용 근거가 있는 경우 가 능. 단, 주민등록번호는 별도 동의만으로 처리 불가 . 개인정보 간접 수집 : 제3자 등으로부터 수집한 개인정보에 대해 정보주체가 요구하면 수집 출처, 처리 목적, 처리정지 요구 권리 를 알려야 함. 영상정보처리기기 설치운영 : 고정형(CCTV)/이동형(드론). 법령에 의해서 설치 (수술실, 시설관리, 교통, 교도소, 군사시설) → 안내판 필요, 공개된 장소 여야 함 cf. 안내판 내용 : 목적 및 장소, 범위 및 시간, 관리책임자 연락처, 그 밖에(
