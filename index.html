const CASES=[{"id":"case1","bank":"case","type":"작업형","area":"01 시스템 보안","topic":"리눅스 특수 권한과 점검","q":"관리자는 Linux 서버에서 특수 권한 파일과 공용 디렉터리를 점검하고 있다.\n(1) SetUID 파일을 검색하는 find 명령을 쓰시오.\n(2) SetGID 파일을 검색하는 find 명령을 쓰시오.\n(3) /srv/shared를 모든 사용자가 사용할 수 있게 하되, 다른 사용자 파일의 삭제를 제한하는 chmod 명령을 쓰시오.\n(4) -rwsr-xr-x 파일에서 소문자 s가 의미하는 것을 설명하시오.","a":"(1) find / -type f -perm -4000 2>/dev/null\n(2) find / -type f -perm -2000 2>/dev/null\n(3) chmod 1777 /srv/shared\n(4) 소유자 실행 권한(x)과 SetUID가 함께 설정되었음을 의미한다. 실행한 사용자는 해당 실행 파일의 소유자 유효 UID 권한으로 작업한다.","e":"SetUID=4000, SetGID=2000, Sticky Bit=1000. find의 -perm -MODE는 해당 비트가 모두 설정되어야 함을 뜻한다. 공용 디렉터리의 스티키 비트는 파일 삭제·이름 변경의 권한을 제한한다.","rubric":["SetUID 검색: find / -type f -perm -4000","SetGID 검색: find / -type f -perm -2000","공용 디렉터리: chmod 1777","소문자 s = SetUID + 소유자 실행권한"],"legal":false,"case":true,"lessonIds":["linux-perm"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: 리눅스 특수 권한과 점검\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case2","bank":"case","type":"작업형","area":"01 시스템 보안","topic":"백업 스크립트와 umask","q":"Linux의 백업 스크립트가 생성한 백업 파일의 권한이 -rw-r--r-- 이다. 백업에는 민감한 설정정보가 들어 있다.\n(1) 이 권한의 보안 문제를 설명하시오.\n(2) 신규 백업 파일을 원칙적으로 600으로 생성하기 위한 umask 명령을 쓰시오.\n(3) 지정한 사용자가 백업 스크립트만 실행할 수 있도록 할 때 고려할 Linux 파일 권한 통제를 두 가지 쓰시오.\n(4) 백업 파일이 이미 644로 생성된 상태라면 소유자만 읽고 쓸 수 있도록 바꾸는 명령을 쓰시오.","a":"(1) 그룹·기타 사용자에게 읽기 권한이 있으므로 백업 내용이 노출될 수 있다.\n(2) umask 077\n(3) 스크립트 파일의 소유자·그룹을 지정하고, 그룹별 실행 권한 등을 최소한으로 부여하며 백업 저장소 접근도 별도로 통제한다.\n(4) chmod 600 <백업파일명>","e":"파일 생성 권한의 기본 상한은 통상 666이고 077 마스크를 적용하면 600이 된다. umask는 이후 새로 생성되는 파일에 영향을 주며 이미 존재하는 파일의 권한은 chmod로 조정한다.","rubric":["백업 파일 644의 노출 위험","umask 077","소유자·그룹 / 최소 권한","chmod 600"],"legal":false,"case":true,"lessonIds":["linux-perm"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: 백업 스크립트와 umask\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case3","bank":"case","type":"작업형","area":"01 시스템 보안","topic":"삭제된 실행 파일 포렌식","q":"침해사고 조사에서 PID 5900의 프로세스는 실행 중이지만 원본 실행 파일은 삭제된 상태다.\n(1) /proc 디렉터리의 성격을 설명하시오.\n(2) PID 5900의 실행 파일에 대한 링크 경로를 쓰시오.\n(3) 실행 파일을 /tmp/recovered.bin으로 확보하는 명령을 쓰시오.\n(4) ps 명령을 신뢰할 수 없을 때 프로세스의 실행 인수를 확인하는 /proc 경로를 쓰시오.","a":"(1) /proc는 프로세스 및 커널 정보를 보여주는 가상 파일 시스템이다.\n(2) /proc/5900/exe\n(3) cp /proc/5900/exe /tmp/recovered.bin\n(4) /proc/5900/cmdline (NUL 구분 인수이므로 tr \"\\0\" \" \" 등으로 읽기 좋게 표시 가능)","e":"프로세스를 /proc에 복사하여 실행하는 것은 아니다. 실행 중인 파일을 링크로 참조하고 있으면 파일이 삭제된 뒤에도 데이터 확보가 가능한 경우가 있다. 권한 제한·보안 조치로 실패할 수도 있다.","rubric":["/proc의 성격","/proc/5900/exe","cp /proc/5900/exe /tmp/recovered.bin","/proc/5900/cmdline"],"legal":false,"case":true,"lessonIds":["linux-logs"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: 삭제된 실행 파일 포렌식\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case4","bank":"case","type":"작업형","area":"01 시스템 보안","topic":"Windows 의심 프로세스 조사","q":"Windows 서버에서 외부로 연결 중인 PID가 5900인 것을 확인했다.\n(1) 연결 포트와 PID를 확인하는 CMD 명령을 쓰시오.\n(2) PID 5900과 연결된 프로세스 이름을 조회하는 명령을 쓰시오.\n(3) 해당 프로세스의 실행 경로·명령줄을 확인하기 위한 Windows의 관리 인터페이스 한 가지를 쓰시오.\n(4) 의심 프로세스 발견 직후 조사에서 보존해야 할 증거를 두 가지 쓰시오.","a":"(1) netstat -ano\n(2) tasklist /FI \"PID eq 5900\"\n(3) PowerShell Get-CimInstance Win32_Process -Filter \"ProcessId=5900\" (ExecutablePath, CommandLine 조회)\n(4) 네트워크 연결 정보, 실행 파일 및 해시, 이벤트 로그, 메모리 상태 등 가운데 두 가지","e":"프로세스 정보는 PID만으로 악성을 단정할 수 없다. 시간·실행 경로·서명·부모 프로세스·해시·로그를 교차 검증한다.","rubric":["netstat -ano","tasklist /FI","CIM/WMI 프로세스 명령줄","증거 2종"],"legal":false,"case":true,"lessonIds":["linux-logs","modern-threat"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: Windows 의심 프로세스 조사\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case5","bank":"case","type":"작업형","area":"03 애플리케이션 보안","topic":"Apache 웹 서버 보안 설정","q":"Apache HTTP Server에서 다음 위험을 줄이려 한다.\n(1) 디렉터리 파일 목록 자동 노출을 금지하는 Options 설정을 쓰시오.\n(2) HTTP Server 응답 헤더에서 버전 정보를 최소화하는 지시어를 쓰시오.\n(3) 생성된 오류 문서의 서버 서명 정보를 숨기는 지시어를 쓰시오.\n(4) 요청 본문 최대 크기를 5,000,000바이트로 제한하는 지시어를 쓰시오.","a":"(1) Options -Indexes\n(2) ServerTokens Prod\n(3) ServerSignature Off\n(4) LimitRequestBody 5000000","e":"Indexes 비활성화는 디렉터리 목록 노출 방지, ServerTokens는 Server 헤더 노출 정보 최소화, ServerSignature는 오류 페이지 등의 서명, LimitRequestBody는 HTTP 요청 본문 크기 상한을 다룬다. 상속·버전·적용 위치 확인이 필요하다.","rubric":["Options -Indexes","ServerTokens Prod","ServerSignature Off","LimitRequestBody 5000000"],"legal":false,"case":true,"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: Apache 웹 서버 보안 설정\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case6","bank":"case","type":"작업형","area":"03 애플리케이션 보안","topic":"XSS와 세션 쿠키 방어","q":"게시판에 악성 스크립트가 저장되어 방문자의 브라우저에서 실행되는 사건이 발생했다.\n(1) 공격 명칭과 유형을 쓰시오.\n(2) 출력할 사용자 콘텐츠를 처리하는 가장 중요한 방어 원칙을 설명하시오.\n(3) 세션 쿠키의 Secure, HttpOnly 속성이 각각 수행하는 역할을 설명하시오.\n(4) HttpOnly만 설정하면 XSS가 완전히 차단되는지 설명하시오.","a":"(1) 저장형 XSS(Stored XSS)\n(2) 출력 위치(HTML 본문·속성·URL·스크립트 등)에 맞는 출력 인코딩을 적용하고, HTML을 허용할 경우 검증된 Sanitizer를 사용한다.\n(3) Secure: HTTPS에서만 쿠키 전송. HttpOnly: 자바스크립트의 document.cookie 접근 제한.\n(4) 아니요. HttpOnly는 쿠키 탈취 위험을 낮추는 보조 수단이며 악성 스크립트 실행 자체를 막지 못한다.","e":"XSS의 실행 대상은 피해자 브라우저다. CSRF는 인증된 브라우저의 요청을 위조하는 공격으로 XSS와 구별한다. SameSite는 사이트 간 쿠키 전송을 제한해 CSRF 완화에 기여한다.","rubric":["Stored XSS","출력 문맥별 인코딩","Secure·HttpOnly 구분","HttpOnly는 완전 방어 아님"],"legal":false,"case":true,"lessonIds":["xss-csrf","http-sec"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: XSS와 세션 쿠키 방어\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case7","bank":"case","type":"작업형","area":"03 애플리케이션 보안","topic":"SQL Injection 개선 코드","q":"웹앱에서 사용자 입력 id를 SQL 문자열에 직접 이어 붙여 조회하고 있다.\n(1) 발생할 수 있는 취약점의 이름을 쓰시오.\n(2) Node.js mysql2의 ? 플레이스홀더를 이용해 안전한 SQL 구조를 작성하시오.\n(3) 플레이스홀더에 값을 전달하는 원리를 설명하시오.\n(4) 테이블명·정렬 열 이름을 사용자 입력으로 받을 때 추가로 필요한 검증 방법을 쓰시오.","a":"(1) SQL Injection(SQL 삽입)\n(2) connection.execute('SELECT * FROM member WHERE member_id = ?', [id])\n(3) SQL 문장 구조와 입력 데이터를 분리해 바인딩하며, 값이 SQL 예약어·연산자로 해석되지 않도록 한다.\n(4) 허용 목록(allowlist)에서 테이블명·열 이름을 선택하여 동적 SQL 식별자 조작을 막는다.","e":"준비된 문장(Prepared Statement)은 SQL 인젝션을 예방하는 대표적인 방법이다. 바인딩은 보통 값 자리에 적용하며, 동적으로 만드는 식별자에는 허용 목록 검증이 필요하다.","rubric":["SQL Injection","? 플레이스홀더와 [id]","SQL 구조·값 분리","테이블/열 이름 허용 목록"],"legal":false,"case":true,"lessonIds":["sql-injection","ssrf-xxe"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: SQL Injection 개선 코드\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case8","bank":"case","type":"작업형","area":"02 네트워크 보안","topic":"Snort 규칙 해석","q":"다음 Snort 규칙을 보고 답하시오.\nalert tcp any any -> 192.0.2.10 80 (msg:\"GET CHECK\"; content:\"GET\"; sid:1000001; rev:1;)\n(1) alert와 tcp의 의미를 쓰시오.\n(2) 규칙의 방향 및 목적지 IP·포트를 쓰시오.\n(3) content:\"GET\"의 의미를 쓰시오.\n(4) sid, rev의 역할을 쓰시오.","a":"(1) alert: 조건 일치 시 경보 생성 / tcp: TCP 패킷 검사\n(2) any any에서 192.0.2.10의 TCP 80번 포트로 향하는 패킷\n(3) 패킷 페이로드에서 GET 문자열을 탐지한다.\n(4) sid: 규칙 식별 번호 / rev: 규칙 개정 번호","e":"규칙 헤더(동작·프로토콜·출발지·방향·목적지)와 규칙 옵션(msg·content·sid·rev)을 분리해서 해석한다. Snort 버전에 따라 규칙 문법이 변할 수 있다.","rubric":["alert / tcp","any any → 192.0.2.10:80","content 검사","sid / rev"],"legal":false,"case":true,"lessonIds":["detection"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: Snort 규칙 해석\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case9","bank":"case","type":"작업형","area":"02 네트워크 보안","topic":"tcpdump 옵션 분석","q":"보안 담당자가 eth0에서 TCP 443번 통신을 패킷 10개까지만 조사하려 한다.\n(1) 이 조건에 맞는 tcpdump 명령을 쓰시오.\n(2) -i 옵션의 의미를 쓰시오.\n(3) -nn 옵션의 의미를 쓰시오.\n(4) 필터식 tcp and port 443의 의미를 설명하시오.","a":"(1) tcpdump -i eth0 -nn -c 10 'tcp and port 443'\n(2) 캡처할 네트워크 인터페이스 지정\n(3) 주소의 이름 변환과 포트의 서비스명 변환을 하지 않음\n(4) TCP 패킷 중 출발지 또는 목적지 포트가 443인 패킷을 검사","e":"tcpdump는 BPF 필터 표현식으로 캡처할 트래픽을 선택할 수 있다. 캡처 결과의 맥락·기밀성을 고려해야 한다.","rubric":["완전한 tcpdump 명령","-i 인터페이스","-nn 숫자 출력","tcp and port 443"],"legal":false,"case":true,"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: tcpdump 옵션 분석\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case10","bank":"case","type":"작업형","area":"03 애플리케이션 보안","topic":"DNS 존 전송과 노출 보호","q":"DNS 운영자는 권한 없는 외부 요청자가 전체 존 정보를 받아갈 가능성을 점검 중이다.\n(1) DNS 존 데이터 전체 전송 프로토콜·질의 유형의 이름을 쓰시오.\n(2) 해당 기능이 유출 위험을 갖는 이유를 설명하시오.\n(3) BIND 환경에서 존 전송을 허용된 보조 서버 192.0.2.54로만 제한할 때 활용하는 지시어를 쓰시오.\n(4) DNS 위조 응답 공격 완화 방안을 두 가지 쓰시오.","a":"(1) AXFR(전체 존 전송), 증분 존 전송은 IXFR\n(2) DNS 내부 호스트명·서비스 구성 등이 외부에 노출될 수 있다.\n(3) allow-transfer { 192.0.2.54; };\n(4) 질의 출발지 포트·트랜잭션 ID 무작위화, DNSSEC 검증 등","e":"DNS Zone Transfer는 정상적인 주·보조 서버 동기화 기능이지만 전송 대상의 접근통제가 필요하다. DNSSEC은 DNS 데이터의 출처 인증과 무결성 검증을 지원한다.","rubric":["AXFR와 IXFR","호스트명 정보 노출","allow-transfer","포트난수화·DNSSEC"],"legal":false,"case":true,"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: DNS 존 전송과 노출 보호\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case11","bank":"case","type":"작업형","area":"02 네트워크 보안","topic":"IPv4 단편화 Offset 계산","q":"IPv4 데이터그램의 IP 헤더가 20바이트이고 원본 IP 페이로드가 3,500바이트이다. MTU=1,500바이트로 IP 단편화가 발생한다(옵션 없음).\n(1) 조각 하나에 넣을 수 있는 최대 IP 데이터 크기를 구하시오.\n(2) 생성되는 조각 개수와 각 데이터 크기를 쓰시오.\n(3) 각 조각의 Fragment Offset 값을 순서대로 쓰시오.\n(4) 조각별 MF 비트를 순서대로 쓰시오.","a":"(1) 1,500-20=1,480바이트\n(2) 3조각: 1,480바이트, 1,480바이트, 540바이트\n(3) 0, 185, 370 (8바이트 단위)\n(4) 1, 1, 0","e":"Offset은 실제 바이트 수가 아니라 8바이트 단위로 기록한다. 마지막 조각을 제외한 조각 데이터 크기는 8의 배수여야 한다.","rubric":["MTU-헤더=1480","3조각 데이터 크기","Offset: 0,185,370","MF: 1,1,0"],"legal":false,"case":true,"lessonIds":["tcp-ip","detection"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: IPv4 단편화 Offset 계산\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case12","bank":"case","type":"작업형","area":"02 네트워크 보안","topic":"IPsec ESP 터널 모드 구조","q":"IPsec ESP 터널 모드로 IPv4 패킷을 보호하려고 한다.\n(1) 원본 IP 패킷 앞에 붙는 대표적인 두 헤더를 순서대로 쓰시오.\n(2) 암호화 적용 시 원본 IP 헤더·상위 계층 데이터가 암호화 범위에 포함되는지 쓰시오.\n(3) 새 외부 IP 헤더가 암호화되는지 쓰시오.\n(4) AH와 ESP의 기밀성 제공 여부를 구분하시오.","a":"(1) 새 외부 IP 헤더 → ESP 헤더\n(2) 예. ESP 터널 모드에서 원본 IP 패킷은 ESP 페이로드로 보호된다.\n(3) 아니요. 패킷 전달을 위한 새 외부 IP 헤더는 ESP 암호화 범위에 포함되지 않는다.\n(4) AH는 기밀성을 제공하지 않으며, ESP는 암호화 기능을 제공할 수 있다.","e":"ESP 터널 모드: 새로운 IP 헤더 / ESP 헤더 / 암호화된 원본 IP 패킷 및 ESP Trailer / 인증 태그(설정 시). 암호화·무결성 범위는 알고리즘 구성에 따라 표현을 정확히 구분한다.","rubric":["새 IP 헤더→ESP 헤더","원본 IP 패킷 암호화","외부 IP 헤더는 암호화 제외","AH와 ESP의 차이"],"legal":false,"case":true,"lessonIds":["ipsec"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: IPsec ESP 터널 모드 구조\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case13","bank":"case","type":"작업형","area":"04 정보보호일반","topic":"TLS 1.3 보안 절차 비교","q":"TLS 통신을 분석하던 담당자가 TLS 1.2 RSA 키 전달 방식과 TLS 1.3의 차이를 설명하려 한다.\n(1) TLS가 제공하는 주요 보안 서비스를 두 가지 쓰시오.\n(2) TLS 1.3에서 일반적인 키 합의 기법을 쓰시오.\n(3) TLS 1.3 0-RTT 데이터의 주된 보안상 주의점을 쓰시오.\n(4) TLS 1.3에서 구형 RSA 키 전달 방식을 사용할 수 있는지 쓰시오.","a":"(1) 기밀성, 무결성(및 서버 인증)\n(2) (EC)DHE 기반 키 합의 또는 PSK 기반 모드\n(3) 0-RTT 초기 데이터는 재전송(Replay) 공격 위험이 있어 상태 변경 등 민감한 요청에 신중해야 한다.\n(4) 사용할 수 없다. TLS 1.3은 정적 RSA 키 전달 방식을 제거했다.","e":"TLS 1.2에서 RSA 키 전달은 구형 일부 구성의 설명이며 TLS 1.3과 혼동하지 않는다. TLS 1.3의 0-RTT는 지연을 낮추지만 재전송 위험이 있다.","rubric":["기밀성·무결성","(EC)DHE 또는 PSK","0-RTT 재전송 위험","TLS 1.3 RSA 키 전달 제거"],"legal":false,"case":true,"lessonIds":["tls-crypto"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: TLS 1.3 보안 절차 비교\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case14","bank":"case","type":"작업형","area":"03 애플리케이션 보안","topic":"이메일 SPF·DKIM·DMARC","q":"외부에서 발신자를 위조한 이메일이 유입되어 보안 담당자가 메일 도메인 인증을 강화하려 한다.\n(1) 송신 서버의 IP가 도메인 정책에 허용되는지 검사하는 표준을 쓰시오.\n(2) 전자서명으로 메일의 무결성·서명 도메인을 검증하는 표준을 쓰시오.\n(3) 도메인 정렬과 처리 정책, 보고를 정의하는 표준을 쓰시오.\n(4) DKIM 검증에 필요한 공개키 정보를 보통 어디에 게시하는지 쓰시오.","a":"(1) SPF\n(2) DKIM\n(3) DMARC\n(4) 발신 도메인의 DNS TXT 레코드","e":"DMARC는 SPF·DKIM의 평가 결과와 헤더 From 도메인의 정렬(alignment)을 확인하며, 정책·보고 체계를 제공한다.","rubric":["SPF","DKIM","DMARC","DNS TXT 공개키"],"legal":false,"case":true,"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: 이메일 SPF·DKIM·DMARC\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case15","bank":"case","type":"작업형","area":"01 시스템 보안","topic":"디지털 증거 무결성","q":"침해사고 현장 저장매체를 수집해 분석 보고서에 첨부하려 한다.\n(1) 수집 과정의 적법성을 강조하는 원칙의 명칭을 쓰시오.\n(2) 수집 당시와 분석 시점의 데이터 일치 여부를 확인하는 방법을 쓰시오.\n(3) 원본을 변조하지 않도록 읽기 전용으로 수집하는 장비·방법을 쓰시오.\n(4) 증거의 이동·분석·보관 과정에서 담당자와 기록을 남기는 원칙의 명칭을 쓰시오.","a":"(1) 정당성의 원칙\n(2) 암호학적 해시값 계산·비교(SHA-256 등)\n(3) 쓰기 방지 장치(Write Blocker) 활용, 원본 보호 및 이미지 사본 분석\n(4) 절차 연속성(Chain of Custody)","e":"포렌식 원칙에는 정당성·무결성·재현성·신속성·절차 연속성이 포함된다. 해시 일치가 증거의 모든 법적 쟁점을 보증하는 것은 아니다.","rubric":["정당성","SHA-256 해시 비교","쓰기 방지·사본 분석","절차 연속성"],"legal":false,"case":true,"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: 디지털 증거 무결성\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case16","bank":"case","type":"작업형","area":"05 정보보호관리 및 법률","topic":"개인정보 접속기록 관리","q":"개인정보처리자는 시스템의 무단 조회와 대량 다운로드 위험을 관리하려 한다.\n(1) 접속기록에 남겨야 할 대표 요소 다섯 가지를 쓰시오.\n(2) 접속기록의 보안 목적 두 가지를 쓰시오.\n(3) 대량 다운로드가 탐지되면 확인해야 할 대표 사실을 쓰시오.\n(4) 보관 기간·점검 주기의 기준을 판단할 때 확인해야 할 법령·문서를 쓰시오.","a":"(1) 식별자, 접속일시, 접속지 정보, 처리한 정보주체 정보, 수행 업무\n(2) 비인가·오남용 행위 탐지 및 사후 추적·사고 조사\n(3) 해당 업무 수행의 정당한 사유와 접근 권한의 적정성\n(4) 시행 당시 개인정보 보호법령, 개인정보의 안전성 확보조치 기준 및 내부관리계획","e":"세부 보관기간·점검 주기·위험분석 예외는 법령의 개정에 따라 바뀔 수 있으므로 과년도 수치를 그대로 암기하지 않는다.","rubric":["접속기록 대표 5항목","오남용 탐지·추적","대량 다운로드 사유 확인","최신 법령 및 내부관리계획"],"legal":true,"case":true,"lessonIds":["privacy"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: 개인정보 접속기록 관리\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]},{"id":"case17","bank":"case","type":"작업형","area":"02 네트워크 보안","topic":"DDoS 반사·증폭 분석","q":"서비스에 대량의 UDP 응답 트래픽이 도착하고, 일부 응답은 상대적으로 작은 요청에 비해 큰 크기로 수신된다.\n(1) 공격자가 피해자 IP로 출발지 주소를 위조한 뒤 제3자 응답을 피해자에게 보내게 하는 공격 특성을 쓰시오.\n(2) 작은 요청 대비 큰 응답이 발생하는 공격 특성을 쓰시오.\n(3) 네트워크 운영자가 수행할 수 있는 대응책 두 가지를 쓰시오.\n(4) 출발지 IP 주소 위조를 줄이기 위한 망 운영상 권고 기법을 쓰시오.","a":"(1) 반사(Reflection) 공격\n(2) 증폭(Amplification) 공격\n(3) 트래픽 분석·속도 제한, DDoS 스크러빙, 상위망 차단·우회, 불필요한 UDP 서비스 차단 등 중 두 가지\n(4) BCP 38 기반 출발지 주소 검증(Ingress Filtering)","e":"반사와 증폭은 서로 다른 특성이지만 결합될 수 있다. 피해자를 속인 발신자로 만드는 소스 IP 스푸핑이 주요 메커니즘 중 하나다.","rubric":["반사 공격","증폭 공격","대응책 2종","BCP38 Ingress Filtering"],"legal":false,"case":true,"lessonIds":["ddos"],"detailedAnswer":"① 문제 조건과 자산/로그의 특징 식별: DDoS 반사·증폭 분석\n② 명령·설정 또는 공격 기법은 정답의 (1)~(4) 순서대로 제시한다.\n③ 원인과 결과를 연결하고 해당 기술이 무엇을 검사/차단하는지 명시한다.\n④ 검증 결과와 오탐·권한·버전 등의 한계를 적으면 실무형 완성도가 높아진다.","explainSteps":["문제의 로그/설정에서 실제 관찰된 값과 추정 내용을 분리한다.","물음 (1)~(4)에 맞추어 명령어·설정값·취약점/원인을 각각 독립적으로 답한다.","보완 후 적용 여부를 확인하는 명령 또는 후속 로그 검증을 제시한다."]}];

선택한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["detection"],"refUrl":"https://docs.snort.org/rules/options/"},{"id":"x12","bank":"advanced","type":"단답형","area":"02 네트워크 보안","topic":"DDoS","q":"UDP 1900번 포트를 이용한 반사·증폭 공격과 관련된 서비스 탐색 프로토콜은?","a":"SSDP","e":"SSDP는 네트워크 장치 서비스 검색에 사용되며 잘못 노출되면 증폭 자원이 될 수 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["ddos"],"refUrl":"https://www.rfc-editor.org/rfc/rfc2827.html"},{"id":"x13","bank":"advanced","type":"단답형","area":"03 애플리케이션 보안","topic":"SQL 인젝션","q":"SQL 질의에서 사용자 데이터를 SQL 코드와 분리하는 대표 방어 기법은?","a":"준비된 질의(Prepared Statement)와 파라미터 바인딩","e":"정렬 방향·테이블명 등 SQL 구조 요소는 별도 허용목록으로 처리한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["sql-injection"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"},{"id":"x14","bank":"advanced","type":"단답형","area":"03 애플리케이션 보안","topic":"웹 캐시","q":"HTTP 응답을 캐시에 저장하지 않도록 지시하는 Cache-Control 지시자는?","a":"no-store","e":"no-cache는 캐시 저장 금지가 아니라 재사용 전에 검증하라는 의미이다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["http-sec"],"refUrl":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control"},{"id":"x15","bank":"advanced","type":"단답형","area":"03 애플리케이션 보안","topic":"쿠키","q":"브라우저 자바스크립트의 document.cookie 접근을 제한하는 쿠키 속성은?","a":"HttpOnly","e":"Secure는 HTTPS 전송, SameSite는 교차 사이트 쿠키 전송을 제한한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["xss-csrf"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"},{"id":"x16","bank":"advanced","type":"단답형","area":"03 애플리케이션 보안","topic":"웹 인증","q":"OAuth 2.0 기반으로 사용자 로그인·인증을 표준화한 인증 계층은?","a":"OpenID Connect(OIDC)","e":"OAuth 2.0 자체는 인가 프레임워크이고 OIDC는 ID Token을 추가한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["auth-sessions"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"id":"x17","bank":"advanced","type":"단답형","area":"03 애플리케이션 보안","topic":"공급망","q":"소프트웨어 구성 요소와 의존성을 기록하는 자재명세서의 약어는?","a":"SBOM","e":"Software Bill of Materials. 취약 라이브러리 식별과 구성 관리에 활용한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["owasp25"],"refUrl":"https://top10.owasp.org/2025/"},{"id":"x18","bank":"advanced","type":"단답형","area":"03 애플리케이션 보안","topic":"OWASP 2025","q":"OWASP Top 10:2025의 A03 범주 명칭은?","a":"Software Supply Chain Failures(소프트웨어 공급망 실패)","e":"2021년의 취약하거나 오래된 구성요소를 넘어 공급망 전체 위험을 다룬다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["owasp25"],"refUrl":"https://top10.owasp.org/2025/"},{"id":"x19","bank":"advanced","type":"단답형","area":"03 애플리케이션 보안","topic":"OWASP 2025","q":"OWASP Top 10:2025에서 비정상 상황에 대한 잘못된 오류 처리·Fail-open을 다루는 범주는?","a":"A10 Mishandling of Exceptional Conditions","e":"예외 처리 누락이 접근통제 우회·정보 노출을 낳을 수 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["owasp25"],"refUrl":"https://top10.owasp.org/2025/"},{"id":"x20","bank":"advanced","type":"단답형","area":"04 정보보호일반","topic":"TLS 1.3","q":"TLS 1.3에서 암호화와 무결성 검증을 함께 제공하는 암호 운용 방식은?","a":"AEAD","e":"예: AES-GCM, ChaCha20-Poly1305. 구형 CBC+HMAC 조합과 구분한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["tls-crypto"],"refUrl":"https://www.rfc-editor.org/rfc/rfc8446.html"},{"id":"x21","bank":"advanced","type":"단답형","area":"04 정보보호일반","topic":"암호학","q":"TLS 1.3에서 서버와 클라이언트가 공유 비밀을 수립할 때 사용하는 대표 (타원곡선) 임시 키 교환은?","a":"(EC)DHE","e":"정확한 핸드셰이크 구성은 PSK 등 선택 사항에 따라 달라질 수 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["tls-crypto"],"refUrl":"https://www.rfc-editor.org/rfc/rfc8446.html"},{"id":"x22","bank":"advanced","type":"단답형","area":"05 정보보호관리 및 법률","topic":"재해복구","q":"업무 복구 완료 목표 시간을 뜻하는 약어와 허용 가능한 데이터 손실 시점을 뜻하는 약어는?","a":"RTO, RPO","e":"RTO=시간 내 서비스 복구 목표, RPO=복원 가능한 데이터 시점의 허용 간격.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["risk-bcp"],"refUrl":"https://csrc.nist.gov/projects/risk-management"},{"id":"x23","bank":"advanced","type":"단답형","area":"05 정보보호관리 및 법률","topic":"인증 정책","q":"NIST SP 800-63B-4에서 비밀번호만 사용하는 단일요소 인증의 최소 비밀번호 길이는?","a":"15자","e":"기관별 법령 의무와 다르며, MFA와 함께 사용하는 경우 최소 8자를 허용한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["nistpassword"],"refUrl":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"id":"x24","bank":"advanced","type":"단답형","area":"05 정보보호관리 및 법률","topic":"공격 분류","q":"MITRE ATT&CK에서 Windows LSASS 메모리의 자격증명 덤프 기술 ID는?","a":"T1003.001","e":"Credential Access 전술 아래 OS Credential Dumping의 하위 기술이다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","lessonIds":["modern-threat"],"refUrl":"https://attack.mitre.org/techniques/T1003/001/"},{"id":"x25","bank":"advanced","type":"서술형","area":"01 시스템 보안","topic":"권한 점검","q":"SetUID·SetGID·Sticky Bit의 목적을 비교하고 위험한 특수권한 파일을 점검하는 방법을 서술하시오.","a":"SetUID는 실행 파일을 소유자의 유효 UID 권한으로, SetGID는 소유 그룹의 유효 GID로 실행한다. 디렉터리 SetGID는 그룹 상속에 관여하며 Sticky Bit는 공용 디렉터리에서 타인이 소유한 파일 삭제·이름 변경을 제한한다. find / -type f -perm /6000으로 특수권한 파일을 목록화한 뒤 소유자·용도·실행 권한을 검증한다.","e":"공격자가 쓸 수 있는 특수권한 프로그램은 권한 상승 통로가 될 수 있다. 무조건 전부 제거하기보다 필요한 기능을 파악하고 과다 권한을 최소화한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SetUID: 유효 UID와 소유자 권한","SetGID: 유효 GID·디렉터리 그룹 상속","Sticky Bit: 공용 디렉터리 삭제 제한","find 검색과 과도 권한 점검"],"lessonIds":["linux-perm"],"refUrl":"https://man7.org/linux/man-pages/man1/chmod.1.html"},{"id":"x26","bank":"advanced","type":"서술형","area":"01 시스템 보안","topic":"계정 인증","q":"/etc/passwd, /etc/shadow, PAM의 역할과 패스워드 로그인 실패 잠금 설정 절차를 설명하시오.","a":"/etc/passwd에는 계정명·UID·GID·홈·로그인 셸 등이 저장되며 암호 필드는 일반적으로 x이다. 실제 비밀번호 해시·만료 정보는 /etc/shadow에 저장한다. PAM은 서비스별 auth/account/password/session 인증 정책을 정의한다. pam_faillock 연결과 /etc/security/faillock.conf의 deny·unlock_time을 구성한 뒤 실제 로그인 실패 및 정상 해제 여부를 검증한다.","e":"PAM 배포판 파일 경로는 다를 수 있다. faillock.conf 값만 적으면 실제 PAM 스택에 모듈이 없는 환경에서는 잠금이 적용되지 않을 수 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["passwd와 shadow 저장 정보 구분","PAM 모듈의 인증 정책 역할","deny와 unlock_time 설정","실효성 점검과 배포판 차이"],"lessonIds":["linux-auth"],"refUrl":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"id":"x27","bank":"advanced","type":"서술형","area":"01 시스템 보안","topic":"포렌식","q":"백도어 의심 프로세스의 실행파일이 삭제되었는데 PID가 살아 있는 상황에서 원인과 확인 순서를 설명하시오.","a":"리눅스에서 실행 파일 경로가 삭제되어도 이미 매핑된 프로세스가 계속 실행할 수 있다. ps -ef 또는 /proc/PID/status로 상태를 확인하고 /proc/PID/exe 링크, /proc/PID/cmdline의 인수, /proc/PID/fd, ss -ntp의 네트워크 연결 등을 상관분석한다. 파일 획득 시에는 원본 변경을 피하고 해시·시간·보관 이력을 남긴다.","e":"/proc은 디스크에 복사된 실행 파일 저장소가 아니다. 삭제된 실행파일이 언제나 온전히 복구되는 것도 아니다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["삭제 후 실행이 가능한 이유","/proc/PID/exe·cmdline의 용도","fd·네트워크·로그 추가 조사","증거 보존과 단정 금지"],"lessonIds":["linux-logs"],"refUrl":"https://man7.org/linux/man-pages/man5/proc.5.html"},{"id":"x28","bank":"advanced","type":"서술형","area":"01 시스템 보안","topic":"Windows 침해","q":"4625 다수 발생 후 4624 성공 및 비정상 PowerShell 4688 생성이 관찰되었다. 분석과 조치 방안을 서술하시오.","a":"4625는 로그인 실패, 4624는 성공, 4688은 프로세스 생성 감사 이벤트다. 같은 사용자·IP·로그온 유형·시간대·프로세스 부모 관계가 이어지는지 확인한다. 성공 후 비정상 PowerShell 실행이 연관되면 무차별 로그인 시도 후 침해 가능성을 의심하되 확정하지 않는다. 계정 보호·세션 차단·증거 보존·EDR/네트워크 조사·추가 이상행위 탐지를 실시한다.","e":"이벤트 번호만 보고 공격이 성공했다고 단정하지 않으며 감사 정책·로그 부재를 고려한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["세 이벤트 ID 의미","사용자/IP/시간 연계 분석","공격 가설과 검증 필요성","격리·계정·증거 대응"],"lessonIds":["windows-evidence"],"refUrl":"https://attack.mitre.org/techniques/T1003/001/"},{"id":"x29","bank":"advanced","type":"서술형","area":"01 시스템 보안","topic":"원격 접속","q":"SSH 서버의 보안 설정 4가지와 안전한 변경 적용 절차를 서술하시오.","a":"PermitRootLogin no로 root 직접 원격 로그인을 제한하고, 키 인증 도입 후 PasswordAuthentication no를 검토하며, AllowUsers/AllowGroups·방화벽으로 접속 주체와 경로를 제한한다. 로그인 감사·MFA를 병행한다. 설정 적용 전 sshd -t 구문 점검, 관리자 예비 세션 유지, 서비스 재적용 및 로그 검증 순서로 진행한다.","e":"무턱대고 암호 인증을 끄면 원격 관리자가 시스템에 접근할 수 없으므로 키 등록 확인을 먼저 수행한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["root 직접 접속 제한","인증 강화 및 접근 대상 제한","네트워크·로그 보호","구문검사·예비 세션·검증"],"lessonIds":["linux-ssh"],"refUrl":"https://man.openbsd.org/sshd_config"},{"id":"x30","bank":"advanced","type":"서술형","area":"02 네트워크 보안","topic":"TCP 분석","q":"SYN Flood와 UDP 증폭·반사 공격의 공격 흐름을 비교하고 각 방어방법을 서술하시오.","a":"SYN Flood는 3-way handshake의 미완료 상태를 대량 생성하여 연결 대기 자원을 고갈시킨다. SYN cookies·대기열 조정·rate limit·상위 장비를 고려한다. UDP 반사·증폭은 출발지 IP를 피해자로 위조해 공개 리플렉터가 큰 응답을 보내도록 하며, 소스 IP 위조 방지(BCP38), 리플렉터 설정 강화, DDoS 보호/스크러빙으로 대응한다.","e":"모든 UDP 트래픽이 증폭 공격인 것은 아니며 실제 요청/응답 크기·IP 위조 징후를 확인한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SYN half-open 원리","SYN cookies·rate limit","UDP 소스 위조·반사증폭","BCP38 및 증폭원 차단"],"lessonIds":["ddos"],"refUrl":"https://www.rfc-editor.org/rfc/rfc2827.html"},{"id":"x31","bank":"advanced","type":"서술형","area":"02 네트워크 보안","topic":"DNS 보안","q":"DNS 캐시 포이즈닝과 DNSSEC의 관계 및 DNSSEC이 제공하지 않는 보호 기능을 설명하시오.","a":"DNS 캐시 포이즈닝은 위조된 레코드가 리졸버 캐시에 저장되어 사용자를 다른 목적지로 유도하는 공격이다. DNSSEC은 DNS 레코드의 디지털서명과 검증 체인을 통해 출처 인증과 무결성을 지원한다. DNSSEC만으로 DNS 질의·응답 내용의 기밀성이나 모든 중간자 공격·서비스 거부를 막지는 못하며, 운영상 서명·키 관리가 필요하다.","e":"DNSSEC을 HTTPS나 DNS over TLS/HTTPS의 트래픽 암호화 기능과 혼동하지 않는다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["캐시 포이즈닝 정의","DNSSEC 서명·체인 검증","무결성과 기밀성 구분","키 관리 및 보호 한계"],"lessonIds":["arp-dns"],"refUrl":"https://www.rfc-editor.org/rfc/rfc7489.html"},{"id":"x32","bank":"advanced","type":"서술형","area":"02 네트워크 보안","topic":"이메일 보안","q":"SPF·DKIM·DMARC의 검증 대상과 상호 보완 관계를 설명하시오.","a":"SPF는 Envelope From/HELO 도메인의 정책에 따라 발송 서버 IP가 허용되었는지 검사한다. DKIM은 전자서명으로 지정 헤더와 본문의 변조 여부 및 서명 도메인을 확인한다. DMARC는 표시 From 도메인과 SPF 또는 DKIM 결과의 도메인 정렬을 검사해 none/quarantine/reject 정책 및 보고를 적용한다. 둘 중 하나의 정렬된 인증 성공이 DMARC 통과에 충분할 수 있다.","e":"SPF pass와 헤더 From 일치 여부는 별개다. 메일 전달·메일링리스트 환경에서 DKIM이나 SPF 결과가 달라질 수 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SPF 검증 대상","DKIM 서명 의미","DMARC 정렬·정책","우회·전달 시 주의"],"lessonIds":["arp-dns"],"refUrl":"https://www.rfc-editor.org/rfc/rfc7489.html"},{"id":"x33","bank":"advanced","type":"서술형","area":"02 네트워크 보안","topic":"IDS/IPS","q":"IDS와 IPS의 차이를 설명하고 Snort 탐지 룰의 msg·content·sid·rev 의미를 서술하시오.","a":"IDS는 관찰 트래픽에서 규칙·이상징후를 탐지·경보하고, IPS는 통신 경로상에서 차단 조치를 수행할 수 있다. Snort 룰의 msg는 경보 메시지, content는 검사 버퍼의 바이트 패턴, sid는 룰 식별 번호, rev는 룰 개정 번호이다. HTTP URI만 검사하려면 Snort3의 http_uri sticky buffer를 선택하고 매칭 범위를 지정한다.","e":"경고(alert) 룰이 자동으로 패킷을 차단한다고 단정할 수 없다. 시스템의 동작 모드와 action에 달려 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["IDS와 IPS 동작 차이","msg·content","sid·rev","HTTP 버퍼·오탐 검증"],"lessonIds":["detection"],"refUrl":"https://docs.snort.org/rules/options/"},{"id":"x34","bank":"advanced","type":"서술형","area":"02 네트워크 보안","topic":"무선 보안","q":"WEP, WPA2, WPA3-Personal의 인증과 암호화 방식을 보안성 관점에서 비교하시오.","a":"WEP은 RC4와 짧은 초기화 벡터 등 설계상 결함으로 취약하다. WPA2-Personal은 PSK 기반 4-way handshake와 AES-CCMP를 활용한다. WPA3-Personal은 SAE를 활용해 오프라인 사전 공격에 대한 내성을 강화하고 보호된 관리 프레임 등 안전한 설정을 고려한다. 보안성은 실제 구현과 설정·패스프레이즈·업데이트에 따라 달라진다.","e":"WPA2가 항상 TKIP을 쓴다고 착각하거나 WPA3가 모든 공격을 원천 차단한다고 서술하지 않는다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["WEP RC4·취약성","WPA2 PSK/AES-CCMP","WPA3 SAE","운영상 주의"],"lessonIds":["tcp-ip"],"refUrl":"https://www.rfc-editor.org/rfc/rfc791.html"},{"id":"x35","bank":"advanced","type":"서술형","area":"03 애플리케이션 보안","topic":"SQL 인젝션","q":"검색·정렬 기능에 SQL Injection 취약점이 있을 때 값 바인딩과 허용목록 검증을 구분해 서술하시오.","a":"WHERE id=? 처럼 데이터값은 준비된 질의의 바인딩 인수로 전달해 SQL 구조와 분리한다. 정렬 열 이름이나 ASC/DESC 등 SQL 문법 구성요소는 파라미터로 바인딩할 수 없으므로 서버가 미리 정의한 값 목록으로 치환한다. DB 최소 권한, 입력 길이 검사, 오류 노출 제한, 비정상 질의 탐지를 추가한다.","e":"사용자가 입력한 ORDER BY 텍스트를 SQL 뒤에 그대로 붙이면 WHERE만 바인딩해도 안전하지 않다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SQL 코드/데이터 구분","WHERE 값 바인딩","정렬 열·방향 허용목록","최소 권한·에러 처리"],"lessonIds":["sql-injection"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"},{"id":"x36","bank":"advanced","type":"서술형","area":"03 애플리케이션 보안","topic":"XSS/CSRF","q":"저장형 XSS와 CSRF의 실행 주체·목적·대응 기술을 비교하시오.","a":"저장형 XSS는 저장된 악성 스크립트가 피해자 브라우저에서 실행되어 세션 이용·정보 변조 등을 유발할 수 있다. 대응은 출력 문맥별 인코딩·안전한 HTML 정화·CSP이다. CSRF는 정상 로그인 상태의 피해자 브라우저를 이용하여 인증 쿠키가 포함된 원치 않는 상태 변경 요청을 보내는 공격이다. 대응은 서버측 CSRF 토큰·Origin 검사·SameSite 등이다.","e":"HttpOnly는 쿠키를 자바스크립트로 읽는 것을 줄이지만 XSS 자체를 막는 것은 아니며 POST만으로 CSRF 방어 불가.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["저장형 XSS 흐름","XSS 인코딩·CSP","CSRF 인증 세션 악용","CSRF 토큰·Origin·SameSite"],"lessonIds":["xss-csrf"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"},{"id":"x37","bank":"advanced","type":"서술형","area":"03 애플리케이션 보안","topic":"서버 요청 위조","q":"이미지 URL 프록시 기능에서 SSRF 공격이 발생하는 이유와 필요한 서버측 통제 4가지를 서술하시오.","a":"사용자 지정 URL을 서버가 직접 요청하는 구조라면 공격자가 사설 IP·루프백·클라우드 메타데이터 서비스 등으로 요청을 유도할 수 있다. 허용 프로토콜·호스트 목록, IP와 DNS 해석 결과 검증, 리다이렉션 재검증/제한, 내부망·메타데이터 주소 차단 등 네트워크 egress 정책을 적용한다.","e":"문자열 contains(허용도메인)만으로 서브도메인 위장·리다이렉션·DNS 리바인딩 위험을 해결하지 못한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SSRF 서버측 요청 문제","허용 프로토콜·호스트","DNS·리다이렉션 검증","네트워크 접근 제한"],"lessonIds":["ssrf-xxe"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"},{"id":"x38","bank":"advanced","type":"서술형","area":"03 애플리케이션 보안","topic":"파일 업로드","q":"사용자 파일 업로드 기능의 공격 경로와 다층 방어 방법 4가지를 서술하시오.","a":"웹루트에 업로드된 실행 가능한 파일이 서버에서 실행되거나 악성 콘텐츠가 서비스될 수 있다. 허용 확장자와 MIME·파일 시그니처를 검사하고 업로드 크기를 제한한다. 파일을 웹루트 밖에 무작위 이름으로 저장하고 실행권한을 제거한다. 제공 시 안전한 Content-Type·Content-Disposition을 지정하고 백신·CDR 등 후속 처리를 검토한다.","e":"클라이언트 측 검사만으로는 우회 가능하며 업로드 파일명 그대로 저장하면 경로 조작·충돌 위험이 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["실행·콘텐츠 제공 위험","서버측 내용 검증","저장 위치·권한 분리","안전한 제공·후속 처리"],"lessonIds":["ssrf-xxe"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"},{"id":"x39","bank":"advanced","type":"서술형","area":"03 애플리케이션 보안","topic":"접근통제","q":"/orders/100에서 /orders/101로 URL만 바꾸자 다른 사용자의 주문이 노출되었다. 취약점과 보완책을 서술하시오.","a":"서버측 객체 단위 인가 검사가 누락된 IDOR/BOLA(Broken Object Level Authorization)로 볼 수 있다. 서버는 인증된 주체가 해당 객체를 읽거나 수정할 권한이 있는지 요청마다 검사해야 한다. 추측 어려운 ID 사용이나 화면 버튼 숨김은 보조 대책일 뿐 근본 방어는 아니다. 접근 거부 로그와 자동 인가 테스트를 추가한다.","e":"사용자 인증 성공이 곧 모든 객체 열람 권한을 주는 것은 아니다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["IDOR/BOLA 식별","객체 소유권 서버측 검사","우회 대책의 한계","테스트·감사 로그"],"lessonIds":["auth-sessions"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"id":"x40","bank":"advanced","type":"서술형","area":"03 애플리케이션 보안","topic":"OWASP 2025","q":"OWASP Top 10:2025에서 공급망 실패(A03)와 부적절한 예외 처리(A10)의 위험·대응을 비교하시오.","a":"A03은 의존성 패키지, 빌드 도구, CI/CD, 배포 경로의 신뢰가 깨져 악성 코드가 공급되는 위험이다. SBOM·의존성 고정·서명/무결성 검증·빌드 권한분리로 완화한다. A10은 장애·잘못된 입력 등 예외 상황에서 fail-open으로 접근을 허용하거나 내부 정보를 노출하는 위험이다. 예외 상황에서 기본 거부, 안전한 오류 메시지, 일관된 예외 처리·테스트로 줄인다.","e":"업데이트하지 않은 패키지만을 공급망 문제로 한정하지 않는다. 2025년 분류는 2021년 분류와 명칭·순위가 다르다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["A03 공급망 범위","A03 보호대책","A10 fail-open 등 원인","A10 안전한 예외 처리"],"lessonIds":["owasp25"],"refUrl":"https://top10.owasp.org/2025/"},{"id":"x41","bank":"advanced","type":"서술형","area":"03 애플리케이션 보안","topic":"OAuth/OIDC","q":"OAuth 2.0과 OpenID Connect의 목적과 액세스 토큰·ID 토큰의 사용 차이를 서술하시오.","a":"OAuth 2.0은 제3자 앱이 자원 접근을 위임받는 인가 프레임워크이며 액세스 토큰은 자원 서버에서 권한을 사용하기 위한 것이다. OIDC는 OAuth 위에 사용자 인증·ID Token 체계를 추가하며 ID Token은 클라이언트가 사용자 인증 결과를 확인하는 데 사용한다. 토큰의 발급자·수신자·유효기간·서명을 검증하고 state/nonce 등을 적절하게 적용한다.","e":"ID Token을 API 접근용 토큰처럼 보내는 것은 목적이 다르므로 피한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["OAuth 인가 목적","OIDC 인증 기능","Access vs ID Token","토큰 검증 및 state/nonce"],"lessonIds":["auth-sessions"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"id":"x42","bank":"advanced","type":"서술형","area":"04 정보보호일반","topic":"IPsec","q":"IPsec의 AH와 ESP, 전송모드와 터널모드를 비교하고 VPN 적용 사례를 설명하시오.","a":"AH는 데이터 무결성·출처 인증·재전송 공격 보호를 제공하나 기밀성은 없다. ESP는 암호화를 통한 기밀성을 제공하고 인증된 구성에서 무결성도 보호한다. 전송모드는 원 IP 헤더를 유지하며 상위 계층 페이로드를 보호하고 터널모드는 원 IP 패킷 전체를 캡슐화하고 새 IP 헤더를 붙인다. 사이트 간 VPN에는 ESP 터널모드가 흔하다.","e":"AH가 공개키 암호로 데이터를 암호화한다는 설명은 잘못이다. ESP 인증 범위는 모드·알고리즘에 따라 달라진다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["AH·ESP 서비스 구분","전송모드 동작","터널모드 동작","VPN 사례와 제약"],"lessonIds":["ipsec"],"refUrl":"https://www.rfc-editor.org/rfc/rfc4303.html"},{"id":"x43","bank":"advanced","type":"서술형","area":"04 정보보호일반","topic":"TLS 1.3","q":"TLS 1.3 핸드셰이크에서 인증서 검증·키 교환·AEAD가 담당하는 보안 속성을 각각 설명하시오.","a":"서버 인증서와 신뢰 사슬·호스트명 검증은 서버 신원 확인을 지원한다. (EC)DHE/PSK 기반 비밀 도출을 통해 통신 키를 합의하고 Finished 메시지로 핸드셰이크 무결성을 확인한다. 이후 AES-GCM, ChaCha20-Poly1305 등의 AEAD를 이용하여 애플리케이션 데이터의 기밀성·무결성 검증을 수행한다. 구성에 따라 0-RTT 초기 데이터는 재전송 위험을 고려한다.","e":"TLS 1.3은 구형 RSA 키 전달 방식을 지원하지 않는다는 점을 TLS 1.2와 구분한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["인증서·호스트명 검증","키 교환·Finished","AEAD 기능","TLS 1.3 특성과 0-RTT 주의"],"lessonIds":["tls-crypto"],"refUrl":"https://www.rfc-editor.org/rfc/rfc8446.html"},{"id":"x44","bank":"advanced","type":"서술형","area":"05 정보보호관리 및 법률","topic":"위험평가","q":"정량적 위험분석의 SLE, ARO, ALE를 정의하고 위험 감소·전가·수용·회피의 차이를 서술하시오.","a":"SLE는 한 번 사고가 발생했을 때의 예상 손실(자산가치×노출계수), ARO는 연간 발생 예상 횟수, ALE는 연간 예상 손실(SLE×ARO)이다. 위험 감소는 보안통제 적용, 전가는 보험·계약 등으로 손실 부담 일부 이전, 수용은 잔여 위험을 인지하고 받아들임, 회피는 위험을 야기하는 활동 중단 등을 뜻한다.","e":"위험 전가는 책임 전체가 사라진다는 뜻이 아니다. 정량값은 가정의 불확실성이 크므로 민감도를 고려한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SLE 정의","ARO·ALE 관계","감소·전가","수용·회피와 한계"],"lessonIds":["risk-bcp"],"refUrl":"https://csrc.nist.gov/projects/risk-management"},{"id":"x45","bank":"advanced","type":"서술형","area":"05 정보보호관리 및 법률","topic":"디지털 포렌식","q":"디지털 증거 확보의 무결성·절차연속성·재현성 원칙을 설명하고 실제 조치 예시를 서술하시오.","a":"무결성은 수집·분석 과정에서 증거가 변경되지 않았음을 입증할 수 있어야 한다는 원칙이다. 원본과 사본의 SHA-256 등 해시값을 기록하고 원본에 대한 쓰기를 제한한다. 절차연속성은 증거의 수집·인계·보관·분석 담당자와 시간을 기록하는 Chain of Custody로 구현한다. 재현성은 같은 절차와 입력으로 결과를 반복 검증할 수 있도록 도구·버전·명령·로그를 문서화하는 것이다.","e":"해시값 동일성만으로 모든 법적 적법성과 해석 정확성이 자동 보장되는 것은 아니다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["무결성 원칙·해시","절차연속성·인계기록","재현성·도구 기록","증거 취급 유의"],"lessonIds":["forensics"],"refUrl":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"id":"x46","bank":"advanced","type":"서술형","area":"05 정보보호관리 및 법률","topic":"개인정보 보호","q":"2026-07-01 개인정보 안전성 확보조치 기준의 인터넷망 차단 조치 대상 판단 요소와 예외 시 확인 사항을 서술하시오.","a":"고시 제6조의2에 따라 전년도 말 기준 직전 3개월간 저장·관리된 이용자 수의 일일평균이 100만명 이상인지 확인한다. 개인정보처리시스템의 접근권한 설정 담당자, 다운로드·파기 가능 취급자의 컴퓨터 등이 대상인지 분류한다. 일부 다운로드/파기 업무는 내부관리계획의 위험분석으로 예외를 검토할 수 있으나 민감정보 등 법령상 예외가 불가능한 범위를 구분해야 한다.","e":"고시가 정한 조건을 단순히 개인정보 취급자 전체 100만명 이상으로 읽으면 틀리다. 최신 조문·부칙을 확인한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["100만명 일평균 이용자 기준","업무/권한 대상 식별","위험분석 예외 요건","예외 제한 및 법령 시점"],"lessonIds":["privacy"],"refUrl":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000281400"},{"id":"x47","bank":"advanced","type":"서술형","area":"05 정보보호관리 및 법률","topic":"침해사고 대응","q":"NIST SP 800-61r3 관점에서 사고 대응이 조직 위험관리와 결합되는 방식을 단계별 사례와 함께 설명하시오.","a":"침해사고 대응은 준비·탐지/분석·봉쇄·제거·복구·사후 개선 활동을 포함한다. NIST SP 800-61r3는 이를 CSF 2.0의 Govern/Identify/Protect/Detect/Respond/Recover 기능과 통합한 위험관리 관점에서 다룬다. 사건 발생 전 로깅·연락망·훈련을 준비하고, 탐지 후 증거와 영향도를 분석하고, 확산 차단 및 원인 제거 후 정상 복구 검증, 결과를 통제 개선에 환류한다.","e":"과거 NIST 800-61r2의 단계도 시험 자료에 나타날 수 있으므로 명칭과 버전을 명시한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["사전 준비·위험관리","탐지·분석","봉쇄·제거·복구","CSF2.0 연계·환류"],"lessonIds":["forensics"],"refUrl":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"id":"x48","bank":"advanced","type":"작업형","area":"01 시스템 보안","topic":"권한·umask","q":"백업 디렉터리 /backup을 root만 읽고 쓰며 진입할 수 있게 하고, 새로 생성되는 파일이 기본 600, 디렉터리가 700이 되도록 설정하시오. (1) umask 값 (2) /backup의 chmod 명령 (3) 산출 원리 (4) 점검 명령을 쓰시오.","a":"(1) umask 077\n(2) chmod 700 /backup\n(3) 파일 666 & ~077 = 600, 디렉터리 777 & ~077 = 700\n(4) umask; ls -ld /backup","e":"실제 생성 권한은 프로그램이 요청한 mode와 umask의 비트 연산으로 결정된다. 기존 파일 권한은 umask만 변경해도 바뀌지 않으므로 chmod 별도 실행.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["umask 077","chmod 700 /backup","666/777 비트 제거 원리","umask·ls -ld 점검"],"lessonIds":["linux-perm"],"refUrl":"https://man7.org/linux/man-pages/man1/chmod.1.html"},{"id":"x49","bank":"advanced","type":"작업형","area":"01 시스템 보안","topic":"특수권한 파일","q":"다음 설정을 수행하시오. (1) /srv/share 공용 디렉터리 생성 후 Sticky Bit 포함 1777 부여 (2) SetUID 일반 파일 검색 (3) SetUID 또는 SetGID 일반 파일 검색 (4) -rwsr-xr-x 의 소문자 s 의미 설명.","a":"(1) mkdir -p /srv/share && chmod 1777 /srv/share\n(2) find / -type f -perm -4000 2>/dev/null\n(3) find / -type f -perm /6000 2>/dev/null\n(4) 소유자 실행(x)과 SUID 비트가 모두 설정됨; 실행 시 해당 파일 소유자의 유효 UID로 실행됨.","e":"검색 결과를 삭제하기보다 파일 소유자·접근권한·업무 필요성을 확인하는 것이 원칙이다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["1777 설정","SetUID 검색 -4000","둘 중 하나 /6000","rws 위치와 유효 UID"],"lessonIds":["linux-perm"],"refUrl":"https://man7.org/linux/man-pages/man1/chmod.1.html"},{"id":"x50","bank":"advanced","type":"작업형","area":"01 시스템 보안","topic":"로그 증거 수집","q":"리눅스 웹 서버에서 의심 계정 접속이 있었다. (1) 현재 로그인 계정 (2) 성공 로그인 내역 (3) 실패 로그인 내역 (4) SSH 인증 로그의 대표 경로 두 가지를 쓰시오.","a":"(1) who 또는 w\n(2) last\n(3) lastb\n(4) /var/log/auth.log(일부 Debian/Ubuntu), /var/log/secure(일부 RHEL 계열)","e":"last/lastb는 각각 wtmp/btmp를 참고한다. systemd-journald를 사용하는 환경에서는 journalctl -u sshd 등의 로그도 상호 확인한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["who/w","last","lastb","auth.log/secure와 배포판 구분"],"lessonIds":["linux-logs"],"refUrl":"https://man7.org/linux/man-pages/man5/proc.5.html"},{"id":"x51","bank":"advanced","type":"작업형","area":"01 시스템 보안","topic":"삭제 프로세스","q":"/proc/5900/exe -> /usr/local/bin/svc (deleted)이고 외부 TCP 연결이 유지된다. (1) 파일이 삭제됐어도 실행되는 이유 (2) 인수 확인 파일 (3) 네트워크 연결 명령 (4) 증거 보존 조치를 답하시오.","a":"(1) 프로세스에 매핑된 실행 코드가 남아 실행을 지속할 수 있음\n(2) /proc/5900/cmdline\n(3) ss -ntp (권한 필요)\n(4) 원본 수정 최소화, 프로세스·메모리·파일·네트워크 정보 기록, 해시와 조사시각·담당자 기록","e":"백도어임은 단순 deleted 표시만으로 확정되지 않으며 정상 업데이트 중 삭제된 실행 파일도 해당될 수 있다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["deleted 의미","/proc/5900/cmdline","ss -ntp","증거 무결성·추가 조사"],"lessonIds":["linux-logs"],"refUrl":"https://man7.org/linux/man-pages/man5/proc.5.html"},{"id":"x52","bank":"advanced","type":"작업형","area":"01 시스템 보안","topic":"PAM 잠금 설정","q":"Linux의 /etc/security/faillock.conf에 다음 정책을 적용한다. 인증 5회 실패 시 잠금, 10분 후 자동 해제. (1) 항목 두 줄 (2) 연계할 PAM 모듈명 (3) 확인 방법 (4) 적용 시 주의사항을 쓰시오.","a":"(1) deny = 5 / unlock_time = 600\n(2) pam_faillock.so\n(3) faillock --user 계정명 또는 실제 실패 로그인 후 정책 적용 확인\n(4) 배포판 PAM 스택 적용 여부와 root 정책, 우회 로그인 경로를 검토","e":"faillock.conf 설정만 변경하는 것이 곧 적용을 의미하지 않는다. /etc/pam.d의 모듈 연결이 필요하다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["deny=5","unlock_time=600","pam_faillock.so","검증·주의사항"],"lessonIds":["linux-auth"],"refUrl":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"id":"x53","bank":"advanced","type":"작업형","area":"01 시스템 보안","topic":"Windows 이벤트","q":"보안 이벤트 로그에서 4625가 15건 발생한 뒤 4624 성공 로그가 있다. Sysmon에는 동일 계정의 의심 프로세스 이벤트가 있다. (1) 4625 의미 (2) 4624 의미 (3) Sysmon 프로세스 생성 ID (4) 확인할 상관 분석 항목 3개를 쓰시오.","a":"(1) 로그온 실패\n(2) 로그온 성공\n(3) Sysmon Event ID 1\n(4) 계정·출발지IP·시간대·로그온 유형·부모/자식 프로세스 관계 중 3개","e":"실패 후 성공은 공격 가능성의 징후이지 그 자체로 침해 확정 증거가 아니다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["4625 실패","4624 성공","Sysmon 1","추가 분석 지표 3개"],"lessonIds":["windows-evidence"],"refUrl":"https://attack.mitre.org/techniques/T1003/001/"},{"id":"x54","bank":"advanced","type":"작업형","area":"01 시스템 보안","topic":"SSH 하드닝","q":"OpenSSH 서버에서 (1) root 직접 로그인을 금지하고 (2) 암호 인증을 끄는 두 설정을 쓰시오. (3) 적용 전 구문 검사 (4) 실제 적용 확인 방법을 쓰시오. 단, 공개키 로그인이 이미 검증되었다.","a":"(1) PermitRootLogin no\n(2) PasswordAuthentication no\n(3) sshd -t\n(4) 서비스 reload 후 다른 세션으로 키 로그인 테스트하고 journalctl/인증 로그 확인","e":"실제 sshd 구성은 Match 블록과 다른 설정 파일의 Include도 영향을 준다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["PermitRootLogin no","PasswordAuthentication no","sshd -t","안전한 재적용·로그 점검"],"lessonIds":["linux-ssh"],"refUrl":"https://man.openbsd.org/sshd_config"},{"id":"x55","bank":"advanced","type":"작업형","area":"02 네트워크 보안","topic":"IPv4 단편화","q":"IPv4 데이터그램에서 데이터 4000바이트, IPv4 헤더 20바이트, MTU 1500바이트이다. 옵션 없음. (1) 단편 개수 (2) 각 단편 데이터 길이 (3) Offset 값 세 개 (4) MF 비트 값을 차례대로 쓰시오.","a":"(1) 3개\n(2) 1480, 1480, 1040바이트\n(3) 0, 185, 370\n(4) 1, 1, 0","e":"각 단편은 IP 헤더를 별도로 포함한다. Offset은 데이터 시작 위치를 8로 나눈 값. 마지막 단편을 제외한 데이터 길이는 8의 배수여야 한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["3개","1480/1480/1040","0/185/370","MF 1/1/0"],"lessonIds":["tcp-ip"],"refUrl":"https://www.rfc-editor.org/rfc/rfc791.html"},{"id":"x56","bank":"advanced","type":"작업형","area":"02 네트워크 보안","topic":"Snort3 탐지","q":"HTTP URI에 /admin/이 포함되는 TCP 요청을 식별할 Snort 3의 단순 alert 룰을 예시로 작성하고 (1) msg (2) http_uri (3) content (4) sid·rev 의미를 설명하시오.","a":"alert http any any -> $HOME_NET 80 (msg:\"Admin URI\"; flow:to_server,established; http_uri; content:\"/admin/\"; sid:1000001; rev:1;)\nmsg: 경보 표시 문자열, http_uri: 정규화 URI 버퍼 선택, content: 검출할 패턴, sid: 룰 번호, rev: 개정 번호.","e":"주소·포트·프로토콜과 정책은 실환경에 맞게 조정한다. 이 룰은 alert이며 차단을 보장하지 않는다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["규칙 헤더·action","http_uri·content","msg","sid·rev"],"lessonIds":["detection"],"refUrl":"https://docs.snort.org/rules/options/"},{"id":"x57","bank":"advanced","type":"작업형","area":"02 네트워크 보안","topic":"iptables 규칙 순서","q":"INPUT 체인에 10.0.0.5에서 TCP/22 접근을 허용하는 iptables 규칙을 가장 앞에 삽입하고 해당 규칙을 줄번호와 함께 확인하시오. (1) 삽입 명령 (2) 확인 명령 (3) -I와 -A 차이 (4) 운영상 주의사항을 쓰시오.","a":"(1) iptables -I INPUT 1 -p tcp -s 10.0.0.5 --dport 22 -j ACCEPT\n(2) iptables -L INPUT -n --line-numbers\n(3) -I는 지정 위치 삽입, -A는 체인 끝 추가\n(4) 기존 DROP 규칙과 우선순위·기본 정책 및 IPv6/nftables도 확인","e":"원격 작업에서 룰을 잘못 적용하면 접속이 끊길 수 있으므로 롤백 계획과 콘솔 경로를 확보한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["-I 규칙 정확성","-L -n --line-numbers","-I/-A 구분","정책 우선순위·운영 주의"],"lessonIds":["detection"],"refUrl":"https://docs.snort.org/rules/options/"},{"id":"x58","bank":"advanced","type":"작업형","area":"02 네트워크 보안","topic":"DNS 로그","q":"메일 보안 결과가 spf=pass, dkim=fail, dmarc=fail이다. (1) SPF 통과 의미 (2) DMARC 실패 가능한 이유 (3) 정렬 검사 대상 (4) 운영 대응책을 쓰시오.","a":"(1) Envelope From 또는 HELO 도메인에 대해 발송 IP가 정책에 부합함\n(2) SPF 통과 도메인이 표시 From과 정렬되지 않았고 정렬된 DKIM도 성공하지 않은 경우 가능\n(3) 표시 From과 SPF/ DKIM의 인증 도메인 정렬\n(4) 정렬 설정, DKIM 서명 정책 및 DMARC 레코드·보고 확인","e":"SPF pass 하나만으로 DMARC pass가 보장되지 않는다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SPF 결과 의미","DMARC 실패 원인","표시 From 정렬","정책 개선"],"lessonIds":["arp-dns"],"refUrl":"https://www.rfc-editor.org/rfc/rfc7489.html"},{"id":"x59","bank":"advanced","type":"작업형","area":"02 네트워크 보안","topic":"반사 증폭 대응","q":"네트워크에서 원본 IP를 스푸핑해 UDP/1900 응답이 피해자에게 집중되고 있다. (1) 관련 프로토콜 (2) 공격 유형 (3) 발신 측 대책 (4) 반사 서버·피해자 측 대책을 쓰시오.","a":"(1) SSDP\n(2) UDP 반사·증폭 기반 DDoS\n(3) 소스 IP 검증(BCP38) 적용\n(4) 반사 서버의 불필요한 공개 서비스 차단·응답률 제한, 피해자 측 DDoS 스크러빙 및 상위 사업자 협조","e":"피해자의 IP는 발신지로 위조되므로 피해자가 공격 요청을 직접 보냈다고 단정하면 안 된다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SSDP","반사·증폭 기전","스푸핑 차단","공개 서비스/상위망 대응"],"lessonIds":["ddos"],"refUrl":"https://www.rfc-editor.org/rfc/rfc2827.html"},{"id":"x60","bank":"advanced","type":"작업형","area":"03 애플리케이션 보안","topic":"SQLi 코드 진단","q":"Node.js 서버의 코드: const sql = \"SELECT * FROM users WHERE id=\" + req.query.id; db.query(sql); (1) 취약점 (2) 취약 원인 (3) mysql2의 안전한 개선 코드 (4) 보조 대응책 두 가지를 쓰시오.","a":"(1) SQL Injection\n(2) 사용자 입력을 SQL 문자열 구조에 직접 연결\n(3) const [rows] = await conn.execute(\"SELECT * FROM users WHERE id=?\", [req.query.id]);\n(4) DB 최소 권한, 에러 노출 최소화, 입력 형식·길이 검증 등","e":"일반 정규식 필터만으로 SQLi를 방지했다고 쓰면 안 된다. 서버가 DB와 값을 분리해서 전달해야 한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SQL Injection 명칭","문자열 연결 원인","prepare/bind 코드","2개 추가 대응"],"lessonIds":["sql-injection"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"},{"id":"x61","bank":"advanced","type":"작업형","area":"03 애플리케이션 보안","topic":"정렬 SQLi","q":"검색 API가 sort=price&dir=DESC를 받는다. (1) ORDER BY 구문에 placeholder만으로 대응할 수 없는 이유 (2) 허용목록 검증 방안 (3) 안전한 SQL 조립 예시 (4) 데이터값 바인딩 방안을 서술하시오.","a":"(1) 플레이스홀더는 SQL 식별자·키워드가 아니라 데이터값을 바인딩함\n(2) sort는 {price:\"price\",name:\"name\"} 목록, dir은 ASC/DESC 중 선택\n(3) const col = allowed[sort] || \"name\"; const direction=dir===\"DESC\"?\"DESC\":\"ASC\"; const sql=`SELECT * FROM goods WHERE category=? ORDER BY ${col} ${direction}`;\n(4) conn.execute(sql,[category])","e":"예시에서 col과 direction은 사용자 입력을 그대로 사용하지 않고 서버가 선택한 고정 값이어야 한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["placeholder 한계","열·방향 허용목록","허용된 문자열 SQL 조합","값 바인딩"],"lessonIds":["sql-injection"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"},{"id":"x62","bank":"advanced","type":"작업형","area":"03 애플리케이션 보안","topic":"쿠키 설정","q":"응답 헤더가 Set-Cookie: SID=abc123; Path=/ 이다. (1) Secure 추가 결과 (2) HttpOnly 추가 결과 (3) SameSite=Lax의 효과 (4) 세 가지 속성만으로 막을 수 없는 공격 하나를 설명하시오.","a":"(1) HTTPS 요청에서만 쿠키 전송\n(2) 자바스크립트 document.cookie 등을 통한 쿠키 읽기 제한\n(3) 교차 사이트 요청에서 쿠키 전송 제한(Lax 정책)\n(4) XSS 자체 실행이나 서버 인가 취약점 등은 별도의 통제가 필요","e":"예: Set-Cookie: SID=abc123; Path=/; Secure; HttpOnly; SameSite=Lax.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["Secure","HttpOnly","SameSite=Lax","잔여 위험"],"lessonIds":["xss-csrf"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"},{"id":"x63","bank":"advanced","type":"작업형","area":"03 애플리케이션 보안","topic":"CSRF 진단","q":"정상 로그인 후 타 사이트에서 POST /change-email 요청을 보낼 수 있고 CSRF 토큰이 없다. (1) 취약점 (2) 악용 조건 (3) 직접 대응 2가지 (4) POST만 사용해도 해결되지 않는 이유를 쓰시오.","a":"(1) CSRF\n(2) 브라우저가 로그인 쿠키 등을 자동 첨부한 상태에서 의도치 않은 상태 변경 요청 발생\n(3) 세션에 연계된 CSRF 토큰 검증, Origin/Referer 비교, SameSite 설정 중 2가지\n(4) 메서드를 POST로 바꿔도 브라우저가 요청을 보낼 수 있어 인증된 사용자 의도 여부가 확인되지 않음","e":"단순 요청 내용에 숨겨진 토큰을 넣는 것만으로 충분하지 않으며 서버가 검증해야 한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["CSRF 명칭","공격 전제","직접 방어 2가지","POST만의 한계"],"lessonIds":["xss-csrf"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"},{"id":"x64","bank":"advanced","type":"작업형","area":"03 애플리케이션 보안","topic":"SSRF URL 검증","q":"서버가 사용자가 입력한 이미지 URL을 가져온다. (1) 위협 이름 (2) 루프백·사설 IP 차단 이유 (3) DNS 및 redirect 검증 방안 (4) 네트워크 층 추가 통제를 기술하시오.","a":"(1) SSRF\n(2) 서버가 내부 관리자·메타데이터 등 외부 비공개 서비스로 대신 요청할 수 있음\n(3) URL 정규 파싱, 허용 호스트·스킴 제한, DNS 결과 검사 및 리다이렉션 반복 검증/제한\n(4) 서버 outbound 방화벽·프록시로 접근 대상을 제한","e":"URL에 허용 도메인 문자열이 포함되는지 확인하는 단순 contains 검사는 충분하지 않다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SSRF","내부 접근 위험","DNS/redirect 검증","egress 네트워크 제어"],"lessonIds":["ssrf-xxe"],"refUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"},{"id":"x65","bank":"advanced","type":"작업형","area":"03 애플리케이션 보안","topic":"CORS 설정","q":"API의 응답이 Access-Control-Allow-Origin: https://evil.example 및 Access-Control-Allow-Credentials: true이고 이 출처가 검증되지 않았다. (1) 위험 (2) 주요 설정 검토 (3) 서버측 인증·인가 필요성 (4) 검증 방안을 쓰시오.","a":"(1) 악성 출처가 사용자의 인증정보가 포함된 요청에 대한 응답을 읽을 위험\n(2) 허용된 Origin만 정확히 매칭하고 credentials 허용이 필요한 곳만 제한\n(3) CORS 설정 자체는 사용자·객체 접근 권한 검증을 대체하지 않음\n(4) 실제 브라우저 기반 교차 출처 요청·헤더·사전요청 동작 확인","e":"Access-Control-Allow-Origin: *와 credentials=true는 표준 브라우저에서 함께 허용되지 않는다. 반사 설정이 문제다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["위험 유형","Origin 허용목록","인가 검사의 별도 필요","브라우저 확인"],"lessonIds":["http-sec"],"refUrl":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control"},{"id":"x66","bank":"advanced","type":"작업형","area":"03 애플리케이션 보안","topic":"OWASP 예외처리","q":"승인 API가 DB 장애 발생 시 catch 블록에서 return true를 수행한다. (1) 취약한 설계 원칙 (2) 2025 OWASP 해당 범주 (3) 안전한 수정 방식 (4) 추가 테스트를 쓰시오.","a":"(1) Fail-open: 오류 발생 시 기본 허용\n(2) OWASP Top 10:2025 A10 Mishandling of Exceptional Conditions\n(3) 예외 시 승인 거부·안전한 오류 처리·내부 로그 기록(fail-closed)\n(4) DB 연결 실패·타임아웃·잘못된 응답 등 예외 경로 테스트","e":"예외를 잡았다는 사실이 보안을 보장하지 않으며 반환값이 안전해야 한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["fail-open","A10 2025","fail-closed","예외 테스트"],"lessonIds":["owasp25"],"refUrl":"https://top10.owasp.org/2025/"},{"id":"x67","bank":"advanced","type":"작업형","area":"04 정보보호일반","topic":"TLS 1.3 분석","q":"보안 서버가 TLS 1.3을 사용한다. (1) 서버 인증서 검증 항목 세 가지 (2) (EC)DHE의 역할 (3) AEAD 알고리즘 예시 (4) 0-RTT 초기 데이터 주의사항을 쓰시오.","a":"(1) 인증서 체인, 호스트명 일치, 유효기간·폐기 여부 등\n(2) 세션 키 도출용 공유 비밀 합의\n(3) AES-GCM 또는 ChaCha20-Poly1305\n(4) 0-RTT는 재전송 공격(replay) 위험을 고려해 상태 변경 작업에 사용을 제한","e":"인증서는 키 교환 그 자체가 아니며 인증·세션 보호 기능이 서로 다르다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["인증서 3항목","(EC)DHE 공유 비밀","AEAD 예시","0-RTT replay 위험"],"lessonIds":["tls-crypto"],"refUrl":"https://www.rfc-editor.org/rfc/rfc8446.html"},{"id":"x68","bank":"advanced","type":"작업형","area":"04 정보보호일반","topic":"IPsec ESP 터널","q":"IPsec ESP 터널 모드 IPv4 패킷을 순서대로 그리시오. (1) 추가 헤더·태그 구조 (2) ESP 암호화 영역 (3) 일반적으로 인증 보호되는 영역 (4) AH와 차이를 쓰시오.","a":"(1) 새 IP 헤더 | ESP 헤더 | 원 IP 헤더 | TCP 헤더 | 데이터 | ESP 트레일러 | ESP 인증 태그\n(2) 내부 IP 패킷(원 IP 헤더~데이터)과 ESP trailer가 암호화됨\n(3) 일반적인 AEAD ESP는 ESP 헤더의 SPI/Sequence 및 암호문 등 보호 범위를 인증하며 외부 새 IP 헤더는 제외\n(4) AH는 암호화(기밀성)를 제공하지 않음","e":"암호화/인증 범위는 ESP 구현과 알고리즘에 따라 정확히 표현해야 한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["ESP 구조","암호화 범위","인증 영역","AH와 차이"],"lessonIds":["ipsec"],"refUrl":"https://www.rfc-editor.org/rfc/rfc4303.html"},{"id":"x69","bank":"advanced","type":"작업형","area":"05 정보보호관리 및 법률","topic":"ALE 계산","q":"정보자산 가치 2,000만 원, 노출계수 25%, 연간 사고 발생률 0.4회이다. (1) SLE (2) ARO (3) ALE (4) 연간 150만원 통제 도입 시 금전상 판단의 한계를 서술하시오.","a":"(1) SLE=2,000만×0.25=500만원\n(2) ARO=0.4회/년\n(3) ALE=500만×0.4=200만원/년\n(4) 통제 비용 150만원/년만으로 채택을 단정할 수 없고 통제 후 잔여 ALE·운영 비용·비금전적 위험을 비교","e":"ALE는 통제 적용 전 기대 손실 추정값이다. 통제 후 위험 감소분을 구하지 않은 채 절감액=200만원이라고 쓰면 안 된다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["SLE 500만원","ARO 0.4","ALE 200만원/년","통제 후 위험·비용 비교"],"lessonIds":["risk-bcp"],"refUrl":"https://csrc.nist.gov/projects/risk-management"},{"id":"x70","bank":"advanced","type":"작업형","area":"05 정보보호관리 및 법률","topic":"증거 보존","q":"의심 PC에서 메모리 수집 전 재부팅을 요청받았다. (1) 재부팅의 위험 (2) 우선 고려할 휘발성 증거 2가지 (3) 무결성 보장 방법 (4) 인계기록 요소 3가지를 답하시오.","a":"(1) RAM·프로세스·네트워크 연결 등 휘발성 증거가 소멸할 수 있음\n(2) 메모리, 실행 프로세스, 네트워크 연결, 로그인 세션 중 2개\n(3) 가능한 승인·절차에 따라 수집한 사본에 SHA-256 해시 기록·원본 변경 통제\n(4) 수집자, 수집 일시, 장치 식별정보, 인계자/인수자, 보관 장소 중 3개","e":"무결성 확보뿐 아니라 현장의 격리·안전·확산 차단과 함께 결정한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["재부팅 위험","휘발성 증거 2개","해시·변경 방지","인계기록 3개"],"lessonIds":["forensics"],"refUrl":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"id":"x71","bank":"advanced","type":"작업형","area":"05 정보보호관리 및 법률","topic":"비밀번호 규정 비교","q":"조직 규정은 “8자 이상 + 대문자·소문자·숫자·특수문자 + 90일마다 변경”이다. (1) NIST 800-63B-4와 비교 (2) 단일요소 최소 길이 (3) 정기 변경 규정 (4) 추가 권고를 기술하시오.","a":"(1) 문자종류 조합 강제를 사용하지 않도록 하는 NIST 지침과 상충\n(2) 비밀번호 단독 인증은 최소 15자\n(3) 침해 징후 없을 때 주기적 변경 강제하지 않음\n(4) 유출 비밀번호 차단목록·인증 시도 횟수 제한·MFA 적용\n※ NIST 지침이지 한국 모든 기관에 자동 적용되는 법적 의무는 아님","e":"기출 당시의 국내 규정·기관 정책과 최신 NIST 지침을 구분해 답한다.","external":true,"supplement":true,"why":"기출의 용어·로그·설정 분석 방식과 최신 공식 보안 권고를 결합한 응용 문항","rubric":["문자조합 강제 문제","단일요소 15자","정기 변경 지침","추가 대응·법적 성격"],"lessonIds":["nistpassword"],"refUrl":"https://pages.nist.gov/800-63-4/sp800-63b.html"}];
const LESSONS=[{"id":"linux-perm","area":"01 시스템 보안","title":"리눅스 권한 · umask · 특수권한","priority":3,"terms":["chmod","umask","setuid","setgid","sticky","find","SUID","SGID"],"summary":"파일은 기본 최대 666, 디렉터리는 777에서 umask로 비트를 제거한다. SetUID·SetGID·Sticky Bit는 서로 용도가 다르다.","detail":"① 일반 파일 666, 디렉터리 777을 기본 권한 상한으로 보고 umask 비트와 AND NOT 연산하여 생성 권한을 계산한다. 022라면 파일 644, 디렉터리 755이다. 단순한 십진수 빼기가 아니라 비트 제거이다.\n② SetUID(4000)는 실행 파일의 유효 UID를 소유자로 설정한다. SetGID(2000)는 실행 파일의 유효 GID를 그룹으로 설정하며, 디렉터리에서는 새 파일의 그룹 상속에 관여한다.\n③ Sticky Bit(1000)는 /tmp와 같이 누구나 쓰는 디렉터리에서 파일 삭제·이름 변경을 파일 소유자·디렉터리 소유자·특권 사용자 등으로 제한한다.\n④ 탐지: find / -type f -perm -4000 2>/dev/null, find / -type f -perm /6000 2>/dev/null. -4000은 해당 비트 모두, /6000은 지정 비트 중 하나 이상이다.","scenario":"작업형: /srv/share를 1777로 설정하고, SUID 파일을 찾는 명령과 위험도를 설명한다.","pitfalls":"계정 UID 0은 특권 계정, GID 0만으로 동일 권한은 아님. chmod 777이 보안 대책은 아님.","source":"https://man7.org/linux/man-pages/man1/chmod.1.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"linux-auth","area":"01 시스템 보안","title":"계정 · shadow · PAM · 잠금 정책","priority":3,"terms":["shadow","pam","faillock","passwd","auth","minlen","salt","login.defs","uid"],"summary":"/etc/passwd는 계정 메타데이터, /etc/shadow는 비밀번호 해시와 만료 정보, PAM은 서비스별 인증 정책을 담당한다.","detail":"① /etc/passwd의 x 필드는 shadow 사용을 뜻한다. /etc/shadow 예: $6$salt$hash에서 6은 SHA-512 crypt 방식 식별자다. 이는 단순 SHA-512 해시 그 자체와 구분한다.\n② pam_pwquality.so의 lcredit/ucredit/dcredit/ocredit 음수값은 각 문자 종류의 최소 요구 개수를 나타낸다. 실제 정책 파일은 배포판과 PAM 구성에 따라 다르며 /etc/pam.d/system-auth나 password-auth, /etc/security/pwquality.conf 등을 확인한다.\n③ pam_faillock 및 faillock.conf의 deny, unlock_time은 실패 임계 횟수와 잠금 시간 설정. PAM 연결이 되어야 효력이 난다.\n④ 기본 수명 설정 PASS_MAX_DAYS는 새로 만드는 계정에 적용될 수 있으며 기존 계정은 chage -l 계정명으로 확인한다.","scenario":"작업형: faillock.conf에 deny=5, unlock_time=600을 설정한 뒤 PAM 적용 여부를 점검한다.","pitfalls":"최근 NIST SP 800-63B-4의 단일 요소 비밀번호 최소 15자 지침과 특정 기관의 기존 복잡도 규정을 혼동하면 안 된다.","source":"https://pages.nist.gov/800-63-4/sp800-63b.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"linux-logs","area":"01 시스템 보안","title":"로그 · 프로세스 조사 · 증거 보존","priority":3,"terms":["history","journalctl","lastb","last","auth.log","secure","ps","proc","lsof","ss"],"summary":"실무형은 어떤 파일을 조회하는지만 아니라 증거의 성격과 변조 가능성을 함께 써야 한다.","detail":"① who/w는 현재 로그인 정보를, last는 wtmp 기반 로그인 이력, lastb는 btmp 기반 실패 이력을 확인한다(배포판에 따라 다름). /var/log/auth.log 또는 /var/log/secure는 인증 관련 로그다.\n② ps -ef·top은 실행 중인 프로세스, ss -lntp는 TCP 리스닝 포트와 프로세스 정보(권한에 따라 다름)를 확인한다. /proc/PID/cmdline은 NUL로 구분된 인수, /proc/PID/exe는 실행 파일 경로 링크이다.\n③ 쉘 history는 명령 실행 사실의 유일한 증거가 아니다. 지울 수 있고 세션 저장 시점에 따라 누락될 수 있으므로 auditd·journal·쉘 로그 등과 교차검증한다.\n④ 의심 파일은 원본을 직접 수정하지 말고 시간 기록, 해시값 계산, 적절한 획득 및 접근 통제를 수행한다.","scenario":"실무형: /proc/5900/exe -> /tmp/bot (deleted)를 확인하면 삭제 후에도 실행 중일 수 있다고 판단하고 cmdline·open files·연결을 조사한다.","pitfalls":"프로세스가 메모리에 있으므로 모든 경우 exe 링크로 원본 복원이 가능하다고 단정하지 않는다.","source":"https://man7.org/linux/man-pages/man5/proc.5.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"linux-ssh","area":"01 시스템 보안","title":"SSH · 서비스 관리 · 최소 노출","priority":2,"terms":["sshd","PermitRootLogin","PasswordAuthentication","systemctl","sshd_config","ufw"],"summary":"SSH 서버 노출 최소화, 관리자 직접 접속 금지, 키 기반 인증과 사용 계정 제한을 함께 고려한다.","detail":"① sshd_config 예: PermitRootLogin no, PasswordAuthentication no(키 배포와 대체 접속 경로 확인 후). AllowUsers로 허용 계정을 제한할 수 있다.\n② 적용 전에 sshd -t로 구문 검사를 하고 systemctl reload sshd 또는 배포판 서비스명을 확인한다.\n③ 방화벽 제한, MFA/접근 경로 통제, 로그인 실패 모니터링을 병행한다. 특정 설정을 무작정 끄면 관리자 접속이 차단될 수 있으므로 대체 세션을 유지한다.","scenario":"작업형: 설정값을 쓰고 설정 테스트, 재적용, 로그 검증 단계를 순서대로 답한다.","pitfalls":"배포판과 OpenSSH 버전·Match 블록에 따른 설정 우선순위를 점검한다.","source":"https://man.openbsd.org/sshd_config","origin":"노트 확장 + 표준/실무 검증"},{"id":"windows-evidence","area":"01 시스템 보안","title":"Windows 이벤트 · 자격증명 · 포렌식","priority":3,"terms":["event","4624","4625","4688","sysmon","lsass","sam","ntlm","pth","run","registry"],"summary":"로그온 성공/실패, 프로세스 생성, LSASS 접근을 함께 분석해야 침해 흐름을 설명할 수 있다.","detail":"① Windows Security Event ID 4624는 로그온 성공, 4625는 로그온 실패이며 로그온 유형·계정·출발지 주소·시간을 함께 봐야 한다. 4688은 감사 정책에 따라 프로세스 생성 이벤트를 기록한다.\n② Sysmon은 추가 구성 시 프로세스 생성 Event ID 1, 네트워크 연결 3, 프로세스 접근 10 등 풍부한 원격 조사 정보를 제공한다.\n③ NTLM Pass-the-Hash는 탈취한 NT 해시를 이용해 인증 과정을 통과하려는 공격으로, 일반적인 비밀번호 재입력이나 단순 해시 송신 설명과 구분해야 한다.\n④ LSASS 메모리 접근 징후는 정상 백신/보안도구의 접근과 함께 구분해야 하며 비정상 부모 프로세스, 접근 권한, 생성된 덤프 파일을 상관분석한다.","scenario":"서술형: 다수 4625 후 4624 성공, 이어 비정상 4688 실행이 나타난 경우 가능한 시나리오와 추가 확인을 답한다.","pitfalls":"4624 한 건만으로 계정 탈취를 확정할 수 없고, 이벤트가 없는 것도 수집 정책에 따라 정상일 수 있다.","source":"https://attack.mitre.org/techniques/T1003/001/","origin":"노트 확장 + 표준/실무 검증"},{"id":"tcp-ip","area":"02 네트워크 보안","title":"TCP 플래그 · 포트 · IP 단편화","priority":3,"terms":["syn","ack","fin","rst","tcp","udp","fragment","offset","ttl","nmap"],"summary":"SYN Flood는 반개방 연결을 악용하고 IP Fragment Offset은 8바이트 단위로 표시한다.","detail":"① TCP 연결은 SYN→SYN/ACK→ACK. SYN Flood는 최종 ACK가 도착하지 않아 대기 자원이 고갈될 수 있다. SYN cookies, rate limiting, 장비 보호 등을 조합한다.\n② TCP는 신뢰성 있는 스트림, UDP는 연결 설정 없이 데이터그램을 보내며 DNS는 일반 질의에서 UDP/53, 큰 응답·영역전송 등에서 TCP/53도 사용한다.\n③ IPv4의 Fragment Offset은 8바이트 블록 단위. MTU 1500, IP 헤더 20바이트면 단편 데이터 1480바이트 → offset은 0,185,370으로 계산한다.\n④ TTL은 라우터를 통과할 때 감소하므로 관측된 TTL만으로 운영체제를 확정할 수 없다.","scenario":"작업형: 데이터 4000바이트를 MTU 1500 환경에서 단편화할 때 각 데이터 길이와 offset을 계산한다.","pitfalls":"IPv6에서는 라우터가 단편화하지 않고 송신 노드가 단편화를 관리한다.","source":"https://www.rfc-editor.org/rfc/rfc791.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"arp-dns","area":"02 네트워크 보안","title":"ARP 스푸핑 · DNS 보안 · 이메일 인증","priority":3,"terms":["arp","dns","dnssec","spf","dkim","dmarc","cache poisoning","mx"],"summary":"ARP는 로컬 IP-MAC 대응, DNSSEC은 DNS 응답 진위 보호, SPF/DKIM/DMARC는 이메일 발신 도메인 보호이다.","detail":"① ARP 스푸핑은 위조 ARP 응답으로 IP-MAC 매핑을 변조해 중간자 공격을 유발한다. DHCP Snooping과 연계한 DAI(Dynamic ARP Inspection) 같은 네트워크 장비 보호를 고려한다.\n② DNS 캐시 포이즈닝은 잘못된 레코드를 캐시에 저장시켜 악성 목적지로 유도한다. DNSSEC은 DNS 데이터의 출처 인증·무결성을 제공하지만 응답 암호화나 DDoS 방어를 보장하지 않는다.\n③ SPF는 발송 IP가 해당 Envelope-from 도메인의 정책에 부합하는지, DKIM은 메시지에 대한 도메인 서명을, DMARC는 표시된 From 도메인의 정렬(alignment)과 정책(p=none/quarantine/reject) 및 보고를 다룬다.","scenario":"작업형: SPF pass, DKIM fail, DMARC fail이 나온 로그를 보고 표시 From 도메인 정렬 및 차단 정책을 함께 분석한다.","pitfalls":"SPF 통과만으로 사용자가 본 From 도메인 사칭이 방지되는 것은 아니다.","source":"https://www.rfc-editor.org/rfc/rfc7489.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"detection","area":"02 네트워크 보안","title":"방화벽 · Snort/Suricata · 탐지 룰","priority":3,"terms":["snort","suricata","content","sid","rev","depth","offset","iptables","nftables"],"summary":"방화벽은 통신 허용·차단, IDS는 탐지·경보, IPS는 통신 경로에서 차단할 수 있다.","detail":"① Snort 룰 헤더는 action proto sourceIP sourcePort -> destinationIP destinationPort, 옵션은 괄호 내 msg, content, sid, rev 등으로 정의한다.\n② Snort3의 http_uri;는 정규화된 URI 버퍼를 선택하는 sticky buffer이며 그 뒤의 content는 해당 버퍼를 대상으로 검색한다.\n③ depth는 검사 시작 지점으로부터 검색 범위를 제한하며 offset은 검색 시작 위치에 관여한다. 탐지 룰은 예외 트래픽과 오탐 여부를 확인해 배포해야 한다.\n④ iptables -A는 체인 끝에, -I는 지정 위치에 삽입한다. 실제 규칙은 순서대로 평가하므로 정책 우선순위가 중요하다.","scenario":"작업형: HTTP URI /admin/이 포함된 요청을 탐지하는 Snort3 규칙을 만들고 sid, rev, msg의 뜻을 설명한다.","pitfalls":"탐지 규칙 작성만으로 자동 차단되는 것은 아니다. IDS/IPS 배치와 룰 action을 구분한다.","source":"https://docs.snort.org/rules/options/","origin":"노트 확장 + 표준/실무 검증"},{"id":"ddos","area":"02 네트워크 보안","title":"DoS/DDoS · 반사증폭 · 완화","priority":3,"terms":["syn flooding","smurf","ssdp","dns amplification","reflection","ddos","rate limiting"],"summary":"반사 공격은 출발지 IP 위조와 제3자 응답을, 증폭 공격은 작은 요청에 비해 큰 응답이 반환되는 특성을 이용한다.","detail":"① LAND는 출발지와 목적지 주소를 대상 IP로 동일하게 설정한 패킷을 이용한 고전적 공격이다. Smurf는 위조한 출발지 IP로 브로드캐스트 ICMP Echo를 보내 다수 호스트의 응답을 피해자에게 유도한다.\n② DNS/NTP/SSDP 등 UDP 기반 응답이 반사·증폭에 악용될 수 있다. 공격자는 직접 피해자를 향해 응답을 보내지 않고 반사 서버를 이용한다.\n③ 대응은 소스 주소 검증(BCP38), 불필요한 공개 응답 차단, 요청율 제한, 캐시/스크러빙·상위망 협력, 공격 트래픽 분석을 조합한다.","scenario":"서술형: SYN Flood와 DNS 증폭 공격의 자원 고갈 원리와 상이한 대응 기술을 비교한다.","pitfalls":"Smurf 방어에서 호스트의 broadcast ICMP 무시와 라우터의 directed broadcast 차단은 구분한다.","source":"https://www.rfc-editor.org/rfc/rfc2827.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"sql-injection","area":"03 애플리케이션 보안","title":"SQL Injection · 안전한 질의","priority":3,"terms":["sql injection","sql 인젝션","prepared","parameter","placeholder","order by","동적 sql"],"summary":"바인딩은 데이터값을 SQL 코드와 분리하며, 컬럼·정렬 방향 등 SQL 구조는 허용목록 방식으로 처리한다.","detail":"① 위험 코드: SELECT * FROM users WHERE id=\" + userInput. 문자열 연결로 사용자가 SQL 구문에 영향을 준다.\n② 안전 코드: SELECT * FROM users WHERE id=? 와 별도 파라미터 바인딩. mysql2의 execute(sql,[id])처럼 준비된 명령을 사용한다.\n③ ORDER BY 열 이름, ASC/DESC 등의 SQL 구조는 값 자리표시자로 대체할 수 없으므로 미리 정한 항목에서만 선택한다.\n④ DB 계정 최소 권한, 에러 노출 제한, 로그 분석을 추가하되 WAF·문자열 치환만으로 근본 방어했다고 쓰지 않는다.","scenario":"작업형: 정렬 열·방향을 받는 검색 API의 SQLi 위험을 분석하고 화이트리스트와 바인딩을 함께 제시한다.","pitfalls":"단순한 작은따옴표 삭제는 정상 입력을 훼손하고 인코딩/우회에 취약하다.","source":"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"xss-csrf","area":"03 애플리케이션 보안","title":"XSS · CSRF · 쿠키 속성","priority":3,"terms":["xss","csrf","samesite","httponly","secure","cookie","csp"],"summary":"XSS는 브라우저에서 악성 스크립트 실행, CSRF는 로그인 세션을 이용한 의도하지 않은 상태변경 요청이다.","detail":"① XSS 방어는 출력 위치에 맞는 인코딩이 핵심이며 HTML 입력 허용 시 검증된 Sanitizer 사용. CSP는 추가 방어계층이다. HttpOnly는 JS의 쿠키 접근을 막지만 모든 XSS 영향을 제거하지 않는다.\n② CSRF 방어는 서버가 세션과 연결해 검증하는 예측 불가능한 토큰, Origin/Referer 확인, SameSite 쿠키 등을 함께 사용한다. POST 메서드만으로 방어할 수 없다.\n③ Secure 쿠키는 HTTPS 통신에만 전송, HttpOnly는 JS document.cookie 접근 제한, SameSite는 사이트 간 전송 정책을 정의한다.","scenario":"작업형: Set-Cookie를 Secure; HttpOnly; SameSite=Lax로 강화하고 각 설정 효과를 설명한다.","pitfalls":"HttpOnly는 CSRF 토큰을 대신하지 않는다. SameSite=None은 Secure 요구 등 브라우저 제약을 확인한다.","source":"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"ssrf-xxe","area":"03 애플리케이션 보안","title":"SSRF · XXE · 업로드/경로 문제","priority":3,"terms":["ssrf","xxe","xml","upload","path traversal","../","allowlist","url"],"summary":"SSRF는 서버가 임의 주소로 요청하게 하는 문제, XXE는 XML 외부 엔티티 해석 문제, 경로 탐색은 허용 범위 밖 파일 접근 문제다.","detail":"① SSRF 대응은 허용된 프로토콜·호스트·IP 대역의 엄격한 목록, DNS 재확인, 리다이렉션 통제, 네트워크 접근 통제를 적용한다. 단순 문자열 contains(host)는 호스트 혼동에 취약하다.\n② XXE는 XML 파서에서 DTD/외부 엔티티 처리 금지와 안전한 파서 구성이 주된 대책이다. SQL 바인딩은 XXE의 직접 대응이 아니다.\n③ 파일 업로드는 확장자·MIME·파일 시그니처 검증, 실행권한 제거, 웹루트 외부 저장, 무작위 이름, 크기 제한을 조합한다.\n④ 경로 탐색은 경로 정규화 후 허용된 최상위 디렉터리 안인지 검사하고 사용자에게 직접 경로를 조립하게 하지 않는다.","scenario":"서술형: 외부 URL을 받아 이미지 미리보기를 하는 서비스에서 SSRF 위험과 방어를 설명한다.","pitfalls":"URL 검증이 DNS 리바인딩, 리다이렉션 등을 고려하지 않으면 충분하지 않다.","source":"https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"auth-sessions","area":"03 애플리케이션 보안","title":"인증·인가 · 세션관리 · OAuth/OIDC","priority":3,"terms":["oauth","oidc","authorization","authentication","jwt","session","idor","접근통제"],"summary":"인증은 누군지 확인, 인가는 어떤 행위를 할 수 있는지 판단. OAuth 2.0은 인가, OIDC는 OAuth 2.0 기반 인증 계층이다.","detail":"① 로그인 성공 후 발급되는 세션 식별자는 예측 불가능하게 만들고 로그인·권한 상승 시 재발급해야 한다. 서버측 세션 만료·로그아웃 무효화를 적용한다.\n② 수평 권한 상승(IDOR/BOLA)은 다른 이용자의 객체 식별자로 조회/변경하는 취약점으로, 서버가 요청마다 주체-대상 자원 관계를 확인해야 한다.\n③ OAuth 2.0 액세스 토큰은 API 접근 권한을 나타내며 OIDC의 ID Token은 인증 결과·사용자 정보를 표현한다. OAuth의 state는 CSRF 완화, OIDC nonce는 토큰 재사용 등 특정 위험 완화에 사용한다.","scenario":"작업형: /orders/104를 /orders/105로 바꾸었을 때 타인 주문이 노출되면 접근통제 실패이며 소유권 검사로 해결한다.","pitfalls":"UI 버튼 숨김이나 JWT 서명 검증만으로 리소스 인가가 완료되지 않는다.","source":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"tls-crypto","area":"04 정보보호일반","title":"TLS 1.3 · 암호·해시·전자서명","priority":3,"terms":["tls","https","ecdh","ecdhe","cipher","hash","salt","digital signature","rsa","hmac"],"summary":"TLS 1.3은 AEAD 방식과 (EC)DHE/PSK 등을 사용한다. 암호화·해시·전자서명의 제공 보안 서비스를 구분한다.","detail":"① 대칭키 암호는 같은 키로 암·복호화하며 AES-GCM 등의 AEAD는 기밀성과 무결성 검증을 함께 제공한다.\n② 공개키 암호는 공개키/개인키 쌍을 사용한다. 전자서명은 서명자 개인키로 서명하고 대응 공개키로 검증해 무결성과 서명 주체 검증에 기여한다.\n③ 해시는 임의 길이 입력을 고정 길이 출력으로 요약하지만 복호화 기능은 없다. 패스워드는 소금값과 느린 비밀번호 해시 알고리즘을 사용한다.\n④ TLS 1.3은 구형 RSA 키 전달을 폐지하고 키 교환에 (EC)DHE 또는 PSK를 사용하며 AEAD를 적용한다. 서버 인증서는 신뢰 사슬과 호스트명·유효기간을 검사해야 한다.","scenario":"서술형: TLS 핸드셰이크에서 서버 인증서·키 교환·대칭 세션키 생성·Finished 검증 의미를 구분한다.","pitfalls":"TLS 1.3의 0-RTT 초기 데이터에는 재전송 공격 등 제약이 있으므로 멱등 작업 여부를 고려한다.","source":"https://www.rfc-editor.org/rfc/rfc8446.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"ipsec","area":"02 네트워크 보안","title":"IPsec AH/ESP · 전송/터널 모드","priority":3,"terms":["ipsec","ah","esp","ike","tunnel","transport","anti-replay"],"summary":"ESP는 암호화(기밀성) 및 인증된 암호 운용 시 무결성과 인증을 제공한다. AH는 암호화를 제공하지 않는다.","detail":"① AH는 패킷 무결성·데이터 출처 인증·재전송 공격 방지 기능을 제공하나 기밀성은 없다. ESP는 기밀성을 제공하고 암호 모드/구성에 따라 무결성·출처 인증을 제공한다.\n② 전송모드는 원래 IP 헤더를 유지하고 상위 페이로드를 보호한다. 터널모드는 원래 IP 패킷을 캡슐화하고 새로운 바깥 IP 헤더를 붙인다.\n③ ESP 터널모드에서 보호되는 부분은 ESP 헤더, 암호화되는 내부 IP 패킷과 ESP trailer, 인증 태그를 구분해 그려야 한다.\n④ IKEv2는 DH 기반 키 협상 및 SA 관리에 사용한다.","scenario":"작업형: 새 IP 헤더 | ESP 헤더 | 원래 IP 헤더 | TCP 헤더 | 데이터 | ESP 트레일러 | 인증 태그 순서와 보호 범위를 설명한다.","pitfalls":"ESP가 항상 무결성 보호를 제공한다고 가정하면 안 되며 사용한 알고리즘·구성을 명시한다.","source":"https://www.rfc-editor.org/rfc/rfc4303.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"forensics","area":"05 정보보호관리 및 법률","title":"침해사고 대응 · 디지털 포렌식","priority":3,"terms":["incident","포렌식","hash","chain of custody","침해사고","증거","ioc"],"summary":"증거 수집은 휘발성·무결성·연속성을 고려하고, 관찰 사실과 분석 추정을 구분해서 작성한다.","detail":"① 사고 발생 시 준비(체계·자산), 탐지·분석(로그·IOC), 봉쇄(확산 차단), 제거(원인·악성요소), 복구(정상화), 사후 개선을 구분해 답하면 좋다. 최신 NIST 800-61r3는 CSF 2.0의 Govern/Identify/Protect/Detect/Respond/Recover와 연계하는 관점으로 설명한다.\n② 원본 매체는 쓰기 방지 등의 절차로 보존하고 사본 해시(SHA-256 등)를 기록한다. 획득 일시·담당자·보관·인계 내역(Chain of Custody)을 기록한다.\n③ 네트워크 및 메모리의 휘발성 정보를 먼저 고려하되, 현장 안전·전파 위험을 평가해야 한다. 무작정 재부팅하면 휘발성 증거가 손실될 수 있다.\n④ 정황만으로 공격 성공을 단정하지 말고 요청-응답, 프로세스·파일 생성, 유출 여부를 상관분석한다.","scenario":"서술형: 웹로그에 200 응답과 cmd.exe 경로가 있다면 공격 시도는 식별되지만 명령 성공 여부는 후속 증거로 판단해야 한다.","pitfalls":"포렌식 해시 동일성은 수집 이후 변경 여부 확인 수단이며 사건의 적법성·진위 전체를 자동 증명하는 것은 아니다.","source":"https://csrc.nist.gov/pubs/sp/800/61/r3/final","origin":"노트 확장 + 표준/실무 검증"},{"id":"risk-bcp","area":"05 정보보호관리 및 법률","title":"위험관리 · ALE · BIA · 업무연속성","priority":2,"terms":["ale","sle","aro","risk","bcp","drp","rto","rpo","bia"],"summary":"위험분석은 위협·취약점·자산을 식별하고 ALE=SLE×ARO를 계산하며 보호대책의 비용·효과를 판단한다.","detail":"① SLE(단일 손실 예상액)=자산 가치×노출계수(EF). ARO는 연간 예상 발생 빈도, ALE=SLE×ARO는 연간 예상 손실액이다.\n② 정성 평가는 상중하 등 등급을, 정량 평가는 금액·확률 등 수치로 평가한다. 수용·회피·전가·감소는 서로 다른 위험 처리 방식이다.\n③ BIA(업무영향분석)는 업무 중단의 영향과 우선순위를 평가한다. RTO는 목표 복구시간, RPO는 허용 가능한 데이터 손실 시점이다.\n④ DRP는 IT 재해복구계획, BCP는 조직 업무 연속성을 포함하는 포괄적 계획이다.","scenario":"계산: 자산 2,000만원, EF=0.25, ARO=0.4이면 SLE=500만원, ALE=200만원/년.","pitfalls":"RPO 2시간이므로 복구를 2시간 이내 완료한다는 뜻은 아님. 그 시간은 RTO이다.","source":"https://csrc.nist.gov/projects/risk-management","origin":"노트 확장 + 표준/실무 검증"},{"id":"privacy","area":"05 정보보호관리 및 법률","title":"개인정보 안전성 확보조치 · 2026 고시","priority":3,"terms":["개인정보","접속기록","인터넷망","100만","가명정보","내부관리계획"],"summary":"2026-07-01 시행 개인정보보호위원회 고시 기준으로 역할별 인터넷망 차단과 일부 위험분석 예외가 규정된다.","detail":"① 접속기록은 식별자, 접속일시, 접속지 정보, 처리한 정보주체 정보, 수행업무 등을 포함한다. 보관기간·점검·보호 조치는 현행 고시 조항을 직접 확인한다.\n② 제6조의2는 전년도 말 기준 직전 3개월 간 해당 개인정보가 저장·관리된 이용자의 일일평균 수가 100만명 이상인지 판단하고, 접근권한 설정 가능자 및 개인정보 다운로드·파기 가능자의 컴퓨터 등을 대상으로 한다.\n③ 다운로드/파기 담당자 일부는 내부관리계획상 위험분석 및 보호조치로 차단 예외가 가능하지만, 민감정보 또는 고시에서 정한 개인정보 처리 등 예외가 허용되지 않는 경우가 있으므로 조항을 구분한다.\n④ 내부관리계획에는 담당 역할·접근권한·접속기록 점검·보안조치 등 운영 기준을 정한다.","scenario":"서술형: 차단 적용 여부를 계산할 때 이용자 수, 업무 역할, 위험분석 예외 제한을 순서대로 검토한다.","pitfalls":"2020년 기출의 법령 문구가 2026년 조문과 다를 수 있음. 시험 시행일 기준 공고를 확인한다.","source":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000281400","origin":"노트 확장 + 표준/실무 검증"},{"id":"owasp25","area":"03 애플리케이션 보안","title":"OWASP Top 10:2025 · 공급망·오류처리","priority":3,"terms":["owasp","supply chain","exception","dependency","sast","sbom","access control"],"summary":"2025 버전은 A01 접근통제 실패, A02 보안 설정 오류, A03 공급망 실패, A10 부적절한 예외처리를 포함한다.","detail":"① A01 Broken Access Control은 사용자에게 허용되지 않은 자원·기능 접근을 막지 못하는 문제다. IDOR/BOLA, 서버측 권한 누락 등을 포함한다.\n② A03 Software Supply Chain Failures는 단순히 오래된 라이브러리를 사용하는 것뿐 아니라 서드파티 의존성·빌드·배포 경로가 침해되는 위험을 포괄한다. SBOM, 잠금 파일, 신뢰된 저장소, 서명/무결성 검증 등이 대응이다.\n③ A09 Security Logging & Alerting Failures는 로그 수집뿐 아니라 경고가 후속 조치로 연결되지 않는 문제까지 포함한다.\n④ A10 Mishandling of Exceptional Conditions는 예외 상황에서 통제 없이 성공 처리(fail-open), 내부 오류 노출, 예외 누락 등이 문제가 된다.","scenario":"서술형: 의존성 위조 설치 후 배포 서버까지 침해된 사건에서 공급망 위험과 CI/CD 보호 대책을 쓰시오.","pitfalls":"OWASP Top 10은 중요 위험 범주 안내이며, 개별 취약점의 고유 번호 목록인 CVE와 혼동하지 않는다.","source":"https://top10.owasp.org/2025/","origin":"노트 확장 + 표준/실무 검증"},{"id":"nistpassword","area":"05 정보보호관리 및 법률","title":"2025 NIST 비밀번호 권고 · 기존 규정 비교","priority":2,"terms":["nist","password","15자","비밀번호","다요소","passkey","보안키"],"summary":"NIST SP 800-63B-4는 단일요소 비밀번호 최소 15자, MFA 구성 비밀번호 최소 8자, 정기 변경 강제 금지를 규정한다.","detail":"① 단일요소 로그인 비밀번호 최소 15자, 다요소 인증에 함께 쓰는 비밀번호는 최소 8자를 허용하는 것이 지침이다.\n② 대·소문자/특수문자 조합 등 특정 문자종류 구성을 강제하지 말아야 하며, 탈취된 비밀번호 차단목록, 무차별 대입 제한을 적용해야 한다.\n③ 침해 증거가 없는 정기적 비밀번호 변경 강제는 권장하지 않는다. 침해 시에는 재설정을 요구해야 한다.\n④ 기관별 규정이나 당시 시험 문제의 조항과 NIST 권고를 동일 법적 의무로 혼동해서는 안 된다.","scenario":"서술형: 비밀번호를 90일마다 변경하라는 사내 정책을 NIST 2025 관점에서 평가하고 보완안을 설명한다.","pitfalls":"NIST 지침은 한국 법령 자체가 아니다. 법적 의무·계약·기관 정책을 별도로 확인한다.","source":"https://pages.nist.gov/800-63-4/sp800-63b.html","origin":"노트 확장 + 표준/실무 검증"},{"id":"modern-threat","area":"01 시스템 보안","title":"MITRE ATT&CK · 자격증명 탈취 탐지","priority":2,"terms":["attack","mitre","credential","lsass","dcsync","lateral","edr","powershell"],"summary":"ATT&CK는 공격자 전술·기술을 체계화한 지식베이스이며, 공격 흐름에 맞춰 탐지 데이터를 연결한다.","detail":"① Initial Access, Execution, Persistence, Privilege Escalation, Credential Access, Lateral Movement, Exfiltration 등 전술을 이용해 공격 단계를 표현한다.\n② LSASS 메모리 자격증명 덤프는 ATT&CK T1003.001이며 비정상 프로세스의 LSASS 접근, 메모리 덤프 생성, 연속 인증 시도를 묶어 탐지할 수 있다.\n③ Sysmon, Windows Security, EDR 로그는 서로 다른 관측 범위를 가지며 시각 동기화·계정·프로세스 GUID를 연계해야 탐지 정확도가 높아진다.","scenario":"작업형: Sysmon Event 10(Lsass 접근)과 Event 11(덤프 파일 생성)이 연결될 때 가능한 공격과 대응을 제시한다.","pitfalls":"ATT&CK 분류는 침해 확정 증거가 아니라 관측된 행위를 정리하는 틀이다.","source":"https://attack.mitre.org/techniques/T1003/001/","origin":"노트 확장 + 표준/실무 검증"},{"id":"http-sec","area":"03 애플리케이션 보안","title":"HTTP 응답보안 · TLS · 캐시·CORS","priority":2,"terms":["hsts","content-security-policy","no-store","cache-control","cors","samesite","cookie"],"summary":"Cache-Control:no-cache는 재검증, no-store는 저장하지 않음. CORS는 브라우저의 교차 출처 읽기 제어이다.","detail":"① Cache-Control: no-store는 민감 응답의 저장을 금지하도록 지시하고, no-cache는 재사용 전에 원본 서버 검증을 요구한다.\n② HSTS는 브라우저에 지정 기간 HTTPS만 사용하도록 알린다. CSP는 허용된 스크립트 등 자원 출처를 제한해 XSS 피해 완화를 돕는다.\n③ CORS의 Access-Control-Allow-Origin을 무분별하게 반사하거나 credentials를 허용하면 민감 데이터 노출 위험이 있다. CORS는 서버측 사용자 권한 검사를 대신하지 않는다.\n④ Set-Cookie의 Secure/HttpOnly/SameSite 속성은 각각 전송 경로, 자바스크립트 접근, 사이트 간 요청의 쿠키 전송을 통제한다.","scenario":"작업형: 개인정보 API 응답 헤더에서 ACAO 임의 반사와 Access-Control-Allow-Credentials:true의 위험을 설명한다.","pitfalls":"HSTS가 서버 인증서의 신뢰성을 대신 확인해 주지는 않는다.","source":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control","origin":"노트 확장 + 표준/실무 검증"}];
